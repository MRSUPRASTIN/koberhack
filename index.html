from pathlib import Path

html = r"""<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam Simulator</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial}
#sky{height:60vh;background:linear-gradient(#87ceeb,#d0e8ff);position:relative;overflow:hidden}
#hud{position:absolute;left:10px;top:10px;background:#0008;padding:10px}
#track{position:absolute;bottom:0;width:100%;height:40%;background:#3a3a3a}
#cab{height:40vh;background:#222;padding:15px;display:flex;gap:20px;align-items:center}
button{padding:15px;font-size:18px}
meter{width:250px}
</style>
</head>
<body>
<div id="sky">
<div id="hud">
<div>Скорость: <span id="spd">0</span> км/ч</div>
<div>Давление: <span id="prs">12.0</span> атм</div>
<div>Уголь: <span id="coal">8000</span> кг</div>
<div>Вода: <span id="water">28000</span> л</div>
<div>Регулятор: <span id="reg">0</span>%</div>
</div>
<div id="track"></div>
</div>

<div id="cab">
<button onclick="reg=Math.min(100,reg+5)">Тяга +</button>
<button onclick="reg=Math.max(0,reg-5)">Тяга -</button>
<button onclick="brake=Math.min(100,brake+10)">Тормоз</button>
<button onclick="brake=Math.max(0,brake-10)">Отпустить</button>
<div>
<div>Тормоз</div>
<meter id="bm" min="0" max="100" value="0"></meter>
</div>
</div>

<script>
let speed=0,reg=0,brake=0;
let pressure=12,coal=8000,water=28000;
let mass=1800;

function tick(){
    let traction=(reg/100)*450;
    let resist=20+speed*0.6+(brake/100)*500;

    let acc=(traction-resist)/mass*20;
    speed=Math.max(0,speed+acc);

    coal=Math.max(0,coal-reg*0.03);
    water=Math.max(0,water-reg*0.08);

    pressure += 0.01;
    pressure -= reg*0.002;
    pressure=Math.max(2,Math.min(14,pressure));

    if(coal<=0 || water<=0){
        pressure-=0.05;
    }

    document.getElementById("spd").textContent=speed.toFixed(1);
    document.getElementById("prs").textContent=pressure.toFixed(1);
    document.getElementById("coal").textContent=Math.floor(coal);
    document.getElementById("water").textContent=Math.floor(water);
    document.getElementById("reg").textContent=reg;
    document.getElementById("bm").value=brake;
}
setInterval(tick,50);
</script>
</body>
</html>
"""
path = "/mnt/data/steam_simulator.html"
Path(path).write_text(html, encoding="utf-8")
print(path)
