<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELL-NET // SATELLITE_LINK</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --matrix-blue: #007acc;
            --matrix-glow: rgba(0, 122, 204, 0.6);
            --dark-core: #010205;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-core);
            color: #fff; font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .main-container {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; padding: 15px; box-sizing: border-box;
        }

        .terminal {
            width: 100%; max-width: 600px;
            background: rgba(2, 5, 10, 0.9);
            border: 1px solid var(--matrix-blue);
            box-shadow: 0 0 50px var(--matrix-glow);
            padding: 20px; border-radius: 4px; backdrop-filter: blur(10px);
        }

        /* КОНТЕЙНЕР ДЛЯ РЕАЛЬНОЙ КАРТЫ */
        #map-container {
            display: none;
            width: 100%;
            height: 250px;
            margin-bottom: 15px;
            border: 1px solid var(--matrix-blue);
            position: relative;
            filter: brightness(0.8) contrast(1.2) sepia(0.5) hue-rotate(180deg); /* Хакерский фильтр */
        }

        #map { width: 100%; height: 100%; }

        /* Эффект сетки поверх карты */
        .map-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; pointer-events: none;
            background: 
                linear-gradient(rgba(0, 122, 204, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 122, 204, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--matrix-blue); box-shadow: 0 0 20px var(--matrix-blue);
            z-index: 1001; animation: scan 3s linear infinite;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .terminal-header {
            border-bottom: 1px solid var(--matrix-blue);
            padding-bottom: 8px; margin-bottom: 15px;
            display: flex; justify-content: space-between; font-size: 0.7rem;
        }

        input[type="text"] {
            width: 100%; background: #000; border: 1px solid var(--matrix-blue);
            padding: 15px; color: #fff; font-family: monospace; outline: none; box-sizing: border-box;
        }

        .action-btn {
            width: 100%; background: var(--matrix-blue); color: #000; border: none;
            padding: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        .log-display {
            height: 120px; background: #000; border: 1px solid #112233;
            padding: 10px; overflow-y: auto; font-size: 0.8rem; color: #aaddff; margin-top: 10px;
        }

        .step-final { display: none; text-align: center; padding: 20px; }
        .timer { font-size: 2.5rem; color: #ff3333; font-weight: bold; }
        .final-link {
            display: block; background: #00ff66; color: #000; padding: 20px;
            text-decoration: none; font-weight: bold; margin-top: 15px; border-radius: 4px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-container">
        <div class="terminal">
            <div class="terminal-header">
                <span>SATELLITE_UPLINK_v4.2</span>
                <span id="status">IDLE</span>
            </div>

            <div id="block-input">
                <div style="text-align: center; margin-bottom: 15px;">
                    <img src="https://2ip.io/ru/privacy/bar/26098820_297f2a.png" alt="GEO_BAR">
                </div>
                <input type="text" id="target-input" placeholder="ВВЕДИТЕ @USERNAME">
                <button class="action-btn" onclick="startTracking()">НАЙТИ ОБЪЕКТ</button>
            </div>

            <div id="block-loading" style="display: none;">
                <div id="map-container">
                    <div id="map"></div>
                    <div class="map-overlay"></div>
                    <div class="scan-line"></div>
                </div>
                <div class="log-display" id="log-box"></div>
            </div>

            <div id="block-final" class="step-final">
                <div style="color: #00ff66;">ОБЪЕКТ ЗАПЕЛЕНГОВАН</div>
                <div class="timer" id="countdown">05:00</div>
                <a href="https://t.me/mirieli1977" target="_blank" class="final-link">ПОЛУЧИТЬ ДАННЫЕ В TELEGRAM</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Анимация фона (Огонь)
        const cvs = document.getElementById('bg-canvas');
        const ctx = cvs.getContext('2d');
        cvs.width = window.innerWidth; cvs.height = window.innerHeight;
        let particles = [];
        class Fire {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * cvs.width; this.y = cvs.height + 20;
                this.s = Math.random() * 15 + 5; this.a = Math.random() * 0.4;
            }
            draw() {
                this.y -= 2; this.a -= 0.003;
                if(this.a <= 0) this.init();
                ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2);
                ctx.fillStyle = `rgba(0, 100, 255, ${this.a})`; ctx.fill();
            }
        }
        for(let i=0; i<50; i++) particles.push(new Fire());
        function anim() {
            ctx.fillStyle = '#010205'; ctx.fillRect(0,0,cvs.width,cvs.height);
            particles.forEach(p => p.draw());
            requestAnimationFrame(anim);
        }
        anim();

        // Инициализация карты (Leaflet)
        let map;
        function initMap() {
            // Координаты центра (например, Сан-Франциско как на твоем скрине)
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.7749, -122.4194], 16);
            
            // Слой спутника Esri
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19
            }).addTo(map);

            // Метка объекта
            L.circleMarker([37.7749, -122.4194], { color: 'red', radius: 10 }).addTo(map);
        }

        function startTracking() {
            const user = document.getElementById('target-input').value;
            if(!user) return;

            document.getElementById('block-input').style.display = 'none';
            document.getElementById('block-loading').style.display = 'block';
            document.getElementById('status').innerText = 'SCANNING...';

            initMap();

            const logs = [
                "> Подключение к группировке спутников...",
                "> Поиск сигнала GPS/ГЛОНАСС...",
                `> Триангуляция пользователя ${user}...`,
                "> Найдено совпадение: Сектор 7G",
                "> Захват видеопотока...",
                "[OK] КООРДИНАТЫ ПЕРЕДАНЫ."
            ];

            let i = 0;
            const t = setInterval(() => {
                if(i < logs.length) {
                    const p = document.createElement('div');
                    p.innerText = logs[i];
                    document.getElementById('log-box').appendChild(p);
                    i++;
                } else {
                    clearInterval(t);
                    setTimeout(() => {
                        document.getElementById('block-loading').style.display = 'none';
                        document.getElementById('block-final').style.display = 'block';
                        startTimer();
                    }, 2000);
                }
            }, 1000);
        }

        function startTimer() {
            let s = 300;
            setInterval(() => {
                let m = Math.floor(s/60), sec = s%60;
                document.getElementById('countdown').innerText = `0${m}:${sec<10?'0'+sec:sec}`;
                if(s>0) s--;
            }, 1000);
        }
    </script>
</body>
</html>
