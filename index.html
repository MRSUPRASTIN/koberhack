<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Штурмовик: Удар Орешника</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #ff3333; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #010206 0%, #040813 60%, #0d1324 100%); }

        /* HUD Панель */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(8, 12, 24, 0.9);
            border: 2px solid #ff3333;
            border-radius: 6px;
            padding: 12px 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
            font-size: 15px;
            text-shadow: 0 0 5px #ff3333;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .alert-ui { color: #ff3333; animation: blink 0.2s infinite alternate; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.9);
            border: 1px solid #ff3333;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: auto;
            margin-bottom: 10px;
            color: #fff;
        }

        /* Ослепительная вспышка от Орешника */
        #nuclear-flash {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #ffffff; pointer-events: none; opacity: 0;
        }

        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>
    <div id="nuclear-flash"></div>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">550</span> КМ/Ч</div>
                <div>ТИП КОРУЖИЯ: <span class="hud-val" style="color:#ff3300; text-shadow: 0 0 8px #ff0000;">КВАРТАЛЬНЫЙ ОРТК "ОРЕШНИК"</span></div>
                <div style="color: #ff9900;">РАДИУС ПОРАЖЕНИЯ: <span class="hud-val" style="color:#ff9900;">СПЛОШНОЙ КВАРТАЛ</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right;">
                <div>УГРОЗА: <span class="alert-ui" id="pvo-warn">ПОИСК ЦЕЛЕЙ</span></div>
                <div>УНИЧТОЖЕНО ТЕХНИКИ: <span id="score-out" class="hud-val" style="color: #ffcc00;">0</span></div>
                <div style="color: #00ffff;">РАЗРУШЕНО ЗДАНИЙ: <span id="b-score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="controls-bar">
            💥 <b>ЗАЖМИ ПРОБЕЛ ДЛЯ УДАРА «ОРЕШНИКА»:</b> Снаряд полностью выжигает целый сектор города и всё живое в нём!
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('nuclear-flash');

    const jetImage = new Image();
    jetImage.src = 'mig.png';

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let jet = {
        x: 0, y: 0,
        roll: 0, pitch: 0,
        targetX: 0, targetY: 0,
        speed: 550, altitude: 4000
    };

    let bombs = [];
    let explosions = [];
    let buildings = [];
    let enemies = [];     
    let enemyProjectiles = []; 
    let scoreVehicles = 0;
    let scoreBuildings = 0;
    let isSpacePressed = false; 
    let bombTimer = 0;          
    let muzzleFlash = 0; 

    function initWorld() {
        buildings = [];
        enemies = [];
        
        // Создаем плотную городскую застройку кварталами
        for (let x = -12; x <= 12; x += 2) {
            for (let z = 4; z <= 28; z += 3.5) {
                let worldX = x * 1300 + (Math.random() * 150 - 75);
                let worldZ = z * 1100;
                
                buildings.push({
                    x: worldX, y: -2500, z: worldZ,
                    w: 400, h: 400 + Math.random() * 1000,
                    alive: true
                });

                if (Math.random() < 0.6) {
                    enemies.push({
                        x: worldX + (Math.random() * 300 - 150),
                        y: -2500,
                        z: worldZ + 100,
                        type: Math.random() > 0.4 ? 'tank' : 'pvo',
                        w: 90, h: 50,
                        alive: true,
                        shootCooldown: Math.floor(Math.random() * 50),
                        moveDir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }
        }
    }
    initWorld();

    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.8);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        } else if (type === 'oreshnik') {
            // Сверхнизкий мощный гул взрыва Орешника
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(45, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        } else if (type === 'fire') {
            osc.type = 'square'; osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        jet.roll = nX * 0.9;
        jet.pitch = nY * 0.3;
        jet.targetX = nX * 3400;
        jet.targetY = -nY * 900;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = false;
    });

    // Ослепительная вспышка Орешника
    function triggerOreshnikFlash() {
        flashEl.style.opacity = '1';
        let fade = setInterval(() => {
            flashEl.style.opacity = parseFloat(flashEl.style.opacity) - 0.05;
            if (flashEl.style.opacity <= 0) {
                flashEl.style.opacity = '0';
                clearInterval(fade);
            }
        }, 30);
    }

    function spawnOreshnik() {
        bombs.push({
            x: jet.x,             
            y: jet.y - 100,       
            z: 400,               
            vx: jet.roll * 15,    
            vy: -4,               
            vz: jet.speed * 0.18  
        });
        muzzleFlash = 5; 
        playSound('whistle');
    }

    function project3D(worldX, worldY, worldZ) {
        let relX = worldX - jet.x;
        let relY = worldY - jet.y;

        let x1 = relX * Math.cos(jet.roll) - relY * Math.sin(jet.roll);
        let y1 = relX * Math.sin(jet.roll) + relY * Math.cos(jet.roll);
        let y2 = y1 * Math.cos(jet.pitch) - worldZ * Math.sin(jet.pitch);
        let z2 = y1 * Math.sin(jet.pitch) + worldZ * Math.cos(jet.pitch);

        const fov = 1000;
        let scale = fov / (z2 + 1800);
        return {
            x: (window.innerWidth / 2) + (x1 * scale),
            y: (window.innerHeight * 0.45) - (y2 * scale),
            scale: scale,
            visible: (z2 + 1800 > 0) && (z2 < 28000)
        };
    }

    // ИСПРАВЛЕНО: Глобальный каскадный взрыв, выжигающий КВАРТАЛ
    function detonateOreshnik(targetX, targetZ, screenX, screenY) {
        triggerOreshnikFlash();
        playSound('oreshnik');

        // Огромный радиус уничтожения квартала в 3D мире
        const blastRadiusX = 2600; 
        const blastRadiusZ = 2400;

        // 1. Уничтожаем здания в радиусе квартала
        buildings.forEach(b => {
            if (b.alive && Math.abs(b.x - targetX) < blastRadiusX && Math.abs(b.z - targetZ) < blastRadiusZ) {
                b.alive = false;
                scoreBuildings++;
            }
        });

        // 2. Уничтожаем всю технику врага в квартале
        enemies.forEach(e => {
            if (e.alive && Math.abs(e.x - targetX) < blastRadiusX && Math.abs(e.z - targetZ) < blastRadiusZ) {
                e.alive = false;
                scoreVehicles++;
            }
        });

        document.getElementById('b-score-out').innerText = scoreBuildings;
        document.getElementById('score-out').innerText = scoreVehicles;

        // 3. Спавним каскад из множества расходящихся взрывов (эффект разделяющихся блоков)
        for (let i = 0; i < 25; i++) {
            let offsetX = (Math.random() * 350 - 175) * (i * 0.25);
            let offsetY = (Math.random() * 200 - 100) * (i * 0.25);
            explosions.push({
                x: screenX + offsetX,
                y: screenY + offsetY,
                r: 10 + Math.random() * 15,
                maxR: 120 + Math.random() * 130, // Колоссальные размеры пламени
                delay: i * 2                     // Взрывы идут волновой цепочкой
            });
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        jet.x += (jet.targetX - jet.x) * 0.08;
        jet.y += (jet.targetY - jet.y) * 0.08;

        let speedMult = jet.speed * 0.2;

        // Интервал ударов Орешника для эпичности
        if (isSpacePressed) {
            bombTimer++;
            if (bombTimer % 35 === 0) spawnOreshnik();
        }

        let horizonY = (canvas.height * 0.45) - (jet.pitch * 350) + (jet.y * 0.2);
        ctx.fillStyle = '#010205'; ctx.fillRect(0, 0, canvas.width, horizonY);
        ctx.fillStyle = '#02050e'; ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        // 1. Здания
        buildings.forEach(b => {
            b.z -= speedMult; 
            if (b.z <= -600) { b.z = 25000; b.alive = true; }

            let bottomProj = project3D(b.x, b.y, b.z);
            let topProj = project3D(b.x, b.y + b.h, b.z);

            if (topProj.visible && topProj.y > horizonY) {
                let w3d = b.w * topProj.scale;
                let h3d = bottomProj.y - topProj.y;

                if (b.alive) {
                    ctx.fillStyle = 'rgba(12, 19, 36, 0.95)';
                    ctx.strokeStyle = 'rgba(255, 60, 60, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.fillRect(topProj.x - w3d/2, topProj.y, w3d, h3d);
                    ctx.strokeRect(topProj.x - w3d/2, topProj.y, w3d, h3d);

                    ctx.fillStyle = '#ff9900';
                    let stepX = Math.max(10, w3d / 5);
                    let stepY = Math.max(12, h3d / 7);
                    for (let oy = topProj.y + 12; oy < bottomProj.y - 12; oy += stepY) {
                        for (let ox = topProj.x - w3d/2 + 6; ox < topProj.x + w3d/2 - 6; ox += stepX) {
                            ctx.fillRect(ox, oy, 2, 3);
                        }
                    }
                } else {
                    // Выжженные руины разрушенного квартала
                    ctx.fillStyle = '#050507';
                    ctx.fillRect(bottomProj.x - w3d/2, bottomProj.y - 4, w3d, 6);
                }
            }
        });

        // 2. Враги
        let alertStatus = "ЧИСТО";
        enemies.forEach(e => {
            e.z -= speedMult;
            if (e.z <= -600) { e.z = 25000; e.alive = true; }

            if (e.alive) {
                if (e.type === 'tank') e.x += e.moveDir * 5;

                let proj = project3D(e.x, e.y, e.z);
                if (proj.visible && proj.y > horizonY) {
                    let sz = e.w * proj.scale;

                    if (e.type === 'tank') {
                        ctx.fillStyle = '#2e4a23'; ctx.strokeStyle = '#00ff66';
                        ctx.fillRect(proj.x - sz/2, proj.y - sz*0.3, sz, sz*0.4);
                        if (e.z > 1500 && e.z < 12000) {
                            if (alertStatus !== "CRITICAL LOCK") alertStatus = "ОБСТРЕЛ ИЗ ПУЛЕМЕТОВ";
                            e.shootCooldown++;
                            if (e.shootCooldown % 25 === 0) {
                                enemyProjectiles.push({
                                    x: e.x, y: e.y + 100, z: e.z,
                                    vx: (jet.x - e.x) / 25 + (Math.random() * 80 - 40), 
                                    vy: (jet.y - e.y) / 25, vz: -e.z / 25, type: 'bullet'
                                });
                                playSound('fire');
                            }
                        }
                    } else {
                        ctx.fillStyle = '#4a2323'; ctx.strokeStyle = '#ff3333';
                        ctx.fillRect(proj.x - sz/2, proj.y - sz*0.3, sz, sz*0.4);
                        if (e.z > 2500 && e.z < 18000) {
                            alertStatus = "CRITICAL LOCK (РАКЕТА ПВО)";
                            e.shootCooldown++;
                            if (e.shootCooldown % 60 === 0) {
                                enemyProjectiles.push({
                                    x: e.x, y: e.y + 200, z: e.z,
                                    vx: (jet.x - e.x) / 30, vy: (jet.y - e.y) / 30, vz: -e.z / 30, type: 'missile'
                                });
                                playSound('fire');
                            }
                        }
                    }
                }
            }
        });

        let warnEl = document.getElementById('pvo-warn');
        warnEl.innerText = alertStatus;
        warnEl.className = alertStatus === "ЧИСТО" ? "" : "alert-ui";

        // 3. Снаряды врагов
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let p = enemyProjectiles[i];
            p.x += p.vx; p.y += p.vy; p.z += p.vz;
            let pProj = project3D(p.x, p.y, p.z);

            if (!pProj.visible || p.z <= 0) {
                if (Math.abs(p.x - jet.x) < 500 && Math.abs(p.y - jet.y) < 400) {
                    jet.speed = Math.max(250, jet.speed - (p.type === 'missile' ? 40 : 10));
                }
                enemyProjectiles.splice(i, 1);
                continue;
            }

            ctx.fillStyle = p.type === 'bullet' ? '#00ff66' : '#ff2222';
            ctx.fillRect(pProj.x - 2, pProj.y - 2, Math.max(3, pProj.scale * 10), Math.max(3, pProj.scale * 10));
        }

        // 4. Движение снаряда Орешника до детонации
        for (let i = bombs.length - 1; i >= 0; i--) {
            let bomb = bombs[i];
            bomb.x += bomb.vx; bomb.y += bomb.vy; bomb.z += bomb.vz;
            bomb.vy -= 0.85; // Огромная скорость падения тяжелой боеголовки

            let bProj = project3D(bomb.x, bomb.y, bomb.z);

            if (!bProj.visible || bProj.y > canvas.height || bomb.z > 26000) {
                bombs.splice(i, 1);
                continue;
            }

            // Отрисовка тяжелого гиперзвукового блока
            let bWidth = Math.max(10, bProj.scale * 30);
            let bHeight = Math.max(20, bProj.scale * 60);

            ctx.save();
            ctx.translate(bProj.x, bProj.y);
            let fallAngle = Math.atan2(-bomb.vy, bomb.vz * 0.3) - Math.PI/2;
            ctx.rotate(fallAngle + jet.roll * 0.5);

            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.ellipse(0, 0, bWidth / 2, bHeight / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Огненный след трения о воздух
            ctx.fillStyle = 'rgba(255, 60, 0, 0.6)';
            ctx.fillRect(-bWidth/4, -bHeight, bWidth/2, bHeight/2);
            ctx.restore();

            // Детонация при достижении земли (-2500) — стирает целый КВАРТАЛ
            if (bomb.y <= -2500) {
                detonateOreshnik(bomb.x, bomb.z, bProj.x, bProj.y);
                bombs.splice(i, 1);
            }
        }

        // 5. Отрисовка каскадных мега-взрывов Орешника
        for (let i = explosions.length - 1; i >= 0; i--) {
            let exp = explosions[i];
            if (exp.delay > 0) {
                exp.delay--;
                continue;
            }
            exp.r += 6; // Быстрое расширение фронта ударной волны

            // Внешняя сфера пламени
            ctx.fillStyle = 'rgba(255, 40, 0, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2); ctx.fill();
            
            // Внутреннее плазменное ядро взрыва
            ctx.fillStyle = 'rgba(255, 230, 100, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r * 0.6, 0, Math.PI * 2); ctx.fill();

            if (exp.r >= exp.maxR) explosions.splice(i, 1);
        }

        // 6. Спрайт твоего самолета mig.png
        let screenJetX = (canvas.width / 2) + (jet.x * 0.18);
        let screenJetY = (canvas.height * 0.55) - (jet.y * 0.25);
        
        ctx.save();
        ctx.translate(screenJetX, screenJetY);
        ctx.rotate(jet.roll);
        
        if (muzzleFlash > 0) {
            muzzleFlash--;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-25, 5, 15, 0, Math.PI*2); ctx.arc(25, 5, 15, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = 'rgba(255, 90, 0, 0.85)';
        ctx.fillRect(-12, 38, 5, 14); ctx.fillRect(7, 38, 5, 14);

        const imgSize = 160;
        ctx.drawImage(jetImage, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
        ctx.restore();

        document.getElementById('speed-out').innerText = Math.floor(jet.speed);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
