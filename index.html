<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker ScrollAnimation</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
        }

        /* Контейнер, который задает длину прокрутки (чем больше высота, тем медленнее анимация) */
        .scroll-space {
            height: 400vh;
            position: relative;
        }

        /* Фиксированная секция, где происходит вся магия */
        .sticky-viewport {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .terminal-header {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--neon-green);
        }

        /* Экран, в котором меняются кадры */
        .animation-screen {
            width: 85vw;
            max-width: 900px;
            height: 50vh;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .animation-screen svg {
            width: 100%;
            height: 100%;
            transition: all 0.1s ease;
        }

        .scroll-tip {
            margin-top: 20px;
            font-size: 0.9rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Секция под анимацией */
        .footer-info {
            height: 100vh;
            background: #000;
            border-top: 2px solid var(--neon-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="scroll-space" id="scrollTrigger">
        <div class="sticky-viewport">
            <div class="terminal-header" id="status">STATUS: INITIALIZING EXPLOIT...</div>
            
            <div class="animation-screen" id="screen">
                <!-- Сюда скрипт вставляет кадры -->
            </div>

            <div class="scroll-tip">КРУТИ КОЛЕСО МЫШКИ ВНИЗ ДЛЯ СКАНИРОВАНИЯ</div>
        </div>
    </div>

    <section class="footer-info">
        <div>[ СИСТЕМА ПОЛНОСТЬЮ СКОМПРОМЕТИРОВАНА ]</div>
    </section>

    <script>
        // Кадры анимации (вместо папки с картинками из видео — SVG-код прямо тут)
        const frames = [
            `<svg viewBox="0 0 800 400"><text x="50" y="200" fill="#00ff41" font-size="30" font-family="monospace">[ ] Скан портов: ожидание...</text></svg>`,
            `<svg viewBox="0 0 800 400"><text x="50" y="200" fill="#00ff41" font-size="30" font-family="monospace">[.] Скан портов: 22/tcp OPEN</text></svg>`,
            `<svg viewBox="0 0 800 400"><text x="50" y="200" fill="#00ff41" font-size="30" font-family="monospace">[..] Подбор пароля брутфорсом...</text><rect x="50" y="240" width="150" height="20" fill="#00ff41"/></svg>`,
            `<svg viewBox="0 0 800 400"><text x="50" y="200" fill="#00ff41" font-size="30" font-family="monospace">[...] Брутфорс: 45% подобрано</text><rect x="50" y="240" width="350" height="20" fill="#00ff41"/></svg>`,
            `<svg viewBox="0 0 800 400"><text x="50" y="200" fill="#00ff41" font-size="30" font-family="monospace">[....] Инъекция шелл-кода...</text><rect x="50" y="240" width="600" height="20" fill="#00ff41"/></svg>`,
            `<svg viewBox="0 0 800 400"><text x="50" y="150" fill="#ff0000" font-size="40" font-family="monospace" font-weight="bold">ACCESS GRANTED</text><text x="50" y="220" fill="#ff0000" font-size="20" font-family="monospace">Загрузка ядра управления...</text></svg>`
        ];

        const totalFrames = frames.length;
        const screen = document.getElementById('screen');
        const statusText = document.getElementById('status');
        const scrollTrigger = document.getElementById('scrollTrigger');

        // Рендерим первый кадр сразу
        screen.innerHTML = frames[0];

        window.addEventListener('scroll', () => {
            // Считаем, на сколько процентов прокручена зона анимации
            const rect = scrollTrigger.getBoundingClientRect();
            const scrollTotal = rect.height - window.innerHeight;
            const scrolled = Math.abs(rect.top);

            // Переводим процент прокрутки в индекс кадра (от 0 до максимума)
            let progress = scrolled / scrollTotal;
            if (progress < 0) progress = 0;
            if (progress > 1) progress = 1;

            let frameIndex = Math.floor(progress * (totalFrames - 1));
            
            // Заменяем кадр в экране
            screen.innerHTML = frames[frameIndex];

            // Меняем статусную строку на ходу в зависимости от кадра
            if (frameIndex === totalFrames - 1) {
                statusText.innerText = "STATUS: SYSTEM CRASHED";
                statusText.style.color = "#ff0000";
            } else {
                statusText.innerText = `STATUS: EXPLOITING... COMPONENT [${frameIndex + 1}/${totalFrames}]`;
                statusText.style.color = "#00ff41";
            }
        });
    </script>
</body>
</html>
