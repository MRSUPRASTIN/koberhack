<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Бомбардировщик: Оптимизированный полет</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #ff3333; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #01030a 0%, #050b18 60%, #111a2e 100%); }

        /* HUD Панель */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(10, 15, 30, 0.85);
            border: 2px solid #ff3333;
            border-radius: 6px;
            padding: 12px 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
            font-size: 15px;
            text-shadow: 0 0 5px #ff3333;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .bomb-alert { color: #ffcc00; animation: blink 0.4s infinite alternate; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.9);
            border: 1px solid #ff3333;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: auto;
            margin-bottom: 10px;
            color: #fff;
        }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">550</span> КМ/Ч</div>
                <div>ВЫСОТА: <span class="hud-val" id="alt-out">4500</span> М</div>
                <div style="color: #00ff66;">БОЕЗАПАС: <span class="hud-val" style="color:#00ff66;">БЕСКОНЕЧНО</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right;">
                <div>ВЫСОТА ПОЛЕТА: <span class="bomb-alert" style="color: #00ffff;">ЭШЕЛОН ВЕРХНИЙ</span></div>
                <div>ОПТИМИЗАЦИЯ: <span class="hud-val" style="color: #00ff66;">60 FPS</span></div>
                <div style="color: #ffcc00;">СБИТО ОБЪЕКТОВ: <span id="score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="controls-bar">
            ✈️ Мышь — Управление | <b>W / S</b> — Скорость | <b style="color: #ffcc00;">ЗАЖМИ ПРОБЕЛ ДЛЯ СБРОСА БОМБ</b>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const jetImage = new Image();
    jetImage.src = 'mig.png';

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // Самолёт летит на большой высоте
    let jet = {
        x: 0, y: 0,
        roll: 0, pitch: 0,
        targetRoll: 0, targetPitch: 0,
        speed: 550, altitude: 4500, throttle: 70
    };

    let bombs = [];
    let explosions = [];
    let buildings = [];
    let score = 0;
    let isSpacePressed = false; 
    let bombTimer = 0;          

    // Оптимизированная генерация города (меньше объектов, больше масштаб)
    function generateCity() {
        buildings = [];
        for (let x = -8; x <= 8; x += 2) {
            for (let z = 3; z <= 25; z += 3) {
                buildings.push({
                    x: x * 1200 + (Math.random() * 300 - 150),
                    y: -2800,  // Город опущен глубоко вниз
                    z: z * 1200,
                    w: 400,    // Дома стали крупнее
                    h: 400 + Math.random() * 900, 
                    alive: true
                });
            }
        }
    }
    generateCity();

    // Оптимизированный Web Audio API
    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'boom') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(70, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        jet.targetRoll = nX * 1.1;
        jet.targetPitch = nY * 0.4;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = true;
        if (e.key === 'w' || e.key === 'W') jet.throttle = Math.min(100, jet.throttle + 10);
        if (e.key === 's' || e.key === 'S') jet.throttle = Math.max(20, jet.throttle - 10);
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = false;
    });

    function spawnBomb() {
        bombs.push({
            x: jet.roll * 30,
            y: -100, 
            z: 150,
            vx: jet.roll * 12, 
            vy: -6, 
            vz: jet.speed * 0.15 
        });
        playSound('whistle');
    }

    // 3D Проекция с учетом высокой перспективы полета
    function project3D(x, y, z, pitch, roll) {
        let x1 = x * Math.cos(roll) - y * Math.sin(roll);
        let y1 = x * Math.sin(roll) + y * Math.cos(roll);
        let y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch);
        let z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);

        const fov = 1000;
        let scale = fov / (z2 + 1800);
        return {
            x: (window.innerWidth / 2) + (x1 * scale),
            y: (window.innerHeight * 0.4) - (y2 * scale), // Смещено к центру для ощущения высоты
            scale: scale,
            visible: (z2 + 1800 > 0) && (z2 < 30000)
        };
    }

    function drawPlayerJet(x, y, roll) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(roll);

        ctx.fillStyle = 'rgba(255, 60, 0, 0.8)';
        ctx.fillRect(-12, 40, 5, 15);
        ctx.fillRect(7, 40, 5, 15);

        const size = 160; // Немного уменьшили самолет для ощущения высоты полета
        ctx.drawImage(jetImage, -size / 2, -size / 2, size, size);
        ctx.restore();
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        jet.roll += (jet.targetRoll - jet.roll) * 0.1;
        jet.pitch += (jet.targetPitch - jet.pitch) * 0.1;
        jet.speed += ((jet.throttle * 8) - jet.speed) * 0.05;
        
        // Высота стабильна на верхнем эшелоне
        jet.altitude += Math.sin(-jet.pitch) * (jet.speed * 0.04);
        if (jet.altitude < 1000) jet.altitude = 1000; 

        let speedMult = jet.speed * 0.18;

        if (isSpacePressed) {
            bombTimer++;
            if (bombTimer % 7 === 0) spawnBomb(); // Стабильный шаг сброса
        }

        let horizonY = (canvas.height * 0.4) - (jet.pitch * 350);
        ctx.fillStyle = '#010207'; ctx.fillRect(0, 0, canvas.width, horizonY);
        ctx.fillStyle = '#03060f'; ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        // Отрендерить 3D здания
        buildings.forEach(b => {
            b.z -= speedMult; 
            if (b.z <= -600) { 
                b.z = 24000; // Циклический перенос вперед
                b.alive = true; 
            }

            let bottomProj = project3D(b.x, b.y, b.z, jet.pitch, jet.roll);
            let topProj = project3D(b.x, b.y + b.h, b.z, jet.pitch, jet.roll);

            if (topProj.visible && topProj.y > horizonY) {
                let w3d = b.w * topProj.scale;
                let h3d = bottomProj.y - topProj.y;

                if (b.alive) {
                    ctx.fillStyle = 'rgba(12, 18, 36, 0.95)';
                    ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
                    ctx.lineWidth = 1;
                    
                    ctx.fillRect(topProj.x - w3d/2, topProj.y, w3d, h3d);
                    ctx.strokeRect(topProj.x - w3d/2, topProj.y, w3d, h3d);

                    // Оптимизированная быстрая сетка окон без тригонометрии
                    ctx.fillStyle = '#ffcc00';
                    let stepX = Math.max(6, w3d / 6);
                    let stepY = Math.max(8, h3d / 10);
                    for (let oy = topProj.y + 10; oy < bottomProj.y - 10; oy += stepY) {
                        for (let ox = topProj.x - w3d/2 + 6; ox < topProj.x + w3d/2 - 6; ox += stepX) {
                            ctx.fillRect(ox, oy, 2, 3);
                        }
                    }
                } else {
                    // Руины внизу
                    ctx.fillStyle = '#09090b';
                    ctx.fillRect(bottomProj.x - w3d/2, bottomProj.y - 8, w3d, 10);
                    if (Math.random() < 0.15) { 
                        ctx.fillStyle = '#ff3300';
                        ctx.fillRect(bottomProj.x + (Math.random()*w3d - w3d/2), bottomProj.y - 12, 8, 8);
                    }
                }
            }
        });

        // Оптимизированный обсчет бомб
        for (let i = bombs.length - 1; i >= 0; i--) {
            let bomb = bombs[i];
            
            bomb.x += bomb.vx;
            bomb.y += bomb.vy; 
            bomb.z += bomb.vz;
            bomb.vy -= 0.5; // Гравитация падения на землю

            let bProj = project3D(bomb.x, bomb.y, bomb.z, jet.pitch, jet.roll);

            // Если бомба вышла за экран или улетела слишком далеко — удаляем сразу (фикс лагов)
            if (!bProj.visible || bomb.z > 25000 || bProj.y > canvas.height) {
                bombs.splice(i, 1);
                continue;
            }

            ctx.fillStyle = '#95a5a6';
            ctx.beginPath();
            ctx.arc(bProj.x, bProj.y, Math.max(2, bProj.scale * 10), 0, Math.PI * 2);
            ctx.fill();

            // Проверка коллизий
            buildings.forEach(b => {
                if (b.alive && Math.abs(bomb.x - b.x) < b.w && Math.abs(bomb.z - b.z) < b.w) {
                    if (bomb.y <= b.y + b.h && bomb.y >= b.y) {
                        b.alive = false; 
                        score++;
                        document.getElementById('score-out').innerText = score;
                        playSound('boom');
                        explosions.push({ x: bProj.x, y: bProj.y, r: 8, maxR: 60 });
                        bombs.splice(i, 1);
                    }
                }
            });

            // Взрыв на нулевой точке земли
            if (bomb.y <= -2800) {
                explosions.push({ x: bProj.x, y: bProj.y, r: 5, maxR: 35 });
                playSound('boom');
                bombs.splice(i, 1);
            }
        }

        // Взрывы
        for (let i = explosions.length - 1; i >= 0; i--) {
            let exp = explosions[i];
            exp.r += 5;
            ctx.fillStyle = 'rgba(255, 50, 0, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255, 200, 0, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r * 0.5, 0, Math.PI * 2); ctx.fill();
            if (exp.r >= exp.maxR) explosions.splice(i, 1);
        }

        // Отрисовка самолета по центру
        let myX = (canvas.width / 2) + (jet.roll * 50);
        let myY = (canvas.height * 0.55) + (jet.pitch * 30);
        drawPlayerJet(myX, myY, jet.roll);

        document.getElementById('speed-out').innerText = Math.floor(jet.speed);
        document.getElementById('alt-out').innerText = Math.floor(jet.altitude + 3000); // Коррекция высоты на HUD

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
