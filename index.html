<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELL-NET // EXPLOIT INTERFACE</title>
    <style>
        :root {
            --matrix-blue: #007acc;
            --matrix-glow: rgba(0, 122, 204, 0.6);
            --dark-core: #03060a;
            --accent-red: #ff3333;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-core);
            color: #fff; font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .main-container {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; box-sizing: border-box;
        }

        .terminal {
            width: 100%; max-width: 650px;
            background: rgba(4, 8, 15, 0.92);
            border: 1px solid var(--matrix-blue);
            box-shadow: 0 0 50px var(--matrix-glow);
            padding: 30px; border-radius: 8px; backdrop-filter: blur(15px);
            position: relative; border-top: 4px solid var(--matrix-blue);
        }

        /* Красивая обертка для информера */
        .informer-wrapper {
            position: relative;
            margin: 0 auto 20px auto;
            padding: 10px;
            background: rgba(0, 122, 204, 0.05);
            border: 1px dashed var(--matrix-blue);
            display: inline-block;
            transition: 0.5s;
            animation: pulse-border 2s infinite;
        }

        .informer-wrapper::before {
            content: "SYSTEM_SCAN_REPORT";
            position: absolute; top: -10px; left: 10px;
            background: var(--dark-core); padding: 0 5px;
            font-size: 0.6rem; color: var(--matrix-blue);
        }

        .informer-wrapper img {
            display: block;
            filter: hue-rotate(190deg) brightness(1.1); /* Подгоняем цвет под синий стиль */
            max-width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes pulse-border {
            0% { border-color: rgba(0, 122, 204, 0.3); }
            50% { border-color: var(--matrix-blue); box-shadow: 0 0 15px var(--matrix-glow); }
            100% { border-color: rgba(0, 122, 204, 0.3); }
        }

        .terminal-header {
            border-bottom: 1px solid rgba(0, 122, 204, 0.3);
            padding-bottom: 12px; margin-bottom: 25px;
            font-size: 0.85rem; color: var(--matrix-blue);
            display: flex; justify-content: space-between;
            text-transform: uppercase; letter-spacing: 2px;
        }

        #slots-info {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 51, 51, 0.1);
            border: 1px solid var(--accent-red); padding: 12px;
            font-size: 0.8rem; color: var(--accent-red); z-index: 10;
            box-shadow: 0 0 10px rgba(255,0,0,0.2);
        }

        .step-input h2 { margin: 0 0 15px; font-size: 1.2rem; color: #fff; text-align: center;}
        
        input[type="text"] {
            width: 100%; background: #000; border: 1px solid var(--matrix-blue);
            padding: 15px; color: #fff; font-family: monospace; outline: none;
            box-sizing: border-box; font-size: 1.1rem; text-align: center;
        }

        .action-btn {
            width: 100%; background: var(--matrix-blue); color: #000; border: none;
            padding: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            margin-top: 15px; letter-spacing: 2px; transition: 0.3s;
        }
        .action-btn:hover { background: #fff; box-shadow: 0 0 25px #fff; }

        .step-loading { display: none; flex-direction: column; height: 320px; }
        .log-display {
            flex-grow: 1; background: #000; border: 1px solid #112233;
            padding: 15px; overflow-y: auto; font-size: 0.9rem; color: #aaddff;
            display: flex; flex-direction: column; gap: 8px;
        }
        .log-success { color: #00ff66; text-shadow: 0 0 5px #00ff66; }

        .step-final { display: none; text-align: center; flex-direction: column; gap: 20px; }
        .timer-box { font-size: 2.2rem; color: var(--accent-red); font-weight: bold; text-shadow: 0 0 15px red; }
        
        .final-link {
            display: inline-block; background: var(--matrix-blue); color: #000;
            text-decoration: none; padding: 20px 40px; font-weight: bold;
            font-size: 1.2rem; box-shadow: 0 0 30px var(--matrix-glow);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #live-notifications { position: fixed; bottom: 20px; left: 20px; z-index: 10; }
        .notify-toast {
            background: rgba(0, 122, 204, 0.15); border-left: 4px solid var(--matrix-blue);
            padding: 12px; margin-top: 10px; font-size: 0.75rem; border-radius: 0 4px 4px 0;
            animation: slide 0.5s ease; backdrop-filter: blur(5px);
        }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div id="slots-info">АКТИВНЫЕ СЛОТЫ: <span id="slot-count">3</span>/100</div>
    <div id="live-notifications"></div>

    <div class="main-container">
        <div class="terminal">
            <div class="terminal-header">
                <span>Network Bypass v9.0</span>
                <span>Status: Encrypted</span>
            </div>

            <div id="block-input" class="step-input" style="text-align: center;">
                <div class="informer-wrapper">
                    <a href="https://2ip.io/ru/privacy/" target="_blank">
                        <img src="https://2ip.io/ru/privacy/bar/26098820_297f2a.png" alt="ID_DATA">
                    </a>
                </div>
                <h2>Инициализация цифрового профиля</h2>
                <input type="text" id="target-input" placeholder="ВВЕДИТЕ @USERNAME" autocomplete="off">
                <button class="action-btn" onclick="startExploit()">Сгенерировать доступ</button>
            </div>

            <div id="block-loading" class="step-loading">
                <div class="log-display" id="log-box"></div>
            </div>

            <div id="block-final" class="step-final">
                <div style="color:#00ff66; font-size: 1.1rem; letter-spacing: 1px;">ПАКЕТ ДАННЫХ СФОРМИРОВАН</div>
                
                <div class="informer-wrapper" style="margin: 5px auto;">
                    <img src="https://2ip.io/ru/privacy/bar/26098820_297f2a.png" alt="ID_DATA">
                </div>

                <div class="timer-box" id="countdown">05:00</div>
                <a href="https://t.me/mirieli1977" target="_blank" class="final-link">ПОДТВЕРДИТЬ В TELEGRAM</a>
                <p style="font-size: 0.7rem; color: #555; text-transform: uppercase;">Система аннулирует доступ через 300 секунд</p>
            </div>
        </div>
    </div>

    <script>
        // Анимация синего огня
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        class Flame {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.speed = Math.random() * 1.5 + 0.5;
                this.radius = Math.random() * 20 + 5;
                this.opacity = Math.random() * 0.3 + 0.1;
            }
            draw() {
                this.y -= this.speed;
                this.opacity -= 0.0015;
                if (this.opacity <= 0) this.reset();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 122, 255, ${this.opacity})`;
                ctx.fill();
            }
        }
        for(let i=0; i<60; i++) particles.push(new Flame());
        function anim() {
            ctx.fillStyle = '#03060a'; ctx.fillRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => p.draw());
            requestAnimationFrame(anim);
        }
        anim();

        // Звуковой эффект
        function beep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.frequency.setValueAtTime(400, audioCtx.currentTime);
            g.gain.setValueAtTime(0.01, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.05);
        }

        function startExploit() {
            const input = document.getElementById('target-input').value.trim();
            if(!input) return;
            document.getElementById('block-input').style.display = 'none';
            document.getElementById('block-loading').style.display = 'flex';
            
            const logBox = document.getElementById('log-box');
            const logs = [
                "> Загрузка данных информера...",
                "> Проверка IP-адреса...",
                "> Установка зашифрованного туннеля...",
                `> Цель: [${input}] подтверждена.`,
                "> Взлом базы данных хэшей...",
                "> Обход системы верификации...",
                "[OK] ТОКЕН ДОСТУПА ПРИВЯЗАН К ВАШЕМУ IP."
            ];

            let i = 0;
            const t = setInterval(() => {
                if(i < logs.length) {
                    beep();
                    const p = document.createElement('p');
                    if(logs[i].includes('[OK]')) p.className = 'log-success';
                    p.innerText = logs[i];
                    logBox.appendChild(p);
                    logBox.scrollTop = logBox.scrollHeight;
                    i++;
                } else {
                    clearInterval(t);
                    setTimeout(() => {
                        document.getElementById('block-loading').style.display = 'none';
                        document.getElementById('block-final').style.display = 'flex';
                        startTimer();
                    }, 1000);
                }
            }, 900);
        }

        function startTimer() {
            let s = 300;
            const cd = document.getElementById('countdown');
            setInterval(() => {
                let m = Math.floor(s/60); let sc = s%60;
                cd.innerText = `0${m}:${sc<10?'0'+sc:sc}`;
                if(s>0) s--;
            }, 1000);
        }

        // Рандомные уведомления
        const nicks = ['@hacker_v', '@pro_ton', '@crypto_user', '@anon_777', '@mir_ieli'];
        setInterval(() => {
            const c = document.getElementById('live-notifications');
            const d = document.createElement('div'); d.className = 'notify-toast';
            d.innerText = `Доступ выдан для ${nicks[Math.floor(Math.random()*nicks.length)]}`;
            c.appendChild(d); setTimeout(() => d.remove(), 4000);
        }, 5500);
    </script>
</body>
</html>
