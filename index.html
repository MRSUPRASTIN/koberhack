<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Водителя Автобуса</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #87ceeb;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .ui-element {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #444;
        }

        #controls-hint {
            margin-top: 15px;
            color: #aaa;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .highlight {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px;">Симулятор Автобуса: Городской Рейс</h2>

    <div id="gameContainer">
        <div id="ui">
            <div class="ui-element">Баланс: <span id="money" class="highlight">0</span> руб.</div>
            <div class="ui-element" id="task">Задание: <span class="highlight" style="color: #55ff55;">Двигайтесь к остановке</span></div>
            <div class="ui-element">Пассажиры: <span id="passengers" class="highlight">0</span>/20</div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div id="controls-hint">
        <strong>Управление:</strong> Стрелка Влево / Вправо — газ и тормоз (назад). <br>
        <strong>Задача:</strong> Плавно остановитесь на остановке (<span style="color: #ff5555; font-weight: bold;">Красная зона</span>), подождите посадки и везите людей дальше!
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Элементы интерфейса
const moneyEl = document.getElementById('money');
const taskEl = document.getElementById('task');
const passengersEl = document.getElementById('passengers');

// Игровые переменные
let money = 0;
let passengerCount = 0;
let gameSpeed = 0;
const maxSpeed = 7;
const acceleration = 0.15;
const friction = 0.05;
const braking = 0.3;

// Положение мира (скроллинг)
let worldX = 0;

// Клавиши управления
const keys = { Left: false, Right: false };

// Автобус
const bus = {
    x: 150, // Фиксированная позиция на экране
    y: 280,
    width: 160,
    height: 60,
    wheelRotation: 0
};

// Остановка
const busStop = {
    worldX: 900, // Позиция в мире
    width: 120,
    height: 80,
    hasPassengers: true,
    active: true,
    timer: 0,
    requiredStopDuration: 100 // Время на посадку/высадку
};

// Декорации (облака, деревья, дома для ощущения скорости)
const scenery = [];
function generateScenery() {
    // Деревья
    for (let i = 0; i < 20; i++) {
        scenery.push({
            x: i * 300 + Math.random() * 100,
            y: 240,
            type: 'tree',
            size: 30 + Math.random() * 20
        });
    }
    // Дома на фоне
    for (let i = 0; i < 10; i++) {
        scenery.push({
            x: i * 600 + Math.random() * 200,
            y: 160,
            type: 'building',
            width: 100 + Math.random() * 80,
            height: 120 + Math.random() * 60,
            color: `hsl(${Math.random() * 360}, 30%, 50%)`
        });
    }
}
generateScenery();

// Слушатели клавиатуры
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') keys.Right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') keys.Left = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') keys.Right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') keys.Left = false;
});

// Главный игровой цикл
function update() {
    // 1. Физика движения автобуса
    if (keys.Right) {
        gameSpeed += acceleration;
        if (gameSpeed > maxSpeed) gameSpeed = maxSpeed;
    } else if (keys.Left) {
        gameSpeed -= braking;
        if (gameSpeed < -maxSpeed / 2) gameSpeed = -maxSpeed / 2;
    } else {
        // Плавное замедление (инерция)
        if (gameSpeed > 0) gameSpeed -= friction;
        if (gameSpeed < 0) gameSpeed += friction;
        if (Math.abs(gameSpeed) < friction) gameSpeed = 0;
    }

    // Двигаем мир вокруг автобуса
    worldX += gameSpeed;
    bus.wheelRotation += gameSpeed * 0.05;

    // 2. Логика остановки
    // Вычисляем экранную координату остановки
    let stopScreenX = busStop.worldX - worldX + bus.x;

    // Проверяем, находится ли автобус ровно на остановке
    let isOnStop = (bus.x + bus.width / 2 > stopScreenX) && 
                   (bus.x + bus.width / 2 < stopScreenX + busStop.width);

    if (isOnStop && Math.abs(gameSpeed) < 0.2) {
        gameSpeed = 0; // Полная остановка
        busStop.timer++;

        if (busStop.hasPassengers) {
            taskEl.innerHTML = `Посадка пассажиров... <span class="highlight">${Math.round(busStop.timer / busStop.requiredStopDuration * 100)}%</span>`;
            if (busStop.timer >= busStop.requiredStopDuration) {
                // Пассажиры сели
                let boarded = Math.floor(Math.random() * 8) + 5;
                passengerCount += boarded;
                passengersEl.innerText = passengerCount;
                busStop.hasPassengers = false;
                busStop.timer = 0;
                busStop.worldX += 1200; // Перемещаем следующую остановку дальше
                taskEl.innerHTML = `<span style="color: #ffaa00;">Езжайте к следующей остановке!</span>`;
            }
        } else {
            // Высадка (если уже были пассажиры)
            taskEl.innerHTML = `Высадка пассажиров... <span class="highlight">${Math.round(busStop.timer / busStop.requiredStopDuration * 100)}%</span>`;
            if (busStop.timer >= busStop.requiredStopDuration) {
                let left = Math.min(passengerCount, Math.floor(Math.random() * 6) + 4);
                passengerCount -= left;
                money += left * 50; // 50 рублей за билет
                
                moneyEl.innerText = money;
                passengersEl.innerText = passengerCount;
                
                busStop.hasPassengers = true; // На следующей остановке снова будут люди
                busStop.timer = 0;
                busStop.worldX += 1500; // Следующая остановка дальше
                taskEl.innerHTML = `<span style="color: #55ff55;">Отлично! Двигайтесь дальше.</span>`;
            }
        }
    } else {
        if (busStop.timer > 0 && !isOnStop) {
            // Если уехал, не дождавшись
            busStop.timer = 0;
            taskEl.innerHTML = `<span style="color: #ff5555;">Вы уехали раньше времени!</span>`;
        }
    }

    draw();
    requestAnimationFrame(update);
}

// Отрисовка графики
function draw() {
    // Очистка экрана (Небо)
    ctx.fillStyle = '#87ceeb';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Солнце
    ctx.fillStyle = '#fdfd96';
    ctx.beginPath();
    ctx.arc(700, 60, 40, 0, Math.PI * 2);
    ctx.fill();

    // Рисуем задний план (декорации)
    scenery.forEach(item => {
        let screenX = item.x - worldX * 0.5; // Эффект параллакса (задний план движется медленнее)
        // Цикличность декораций
        if (screenX < -200) item.x += 3000;
        if (screenX > canvas.width + 200) item.x -= 3000;

        if (item.type === 'building') {
            ctx.fillStyle = item.color;
            ctx.fillRect(screenX, item.y, item.width, item.height);
            // Окна
            ctx.fillStyle = '#f0f0d0';
            for (let wx = screenX + 10; wx < screenX + item.width - 10; wx += 25) {
                for (let wy = item.y + 10; wy < item.y + item.height - 10; wy += 30) {
                    ctx.fillRect(wx, wy, 15, 20);
                }
            }
        } else if (item.type === 'tree') {
            ctx.fillStyle = '#8B4513'; // Ствол
            ctx.fillRect(screenX + 10, item.y, 10, 40);
            ctx.fillStyle = '#228B22'; // Листва
            ctx.beginPath();
            ctx.arc(screenX + 15, item.y, item.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Рисуем дорогу
    ctx.fillStyle = '#555';
    ctx.fillRect(0, 320, canvas.width, 80);
    
    // Разметка дороги
    ctx.fillStyle = '#fff';
    let dashWidth = 40;
    let dashGap = 30;
    let startDashX = -(worldX % (dashWidth + dashGap));
    for (let x = startDashX; x < canvas.width; x += dashWidth + dashGap) {
        ctx.fillRect(x, 355, dashWidth, 6);
    }

    // Тратуар / Обочина
    ctx.fillStyle = '#777';
    ctx.fillRect(0, 310, canvas.width, 10);

    // РИСУЕМ ОСТАНОВКУ
    let stopScreenX = busStop.worldX - worldX + bus.x;
    // Разметка зоны остановки (красная линия на асфальте)
    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
    ctx.fillRect(stopScreenX, 310, busStop.width, 15);

    // Навес остановки
    ctx.fillStyle = '#333';
    ctx.fillRect(stopScreenX + 10, 230, busStop.width - 20, 10); // Крыша
    ctx.fillStyle = '#aaa';
    ctx.fillRect(stopScreenX + 15, 240, 6, 70); // Опора левая
    ctx.fillRect(stopScreenX + busStop.width - 21, 240, 6, 70); // Опора правая
    ctx.fillStyle = 'rgba(0, 150, 255, 0.4)';
    ctx.fillRect(stopScreenX + 21, 240, busStop.width - 42, 50); // Стекло

    // Знак остановки
    ctx.fillStyle = '#333';
    ctx.fillRect(stopScreenX - 20, 220, 4, 90); // столб
    ctx.fillStyle = '#1e90ff';
    ctx.fillRect(stopScreenX - 30, 200, 24, 24); // синий квадрат
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText("А", stopScreenX - 23, 217); // Буква А

    // Люди на остановке
    if (busStop.hasPassengers) {
        ctx.fillStyle = '#ff6347';
        for(let i=0; i<5; i++) {
            ctx.beginPath();
            ctx.arc(stopScreenX + 30 + (i*15), 290, 6, 0, Math.PI*2); // Голова
            ctx.fill();
            ctx.fillRect(stopScreenX + 26 + (i*15), 296, 8, 15); // Тело
        }
    }


    // РИСУЕМ АВТОБУС
    ctx.save();
    // Корпус автобуса
    ctx.fillStyle = '#ffcc00'; // Желтый городской автобус
    ctx.fillRect(bus.x, bus.y, bus.width, bus.height);

    // Нижня полоса (дизайн)
    ctx.fillStyle = '#333';
    ctx.fillRect(bus.x, bus.y + bus.height - 10, bus.width, 10);

    // Окна автобуса
    ctx.fillStyle = '#333';
    for (let i = 0; i < 5; i++) {
        // Окна пассажиров
        ctx.fillRect(bus.x + 15 + (i * 26), bus.y + 10, 20, 22);
    }
    // Лобовое стекло (водителя)
    ctx.fillStyle = '#222';
    ctx.fillRect(bus.x + 140, bus.y + 8, 15, 24);

    // Фары
    ctx.fillStyle = '#ffffaa';
    ctx.fillRect(bus.x + bus.width - 2, bus.y + bus.height - 20, 3, 8); // Передняя
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(bus.x, bus.y + bus.height - 20, 2, 8); // Задняя сабвуферная

    // Колёса (Анимация вращения)
    drawWheel(bus.x + 35, bus.y + bus.height);
    drawWheel(bus.x + bus.width - 35, bus.y + bus.height);

    ctx.restore();
}

function drawWheel(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(bus.wheelRotation);

    // Шина
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();

    // Диск
    ctx.fillStyle = '#ccc';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();

    // Спицы (чтобы было видно вращение)
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
    ctx.moveTo(0, -8); ctx.lineTo(0, 8);
    ctx.stroke();

    ctx.restore();
}

// Запуск игры
update();
</script>

</body>
</html>
