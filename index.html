<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Симулятор вождения от первого лица</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #4CAF50;
            letter-spacing: 1px;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
        }
        #instructions h2 {
            margin-top: 0;
            color: #4CAF50;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">Скорость: <span id="speed">0</span> км/ч</div>
    
    <div id="instructions">
        <h2>Управление:</h2>
        * <b>W / Стрелка Вверх</b> — Газ<br>
        * <b>S / Стрелка Вниз</b> — Тормоз / Назад<br>
        * <b>A, D / Стрелки Влево, Вправо</b> — Поворот руля<br>
        <br>
        <i>Свободная езда. Без штрафов и бензина!</i>
    </div>

    <script>
        // --- Настройки сцены ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небо
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        sunLight.position.set(100, 200, 50);
        scene.add(sunLight);

        // --- Физика и состояние машины ---
        const car = {
            x: 0,
            z: 0,
            speed: 0,
            maxSpeed: 80, // Максимальная скорость вперед
            maxReverseSpeed: -20, // Максимальная скорость назад
            acceleration: 0.5,
            deceleration: 0.2,
            friction: 0.05,
            angle: 0,
            steeringSpeed: 0.03
        };

        // Управление кнопками
        const keys = { w: false, a: false, s: false, d: false };

        // --- Создание окружения (Земля и Дорога) ---
        const worldWidth = 400;
        const worldLength = 2000;

        // Зеленая земля
        const groundGeo = new THREE.PlaneGeometry(worldWidth, worldLength, 40, 100);
        
        // Делаем рельеф (холмы)
        const pos = groundGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let z = pos.getY(i); // В плоскости PlaneGeometry Y — это глубина (Z в мире)
            
            // Оставляем центр под дорогу ровным, холмы только по бокам
            if (Math.abs(x) > 15) {
                let hill = Math.sin(x * 0.05) * Math.cos(z * 0.02) * 5;
                pos.setZ(i, hill); // Меняем высоту
            }
        }
        groundGeo.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3B7A57, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2; // Укладываем горизонтально
        scene.add(ground);

        // Бесконечная прямая дорога
        const roadGeo = new THREE.PlaneGeometry(16, worldLength);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01; // Слегка приподнимем над травой, чтобы не мерцало
        scene.add(road);

        // Разметка дороги (пунктир)
        const markerCount = 100;
        const markerGeo = new THREE.PlaneGeometry(0.3, 4);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
        const markersGroup = new THREE.Group();

        for(let i = 0; i < markerCount; i++) {
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.rotation.x = -Math.PI / 2;
            marker.position.set(0, 0.02, - (i * 20));
            markersGroup.add(marker);
        }
        scene.add(markersGroup);

        // --- Декорации (Деревья по бокам) ---
        function createTree(x, z) {
            const tree = new THREE.Group();
            
            // Ствол
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 2, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5C4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            tree.add(trunk);

            // Листва
            const leavesGeo = new THREE.ConeGeometry(1.5, 3, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2E8B57, roughness: 0.6 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 3;
            tree.add(leaves);

            tree.position.set(x, 0, z);
            scene.add(tree);
        }

        // Расставляем случайные деревья по обочинам
        for (let i = 0; i < 150; i++) {
            let side = Math.random() > 0.5 ? 1 : -1;
            let x = (15 + Math.random() * 80) * side;
            let z = -(Math.random() * (worldLength - 100));
            createTree(x, z);
        }

        // --- Кабина автомобиля (Элементы первого лица) ---
        // Самой машины снаружи мы не видим, создаем только капот и руль перед камерой
        const dashboardGroup = new THREE.Group();

        // Капот машины перед глазами
        const hoodGeo = new THREE.BoxGeometry(2, 0.5, 2);
        const hoodMat = new THREE.MeshStandardMaterial({ color: 0x990000, roughness: 0.3, metalness: 0.5 }); // Красный спорткар
        const hood = new THREE.Mesh(hoodGeo, hoodMat);
        hood.position.set(0, -0.6, -1.2);
        dashboardGroup.add(hood);

        // Торпеда / Панель
        const dashGeo = new THREE.BoxGeometry(2.2, 0.4, 0.5);
        const dashMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const dash = new THREE.Mesh(dashGeo, dashMat);
        dash.position.set(0, -0.5, -0.3);
        dashboardGroup.add(dash);

        // Рулевое колесо
        const wheelGeo = new THREE.TorusGeometry(0.2, 0.03, 8, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const steeringWheel = new THREE.Mesh(wheelGeo, wheelMat);
        steeringWheel.position.set(-0.4, -0.35, -0.4); // Руль слева
        steeringWheel.rotation.x = 0.3; // Наклонен к водителю
        dashboardGroup.add(steeringWheel);

        scene.add(dashboardGroup);

        // Начальная позиция игрока
        camera.position.set(-0.4, 1.2, 0); // Позиция глаз водителя (чуть слева, на высоте)

        // --- Обработка ввода ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        });

        // HTML HUD
        const speedDisplay = document.getElementById('speed');

        // --- Главный игровой цикл ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Управление скоростью (Газ / Тормоз)
            if (keys.w) {
                if (car.speed < car.maxSpeed) car.speed += car.acceleration;
            } else if (keys.s) {
                if (car.speed > car.maxReverseSpeed) car.speed -= car.acceleration * 1.5; // Тормозит быстрее, чем разгоняется
            } else {
                // Плавное трение / остановка, если ничего не нажато
                if (car.speed > 0) car.speed -= car.friction;
                if (car.speed < 0) car.speed += car.friction;
                if (Math.abs(car.speed) < 0.1) car.speed = 0;
            }

            // 2. Поворот руля колес и анимация руля в салоне
            let targetWheelRotation = 0;
            if (Math.abs(car.speed) > 0.5) { // Поворачивать можно только в движении
                const speedModifier = car.speed > 0 ? 1 : -1; // Реверс поворота при движении назад
                
                if (keys.a) {
                    car.angle += car.steeringSpeed * speedModifier * (Math.abs(car.speed) / car.maxSpeed + 0.3);
                    targetWheelRotation = 0.8;
                }
                if (keys.d) {
                    car.angle -= car.steeringSpeed * speedModifier * (Math.abs(car.speed) / car.maxSpeed + 0.3);
                    targetWheelRotation = -0.8;
                }
            }

            // Плавный возврат руля в исходное положение
            steeringWheel.rotation.z += (targetWheelRotation - steeringWheel.rotation.z) * 0.1;

            // 3. Расчет новой позиции машины
            // В THREE.js направление "вперед" по умолчанию идет в отрицательную сторону оси Z
            car.x += Math.sin(car.angle) * (car.speed * 0.01);
            car.z -= Math.cos(car.angle) * (car.speed * 0.01);

            // Ограничение по границам мира, чтобы не улететь в пустоту
            if (car.z < -worldLength + 50) car.z = 0; // Зацикливание дороги, едем бесконечно вперед
            if (car.z > 10) car.z = 10;
            if (car.x > worldWidth/2 - 5) car.x = worldWidth/2 - 5;
            if (car.x < -worldWidth/2 + 5) car.x = -worldWidth/2 + 5;

            // 4. Синхронизация камеры и кабины с координатами машины
            camera.position.x = car.x - 0.4 * Math.cos(car.angle); // смещение под левый руль с учетом поворота
            camera.position.z = car.z + 0.4 * Math.sin(car.angle);
            
            // Камера смотрит вперед по направлению движения машины
            camera.rotation.y = car.angle;

            // Привязываем торпеду и капот к камере, чтобы они двигались вместе с наклоном головы водителя
            dashboardGroup.position.set(car.x, 1.2, car.z);
            dashboardGroup.rotation.y = car.angle;

            // Обновляем HUD (округляем для красоты)
            speedDisplay.innerText = Math.round(Math.abs(car.speed));

            renderer.render(scene, camera);
        }

        // Поддержка изменения размера экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск
        animate();
    </script>
</body>
</html>
