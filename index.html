from pathlib import Path

html = r"""<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam Simulator L-3612</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial}
#sky{height:65vh;position:relative;overflow:hidden;background:linear-gradient(#87b5ff,#d7e7ff)}
#ground{position:absolute;bottom:0;width:100%;height:40%;background:#2d2d2d}
#hud{position:absolute;left:10px;top:10px;background:#0008;padding:10px}
#train{position:absolute;bottom:18%;left:50%;width:220px;height:40px;background:#111;border:2px solid #777;transform:translateX(-50%)}
#smoke{position:absolute;bottom:60px;left:52%;}
.sm{position:absolute;width:20px;height:20px;border-radius:50%;background:#bbb8}
#panel{height:35vh;background:#222;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{background:#333;padding:10px}
button{width:100%;padding:10px;margin:4px 0}
.big{font-size:36px;font-weight:bold}
</style>
</head>
<body>
<div id="sky">
<div id="hud">
<div>Скорость: <span id="spd">0</span> км/ч</div>
<div>Давление: <span id="prs">12.0</span> атм</div>
<div>Уголь: <span id="coal">8000</span> кг</div>
<div>Вода: <span id="water">25000</span> л</div>
<div>Регулятор: <span id="reg">0</span>%</div>
<div>Реверс: <span id="rev">50</span>%</div>
<div>Станция через: <span id="dist">5000</span> м</div>
</div>
<div id="smoke"></div>
<div id="train"></div>
<div id="ground"></div>
</div>

<div id="panel">
<div class="card">
<h3>Тяга</h3>
<button onclick="reg(+5)">Регулятор +</button>
<button onclick="reg(-5)">Регулятор -</button>
<button onclick="rev(+5)">Реверс +</button>
<button onclick="rev(-5)">Реверс -</button>
</div>

<div class="card">
<div class="big" id="speedCenter">0</div>
<div>км/ч</div>
</div>

<div class="card">
<h3>Тормоза</h3>
<button onclick="brake=1">Тормоз</button>
<button onclick="brake=0">Отпустить</button>
<button onclick="coal+=500">Подбросить уголь</button>
<button onclick="water+=1000">Пополнить воду</button>
</div>
</div>

<script>
let speed=0;
let regulator=0;
let reverser=50;
let brake=0;

let pressure=12;
let coal=8000;
let water=25000;
let distance=5000;

function reg(v){regulator=Math.max(0,Math.min(100,regulator+v));}
function rev(v){reverser=Math.max(0,Math.min(100,reverser+v));}

function smoke(){
 let s=document.createElement('div');
 s.className='sm';
 document.getElementById('smoke').appendChild(s);
 let y=0,x=0;
 let t=setInterval(()=>{
  y+=2;x+=(Math.random()-0.5)*2;
  s.style.transform=`translate(${x}px,${-y}px)`;
  s.style.opacity=Math.max(0,1-y/120);
  if(y>120){clearInterval(t);s.remove();}
 },30);
}

setInterval(()=>{
 let traction=(regulator/100)*(pressure/14)*(0.6+reverser/100);
 let resistance=0.03*speed+0.0009*speed*speed;

 speed += traction-resistance;

 if(brake) speed-=1.5;

 if(speed<0)speed=0;
 if(speed>90)speed=90;

 coal-=regulator*0.05;
 water-=regulator*0.12;

 pressure += 0.01;
 pressure -= regulator*0.015;

 pressure=Math.max(2,Math.min(14,pressure));

 if(coal<=0){coal=0;pressure-=0.05;}
 if(water<=0){
   water=0;
   alert("Авария: закончилась вода!");
   location.reload();
 }

 if(speed>0){
   distance-=speed/3.6;
 }

 if(distance<=0){
   if(speed>10){
      alert("Крушение на станции! Скорость была слишком высокой.");
   }else{
      alert("Прибытие на станцию успешно.");
   }
   distance=5000;
 }

 document.getElementById('spd').textContent=Math.round(speed);
 document.getElementById('speedCenter').textContent=Math.round(speed);
 document.getElementById('prs').textContent=pressure.toFixed(1);
 document.getElementById('coal').textContent=Math.round(coal);
 document.getElementById('water').textContent=Math.round(water);
 document.getElementById('reg').textContent=regulator;
 document.getElementById('rev').textContent=reverser;
 document.getElementById('dist').textContent=Math.max(0,Math.round(distance));

 if(speed>5 && Math.random()<0.5) smoke();
},100);

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp") reg(5);
 if(e.key==="ArrowDown") reg(-5);
 if(e.key==="ArrowLeft") rev(-5);
 if(e.key==="ArrowRight") rev(5);
 if(e.code==="Space") brake=1;
});
document.addEventListener("keyup",e=>{
 if(e.code==="Space") brake=0;
});
</script>
</body>
</html>"""
path = "/mnt/data/steam_simulator.html"
Path(path).write_text(html, encoding="utf-8")
print(path)
