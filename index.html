<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Бомбардировщик: Ковровая Бомбардировка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #ff3333; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #020617 0%, #0b1528 60%, #1e293b 100%); }

        /* HUD Панель */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #ff3333;
            border-radius: 6px;
            padding: 12px 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
            font-size: 15px;
            text-shadow: 0 0 5px #ff3333;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .bomb-alert { color: #ffcc00; animation: blink 0.4s infinite alternate; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.9);
            border: 1px solid #ff3333;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: auto;
            margin-bottom: 10px;
            color: #fff;
        }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">500</span> КМ/Ч</div>
                <div>ВЫСОТА: <span class="hud-val" id="alt-out">1800</span> М</div>
                <div style="color: #00ff66;">БОЕЗАПАС: <span class="hud-val" style="color:#00ff66;">БЕСКОНЕЧНО (ФАБ)</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right;">
                <div>РЕЖИМ: <span class="bomb-alert">КОВРОВАЯ БОМБАРДИРОВКА</span></div>
                <div>ГОРОД ВНИЗУ: <span class="hud-val" style="color: #ff3333;">МЕГАПОЛИС ВКЛ</span></div>
                <div style="color: #ffcc00;">УНИЧТОЖЕНО ЗДАНИЙ: <span id="score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="controls-bar">
            💣 <b>ТОТАЛЬНОЕ УНИЧТОЖЕНИЕ:</b> Наводи мышкой | <b>W / S</b> — Скорость | <b style="color: #ffcc00;">ЗАЖМИ ПРОБЕЛ ДЛЯ БЕСКОНЕЧНОГО СБРОСА БОМБ</b>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    // Спрайт твоего истребителя из корня сайта
    const jetImage = new Image();
    jetImage.src = 'mig.png';

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // Самолёт
    let jet = {
        x: 0, y: 0,
        roll: 0, pitch: 0,
        targetRoll: 0, targetPitch: 0,
        speed: 500, altitude: 1800, throttle: 65
    };

    // Массивы игры
    let bombs = [];
    let explosions = [];
    let buildings = [];
    let score = 0;
    let isSpacePressed = false; // Трекинг зажатого пробела
    let bombTimer = 0;          // Таймер частоты сброса

    // Генерируем бесконечную сетку 3D зданий мегаполиса под самолетом
    function generateCity() {
        buildings = [];
        for (let x = -14; x <= 14; x += 2) {
            for (let z = 2; z <= 36; z += 2.5) {
                let height = 400 + Math.random() * 900;
                buildings.push({
                    x: x * 850 + (Math.random() * 200 - 100),
                    y: -1500, // Уровень земли
                    z: z * 1000,
                    w: 260,   // Ширина здания
                    h: height, // Высота здания
                    alive: true
                });
            }
        }
    }
    generateCity();

    // Аудио эффекты
    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(700, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.8);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        } else if (type === 'boom') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(90, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(15, audioCtx.currentTime + 0.9);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.9);
            osc.start(); osc.stop(audioCtx.currentTime + 0.9);
        }
    }

    // Управление мышью
    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        jet.targetRoll = nX * 1.2;
        jet.targetPitch = nY * 0.5;
    });

    // Регистрация нажатия клавиш
    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
            isSpacePressed = true;
        }
        if (e.key === 'w' || e.key === 'W') jet.throttle = Math.min(100, jet.throttle + 10);
        if (e.key === 's' || e.key === 'S') jet.throttle = Math.max(20, jet.throttle - 10);
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
            isSpacePressed = false;
        }
    });

    // Функция создания одной бомбы
    function spawnBomb() {
        bombs.push({
            x: jet.roll * 45,
            y: -100, 
            z: 200,
            vx: jet.roll * 16, 
            vy: 4,             
            vz: jet.speed * 0.13 
        });
        playSound('whistle');
    }

    // 3D Матрица проекции
    function project3D(x, y, z, pitch, roll) {
        let x1 = x * Math.cos(roll) - y * Math.sin(roll);
        let y1 = x * Math.sin(roll) + y * Math.cos(roll);
        let y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch);
        let z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);

        const fov = 900;
        let scale = fov / (z2 + 1500);
        return {
            x: (window.innerWidth / 2) + (x1 * scale),
            y: (window.innerHeight * 0.45) + (y2 * scale),
            scale: scale,
            visible: z2 + 1500 > 0
        };
    }

    // Отрисовка твоего mig.png
    function drawPlayerJet(x, y, roll) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(roll);

        // Реактивное пламя двигателей
        ctx.fillStyle = 'rgba(255, 70, 0, 0.85)';
        ctx.fillRect(-14, 45, 6, 20);
        ctx.fillRect(8, 45, 6, 20);

        // Отрисовка текстуры
        const size = 190;
        ctx.drawImage(jetImage, -size / 2, -size / 2, size, size);

        ctx.restore();
    }

    // Основной цикл симулятора
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        jet.roll += (jet.targetRoll - jet.roll) * 0.1;
        jet.pitch += (jet.targetPitch - jet.pitch) * 0.1;
        jet.speed += ((jet.throttle * 8) - jet.speed) * 0.05;
        jet.altitude += Math.sin(-jet.pitch) * (jet.speed * 0.03);
        if (jet.altitude < 150) jet.altitude = 150; 

        let speedMult = jet.speed * 0.15;

        // Логика бесконечного автоматического сброса при зажатом пробеле
        if (isSpacePressed) {
            bombTimer++;
            if (bombTimer % 6 === 0) { // Каждые 6 кадров сбрасывается новая бомба (высокий темп)
                spawnBomb();
            }
        }

        // Горизонт
        let horizonY = (canvas.height * 0.45) + (jet.pitch * 400);
        ctx.fillStyle = '#050912';
        ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        // Отрисовка 3D города
        buildings.forEach(b => {
            b.z -= speedMult; 
            if (b.z <= -400) { 
                b.z = 26000; 
                b.alive = true; 
                b.h = 400 + Math.random() * 900; // Новые небоскребы на горизонте
            }

            if (b.alive) {
                let bottomProj = project3D(b.x, b.y - jet.altitude, b.z, jet.pitch, jet.roll);
                let topProj = project3D(b.x, (b.y + b.h) - jet.altitude, b.z, jet.pitch, jet.roll);

                if (topProj.visible) {
                    let w3d = b.w * topProj.scale;
                    let h3d = bottomProj.y - topProj.y;

                    ctx.fillStyle = 'rgba(16, 24, 48, 0.95)';
                    ctx.strokeStyle = 'rgba(255, 40, 40, 0.45)';
                    ctx.lineWidth = 1;
                    ctx.fillRect(topProj.x - w3d/2, topProj.y, w3d, h3d);
                    ctx.strokeRect(topProj.x - w3d/2, topProj.y, w3d, h3d);

                    // Светящиеся окна мегаполиса
                    ctx.fillStyle = '#ffcc00';
                    for (let oy = topProj.y + 12; oy < bottomProj.y - 12; oy += 24) {
                        for (let ox = topProj.x - w3d/2 + 8; ox < topProj.x + w3d/2 - 8; ox += 14) {
                            if (Math.sin(ox * 0.5 + oy * 0.3) > 0.15) { 
                                ctx.fillRect(ox, oy, 3, 4);
                            }
                        }
                    }
                }
            } else {
                // Горящие руины разрушенных зданий
                let bottomProj = project3D(b.x, b.y - jet.altitude, b.z, jet.pitch, jet.roll);
                if (bottomProj.visible) {
                    ctx.fillStyle = '#121212';
                    ctx.fillRect(bottomProj.x - (b.w * bottomProj.scale)/2, bottomProj.y - 10, b.w * bottomProj.scale, 14);
                    if (Math.random() < 0.4) { 
                        ctx.fillStyle = '#ff4400';
                        ctx.fillRect(bottomProj.x + (Math.random()*50-25), bottomProj.y - 16, 12, 12);
                    }
                }
            }
        });

        // Физика бесконечных летящих бомб
        for (let i = bombs.length - 1; i >= 0; i--) {
            let bomb = bombs[i];
            
            bomb.x += bomb.vx;
            bomb.y -= bomb.vy; 
            bomb.z += bomb.vz;
            bomb.vy += 0.45; // Гравитация

            let bProj = project3D(bomb.x, bomb.y, bomb.z, jet.pitch, jet.roll);

            if (bProj.visible && bomb.z < 28000) {
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath();
                ctx.arc(bProj.x, bProj.y, Math.max(3, bProj.scale * 14), 0, Math.PI * 2);
                ctx.fill();

                let absoluteBombHeight = bomb.y + jet.altitude;

                buildings.forEach(b => {
                    if (b.alive && Math.abs(bomb.x - b.x) < b.w && Math.abs(bomb.z - b.z) < b.w) {
                        if (absoluteBombHeight <= b.y + b.h && absoluteBombHeight >= b.y) {
                            b.alive = false; 
                            score++;
                            document.getElementById('score-out').innerText = score;
                            playSound('boom');
                            
                            explosions.push({ x: bProj.x, y: bProj.y, r: 10, maxR: 75 });
                            bombs.splice(i, 1);
                        }
                    }
                });

                if (absoluteBombHeight <= -1500) {
                    explosions.push({ x: bProj.x, y: bProj.y, r: 6, maxR: 45 });
                    playSound('boom');
                    bombs.splice(i, 1);
                }
            } else {
                bombs.splice(i, 1);
            }
        }

        // Рендеринг взрывов
        for (let i = explosions.length - 1; i >= 0; i--) {
            let exp = explosions[i];
            exp.r += 4.5;
            
            ctx.fillStyle = 'rgba(255, 60, 0, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'rgba(255, 210, 0, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r * 0.55, 0, Math.PI * 2); ctx.fill();

            if (exp.r >= exp.maxR) explosions.splice(i, 1);
        }

        // Отрисовка «МиГа»
        let myX = (canvas.width / 2) + (jet.roll * 60);
        let myY = (canvas.height * 0.65) + (jet.pitch * 40);
        drawPlayerJet(myX, myY, jet.roll);

        // Обновление HUD датчиков
        document.getElementById('speed-out').innerText = Math.floor(jet.speed);
        document.getElementById('alt-out').innerText = Math.floor(jet.altitude);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
