<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D JET FIGHTER SIMULATOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; overflow: hidden; }

        #screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #020813;
        }

        /* Наложение кабины и HUD */
        #hud-overlay {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-shadow: inset 0 0 100px rgba(0,255,0,0.2);
        }

        .hud-panel { background: rgba(0, 10, 0, 0.6); border: 2px solid #00ff00; border-radius: 5px; padding: 15px; box-shadow: 0 0 15px rgba(0,255,0,0.4); }
        .flex-row { display: flex; justify-content: space-between; width: 100%; }
        
        .param { font-size: 18px; font-weight: bold; margin: 5px 0; text-shadow: 0 0 5px #00ff00; }
        .value { color: #fff; }

        /* Элементы управления внизу */
        #controls-hint {
            position: absolute;
            bottom: 25px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #00ff00;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            pointer-events: auto;
        }

        /* Эффект форсажа */
        #afterburner-fx {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 0px rgba(255,100,0,0);
            transition: box-shadow 0.2s;
        }
        body.afterburner-active #afterburner-fx {
            box-shadow: inset 0 0 80px rgba(255, 68, 0, 0.6);
        }
    </style>
</head>
<body>

<div id="screen">
    <!-- 3D Мир -->
    <canvas id="skyCanvas"></canvas>
    <div id="afterburner-fx"></div>

    <!-- Тактический ИЛС (HUD) -->
    <div id="hud-overlay">
        <!-- Верхняя панель приборов -->
        <div class="flex-row">
            <div class="hud-panel">
                <div class="param">СКОРОСТЬ (СПД): <span class="value" id="ui-speed">450</span> км/ч</div>
                <div class="param">ВЫСОТА (ВСТ): <span class="value" id="ui-alt">2500</span> м</div>
                <div class="param">ТЯГА (РУД): <span class="value" id="ui-throttle">60%</span></div>
            </div>
            <div class="hud-panel" style="text-align: right;">
                <div class="param">РЕЖИМ: <span class="value" id="ui-mode" style="color: #00ff00;">NAV / ВОЗДУХ</span></div>
                <div class="param">ПЕРЕГРУЗКА: <span class="value" id="ui-g">1.0 G</span></div>
                <div class="param">ТОПЛИВО: <span class="value" style="color: #ffcc00;">84%</span></div>
            </div>
        </div>

        <!-- Подсказка по клавишам -->
        <div id="controls-hint">
            <b>Управление СУ-57:</b> Мышь — Крен и Тангаж (поворот) | <b>W / S</b> — Шаг тяги (Руд) | <b>Пробел</b> — Сверхзвуковой ФОРСАЖ
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('skyCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Физика и параметры полета истребителя
    let jet = {
        pitch: 0,       // Тангаж (вверх/вниз)
        roll: 0,        // Крен (наклон влево/вправо)
        yaw: 0,         // Рыскание (компас)
        speed: 450,     // Скорость в км/ч
        altitude: 2500, // Высота полета
        throttle: 60,   // Процент тяги
        gForce: 1.0,    // Перегрузка
        afterburner: false
    };

    // Генерируем 3D точки на земле (сетка аэродромов/гор)
    let groundPoints = [];
    for(let x = -50; x <= 50; x += 5) {
        for(let z = 5; z <= 100; z += 5) {
            groundPoints.push({ x: x * 1000, y: -2000, z: z * 1000 });
        }
    }

    // Звуковой движок реактивного двигателя СУ-57
    let audioCtx = null, engineNoise = null, engineGain = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Создаем симуляцию гула турбины через белый шум и низкочастотный фильтр
        let bufferSize = audioCtx.sampleRate * 2;
        let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

        engineNoise = audioCtx.createBufferSource();
        engineNoise.buffer = buffer;
        engineNoise.loop = true;

        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(200, audioCtx.currentTime);

        engineGain = audioCtx.createGain();
        engineGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

        engineNoise.connect(filter); filter.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineNoise.start();
    }

    // Считывание мыши (Штурвал)
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
    });

    // Считывание клавиатуры
    window.addEventListener('keydown', (e) => {
        initAudio();
        if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') jet.throttle = Math.min(100, jet.throttle + 5);
        if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') jet.throttle = Math.max(10, jet.throttle - 5);
        if (e.key === ' ') {
            jet.afterburner = true;
            document.body.classList.add('afterburner-active');
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === ' ') {
            jet.afterburner = false;
            document.body.classList.remove('afterburner-active');
        }
    });

    // Матричные 3D трансформации (Ось вращения истребителя)
    function project3D(x, y, z, pitch, roll) {
        // Вращение по крену (Roll)
        let x1 = x * Math.cos(roll) - y * Math.sin(roll);
        let y1 = x * Math.sin(roll) + y * Math.cos(roll);

        // Вращение по тангажу (Pitch)
        let y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch);
        let z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);

        // Перспективная проекция на ИЛС
        if (z2 <= 0) z2 = 0.01; 
        const fov = 600; 
        let cx = (window.innerWidth / 2) + (x1 * fov / z2);
        let cy = (window.innerHeight / 2) + (y2 * fov / z2);

        return { x: cx, y: cy, visible: z2 > 0 };
    }

    // Главный цикл рендеринга полета
    function loop() {
        // 1. Аэродинамика и управление штурвалом
        jet.roll += mouseX * 0.05;
        jet.pitch += mouseY * 0.04;
        jet.yaw += jet.roll * 0.01; // Сваливание по крену

        // Эффект стабилизации крыла
        jet.roll *= 0.98;

        // Расчет перегрузок G-Force на виражах
        jet.gForce = 1.0 + Math.abs(mouseY * 6) + (jet.speed * 0.002);

        // Логика скорости и форсажа
        let targetSpeed = jet.throttle * 8;
        if (jet.afterburner) {
            targetSpeed = 1450; // Сверхзвук!
            jet.speed += 15;
            if (engineGain) engineGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        } else {
            jet.speed += (targetSpeed - jet.speed) * 0.05;
            if (engineGain) engineGain.gain.setValueAtTime(0.1 + (jet.throttle * 0.002), audioCtx.currentTime);
        }

        // Изменение высоты в зависимости от угла тангажа
        jet.altitude += Math.sin(-jet.pitch) * (jet.speed * 0.05);
        if (jet.altitude < 0) jet.altitude = 0; // Крушение о землю

        // Смещение ландшафта под весом истребителя
        let speedMult = jet.speed * 0.1;

        // 2. РЕНДЕРИНГ НЕБА И ЗЕМЛИ
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Рисуем горизонт
        let horizonY = (window.innerHeight / 2) + Math.sin(jet.pitch) * 400;
        
        ctx.save();
        ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
        ctx.rotate(-jet.roll);
        ctx.translate(-window.innerWidth / 2, -window.innerHeight / 2);

        // Небо
        ctx.fillStyle = '#020b1e';
        ctx.fillRect(-window.innerWidth, -window.innerHeight * 2, window.innerWidth * 3, window.innerHeight * 2 + horizonY);
        // Земля
        ctx.fillStyle = '#051305';
        ctx.fillRect(-window.innerWidth, horizonY, window.innerWidth * 3, window.innerHeight * 3);

        // Рисуем 3D сетку земли (Зеленые маркеры ландшафта)
        ctx.strokeStyle = 'rgba(0, 255, 0, 0.15)';
        ctx.beginPath();
        groundPoints.forEach(p => {
            // Двигаем точки навстречу самолету
            p.z -= speedMult;
            if (p.z <= 0) p.z = 80000; // Цикличность мира

            let proj = project3D(p.x, p.y - jet.altitude, p.z, jet.pitch, jet.roll);
            if (proj.visible) {
                ctx.lineTo(proj.x, proj.y);
                ctx.fillStyle = 'rgba(0, 255, 0, 0.4)';
                ctx.fillRect(proj.x, proj.y, 3, 3);
            }
        });
        ctx.stroke();
        ctx.restore();

        // 3. ОТРИСОВКА ВОЕННОГО ИЛС (HUD) В ЦЕНТРЕ
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2;

        // Прицельная сетка пушки
        ctx.beginPath();
        ctx.arc(window.innerWidth / 2, window.innerHeight / 2, 40, 0, Math.PI * 2);
        ctx.moveTo(window.innerWidth / 2 - 60, window.innerHeight / 2);
        ctx.lineTo(window.innerWidth / 2 - 40, window.innerHeight / 2);
        ctx.moveTo(window.innerWidth / 2 + 40, window.innerHeight / 2);
        ctx.lineTo(window.innerWidth / 2 + 60, window.innerHeight / 2);
        ctx.moveTo(window.innerWidth / 2, window.innerHeight / 2 - 40);
        ctx.lineTo(window.innerWidth / 2, window.innerHeight / 2 - 60);
        ctx.stroke();

        // Шкала авиагоризонта (тангаж)
        ctx.save();
        ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
        ctx.rotate(-jet.roll);
        ctx.beginPath();
        // Левое крыло горизонта
        ctx.moveTo(-150, Math.sin(jet.pitch) * 200);
        ctx.lineTo(-80, Math.sin(jet.pitch) * 200);
        ctx.lineTo(-80, Math.sin(jet.pitch) * 200 + 10);
        // Правое крыло горизонта
        ctx.moveTo(150, Math.sin(jet.pitch) * 200);
        ctx.lineTo(80, Math.sin(jet.pitch) * 200);
        ctx.lineTo(80, Math.sin(jet.pitch) * 200 + 10);
        ctx.stroke();
        ctx.restore();

        // Компас (Yaw) вверху шкалы ИЛС
        let heading = Math.floor((jet.yaw * 180 / Math.PI) % 360);
        if (heading < 0) heading += 360;
        ctx.fillStyle = '#00ff00';
        ctx.font = '20px Courier New';
        ctx.fillText(`HDG: ${heading}°`, window.innerWidth / 2 - 40, 120);

        // 4. ОБНОВЛЕНИЕ ДАТЧИКОВ ТЕКСТОМ ИНТЕРФЕЙСА
        document.getElementById('ui-speed').innerText = Math.floor(jet.speed);
        document.getElementById('ui-alt').innerText = Math.floor(jet.altitude);
        document.getElementById('ui-throttle').innerText = jet.throttle + "%";
        document.getElementById('ui-g').innerText = jet.gForce.toFixed(1) + " G";
        
        if (jet.afterburner) {
            document.getElementById('ui-mode').innerText = "ФОРСАЖ МAХ";
            document.getElementById('ui-mode').style.color = "#ff3300";
        } else {
            document.getElementById('ui-mode').innerText = "NAV / РЛС ВКЛ";
            document.getElementById('ui-mode').style.color = "#00ff00";
        }

        // Проверка столкновения с землей
        if (jet.altitude <= 5) {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.fillStyle = '#fff';
            ctx.font = '40px Courier New';
            ctx.fillText("КРАШ: СТОЛКНОВЕНИЕ С ЗЕМЛЕЙ", window.innerWidth / 2 - 300, window.innerHeight / 2);
            jet.speed = 0;
            return; // Стоп игра
        }

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
