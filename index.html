<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Машиниста Метро PRO + АРС</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0b0c10; color: #66fcf1; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Лобовое стекло машиниста */
        #windshield {
            flex: 1.2;
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.9);
        }

        /* Геометрия тоннеля */
        .tunnel-line {
            position: absolute;
            background: #222;
            transform-origin: top center;
        }
        #rail-left { bottom: 0; left: 42%; width: 6px; height: 50%; transform: skewX(-35deg); background: #444; box-shadow: 2px 0 5px #000;}
        #rail-right { bottom: 0; right: 42%; width: 6px; height: 50%; transform: skewX(35deg); background: #444; box-shadow: -2px 0 5px #000;}
        #wall-l { top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(to right, #050505, #151515); clip-path: polygon(0 0, 100% 0, 40% 100%, 0% 100%); }
        #wall-r { top: 0; right: 0; width: 30%; height: 100%; background: linear-gradient(to left, #050505, #151515); clip-path: polygon(0 0, 100% 0, 100% 100%, 60% 100%); }

        #tunnel-environment { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .wall-light { position: absolute; width: 8px; height: 8px; background: #ffaa44; border-radius: 50%; top: 40%; box-shadow: 0 0 15px #ffaa44; }
        
        /* Предупреждающие знаки в тоннеле */
        .brake-sign {
            position: absolute;
            width: 80px; height: 10px;
            background: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 10px, #000 10px, #000 20px);
            top: 45%; left: 48%;
            transform: scale(0.1);
        }

        /* Станция метро */
        #station {
            position: absolute;
            width: 250%;
            height: 100%;
            background: linear-gradient(to bottom, #2b2b2b, #111 80%, #333);
            top: 0;
            left: 200%;
            transform: skewX(-15deg);
            border-left: 20px solid #555;
        }
        #station-wall {
            width: 100%; height: 60%; background: #444; border-bottom: 8px solid #00ffcc; padding: 20px;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        #station-name { background: #111; color: #fff; padding: 10px 30px; font-weight: bold; font-size: 28px; border: 2px solid #fff; display: inline-block; letter-spacing: 2px; }
        
        /* Знак Остановка Первого Вагона (ОПВ) */
        #opv-marker {
            position: absolute;
            bottom: 10px;
            left: 5%;
            background: #fff;
            color: #000;
            padding: 5px 10px;
            font-weight: bold;
            border: 3px solid #ff3333;
            border-radius: 3px;
            font-size: 16px;
        }
        
        .passenger { width: 14px; height: 45px; background: #fff; margin-right: 8px; border-radius: 4px 4px 0 0; display: inline-block; position: relative; bottom: -60px;}

        /* Светофор */
        #semaphore { position: absolute; left: 15%; bottom: 10%; width: 24px; height: 70px; background: #1a1a1a; border: 3px solid #333; border-radius: 5px; display: flex; flex-direction: column; justify-content: space-around; align-items: center; padding: 6px; }
        .light { width: 14px; height: 14px; border-radius: 50%; background: #222; transition: 0.2s; }
        .light.red { background: #ff3333; box-shadow: 0 0 20px #ff3333, inset 0 0 4px #fff; }
        .light.yellow { background: #ffcc00; box-shadow: 0 0 20px #ffcc00, inset 0 0 4px #fff; }
        .light.green { background: #33ff33; box-shadow: 0 0 20px #33ff33, inset 0 0 4px #fff; }

        /* ПУЛЬТ УПРАВЛЕНИЯ ПОЕЗДОМ */
        #control-panel {
            flex: 1;
            background: linear-gradient(to bottom, #23272a, #0f1115);
            border-top: 6px solid #454d55;
            padding: 15px 30px;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 20px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.8);
        }

        /* Монитор БК */
        .mfd-screen {
            background: #020611;
            border: 4px solid #3a4454;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 20px rgba(0,255,200,0.2), 0 4px 10px rgba(0,0,0,0.5);
        }
        .mfd-header { font-size: 12px; color: #8f9cae; border-bottom: 1px solid #3a4454; padding-bottom: 4px; display: flex; justify-content: space-between;}
        .mfd-main { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .speed-block { text-align: center; }
        .speed-val { font-size: 48px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .mfd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
        .param { color: #8f9cae; } .val { color: #fff; text-align: right; font-weight: bold;}

        /* Центральная панель сигнализации */
        .center-console {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 2px solid #2c3238;
            border-radius: 6px;
            padding: 10px;
        }
        .sys-status { width: 100%; background: #000; padding: 8px; border-radius: 4px; text-align: center; font-weight: bold; font-size: 14px; border: 1px solid #444;}

        /* Органы управления */
        .hardware-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }
        
        .hw-btn {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 5px solid #444;
            background: #222;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #aaa;
            box-shadow: 0 6px 0 #111, 0 8px 10px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .hw-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #111, 0 4px 5px rgba(0,0,0,0.5); }
        
        .hw-btn.master-go { background: radial-gradient(#2ecc71, #27ae60); color: #fff; border-color: #27ae60; }
        .hw-btn.master-brake { background: radial-gradient(#e74c3c, #c0392b); color: #fff; border-color: #c0392b; }
        .hw-btn.door-toggle { background: radial-gradient(#f1c40f, #d35400); color: #000; border-color: #f39c12; }
        .hw-btn.active-light { box-shadow: 0 0 20px #f1c40f, inset 0 0 10px #fff !important; color: #fff; }

        /* Кабина: индикаторы давления и напряжения */
        .gauges-side {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px;
        }
        .gauge-bar-container { background: #111; border: 2px solid #444; height: 20px; border-radius: 3px; position: relative; margin: 5px 0; overflow: hidden;}
        .gauge-bar { height: 100%; width: 50%; background: #3498db; transition: width 0.2s; }
        .gauge-label { font-size: 11px; color: #a5b1c2; display: flex; justify-content: space-between; }

        #hud-top { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75); padding: 10px 20px; border-radius: 4px; border-left: 4px solid #66fcf1; font-size: 14px;}
    </style>
</head>
<body>

<div id="game-container">
    <div id="windshield">
        <div id="wall-l" class="tunnel-line"></div>
        <div id="wall-r" class="tunnel-line"></div>
        <div id="tunnel-environment"></div>
        <div class="tunnel-line" id="rail-left"></div>
        <div class="tunnel-line" id="rail-right"></div>
        
        <div id="station">
            <div id="station-wall">
                <div id="station-name">СТАНЦИЯ: ТЕХНОПАРК</div>
                <div id="opv-marker">ОПВ</div>
            </div>
            <div id="passengers-group"></div>
        </div>

        <div id="semaphore">
            <div id="light-red" class="light red"></div>
            <div id="light-yellow" class="light"></div>
            <div id="light-green" class="light"></div>
        </div>

        <div id="hud-top">
            <div>МАРШРУТ: <b>№ 42</b></div>
            <div>СЧЕТ: <span id="score-val" style="color:#fff">0</span></div>
        </div>
    </div>

    <div id="control-panel">
        
        <div class="gauges-side">
            <div>
                <div class="gauge-label"><span>ТОРМОЗНАЯ МАГИСТРАЛЬ (ТМ)</span><span id="tm-val">5.0 Атм</span></div>
                <div class="gauge-bar-container"><div id="gauge-tm" class="gauge-bar" style="width: 83%; background: #2ecc71;"></div></div>
            </div>
            <div>
                <div class="gauge-label"><span>ТОРМОЗНЫЕ ЦИЛИНДРЫ (ТЦ)</span><span id="tc-val">0.0 Атм</span></div>
                <div class="gauge-bar-container"><div id="gauge-tc" class="gauge-bar" style="width: 0%; background: #e74c3c;"></div></div>
            </div>
            <div>
                <div class="gauge-label"><span>НАПРЯЖЕНИЕ НА КР</span><span id="kr-val">825 В</span></div>
                <div class="gauge-bar-container"><div id="gauge-kr" class="gauge-bar" style="width: 90%; background: #f1c40f;"></div></div>
            </div>
        </div>

        <div class="center-console">
            <div class="mfd-screen" style="width: 100%; height: 130px;">
                <div class="mfd-header"><span>ОСНОВНОЙ ДИСПЛЕЙ (МФДУ)</span><span id="clock">12:00:00</span></div>
                <div class="mfd-main">
                    <div class="speed-block">
                        <div class="speed-val" id="speed-display">0</div>
                        <div style="font-size:10px; color:#8f9cae;">СКОРОСТЬ км/ч</div>
                    </div>
                    <div class="mfd-grid" style="min-width: 190px;">
                        <span class="param" style="color: #66fcf1;">РЕК. СКОРОСТЬ:</span><span class="val" id="ars-speed" style="color: #66fcf1;">80 км/ч</span>
                        <span class="param">ДО СТАНЦИИ:</span><span class="val" id="dist-display">750 м</span>
                        <span class="param">ПАССАЖИРЫ:</span><span class="val" id="pass-count">0</span>
                        <span class="param">РЕЖИМ:</span><span class="val" id="mfd-mode" style="color:#f1c40f">ВЫБЕГ</span>
                    </div>
                </div>
            </div>
            
            <div id="status-text" class="sys-status" style="color: #ff3333;">СИСТЕМА: ОЖИДАНИЕ СИГНАЛА СЕМФОРА</div>
        </div>

        <div class="hardware-controls">
            <button class="hw-btn master-go" id="btn-accel">ХОД<br>▲</button>
            <button class="hw-btn master-brake" id="btn-brake">ТОРМОЗ<br>▼</button>
            <button class="hw-btn door-toggle" id="btn-doors">ДВЕРИ<br>[ || ]</button>
        </div>

    </div>
</div>

<script>
    // Аудио движок
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let trainSoundOsc = null;
    let trainSoundGain = null;
    let alarmInterval = null;

    function initAudio() {
        if (trainSoundOsc) return; 
        
        trainSoundOsc = audioCtx.createOscillator();
        trainSoundGain = audioCtx.createGain();
        trainSoundOsc.type = 'sawtooth';
        trainSoundOsc.frequency.setValueAtTime(30, audioCtx.currentTime); 
        
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(150, audioCtx.currentTime);

        trainSoundGain.gain.setValueAtTime(0, audioCtx.currentTime);
        
        trainSoundOsc.connect(filter);
        filter.connect(trainSoundGain);
        trainSoundGain.connect(audioCtx.destination);
        trainSoundOsc.start();

        setInterval(() => {
            if (speed > 5) {
                playClickSound();
                setTimeout(() => { if (speed > 20) playClickSound(); }, 120);
            }
        }, 800);
    }

    function playClickSound() {
        if(!trainSoundGain) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
        gain.gain.setValueAtTime(speed * 0.003, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playBeep(freq, duration, type='sine') {
        initAudio();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function triggerArsAlarm(state) {
        if (state && !alarmInterval) {
            alarmInterval = setInterval(() => {
                playBeep(900, 0.15, 'triangle');
            }, 400);
        } else if (!state && alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
    }

    // Игровые переменные
    let speed = 0;
    let maxSpeed = 80;
    let recSpeed = 80; // Рекомендованная скорость АРС
    let distanceToStation = 750;
    let doorsOpen = false;
    let score = 0;
    let passengersBoarded = 0;
    let currentPhase = 'wait_signal'; 
    let stationNames = ['ТЕХНОПАРК', 'СОКОЛЬНИКИ', 'ВЫСТАВОЧНАЯ', 'КИЕВСКАЯ', 'МАЯКОВСКАЯ'];
    let currentStationIdx = 0;

    let pressureTC = 3.8;

    // DOM Элементы
    const speedDisplay = document.getElementById('speed-display');
    const arsDisplay = document.getElementById('ars-speed');
    const distDisplay = document.getElementById('dist-display');
    const passCount = document.getElementById('pass-count');
    const mfdMode = document.getElementById('mfd-mode');
    const statusText = document.getElementById('status-text');
    const scoreVal = document.getElementById('score-val');
    const station = document.getElementById('station');
    const stationNameDiv = document.getElementById('station-name');
    const passGroup = document.getElementById('passengers-group');

    const lRed = document.getElementById('light-red');
    const lYellow = document.getElementById('light-yellow');
    const lGreen = document.getElementById('light-green');
    const gaugeTC = document.getElementById('gauge-tc');
    const tcVal = document.getElementById('tc-val');

    function generatePassengers() {
        passGroup.innerHTML = '';
        let num = Math.floor(Math.random() * 8) + 4;
        for(let i=0; i<num; i++) {
            let p = document.createElement('div');
            p.className = 'passenger';
            p.style.background = `hsl(${Math.random()*360}, 60%, 50%)`;
            p.style.left = `${Math.random()*300}px`;
            passGroup.appendChild(p);
        }
    }
    generatePassengers();

    // Эффекты окружения
    let elements = [];
    function updateTunnel() {
        // Огни тоннеля
        if (speed > 0 && Math.random() < speed * 0.003) {
            let l = document.createElement('div');
            l.className = 'wall-light';
            l.style.left = '50%'; l.style.top = '40%';
            l.style.transform = 'scale(0.1)';
            document.getElementById('tunnel-environment').appendChild(l);
            elements.push({ el: l, x: 50, y: 40, scale: 0.1, type: 'light' });
        }
        
        // Предупреждающий знак "Тормози" перед станцией (появляется на 150м)
        if (distanceToStation < 160 && distanceToStation > 140 && !elements.some(e => e.type === 'sign')) {
            let s = document.createElement('div');
            s.className = 'brake-sign';
            document.getElementById('tunnel-environment').appendChild(s);
            elements.push({ el: s, x: 48, y: 45, scale: 0.1, type: 'sign' });
        }

        for (let i = elements.length - 1; i >= 0; i--) {
            let e = elements[i];
            e.scale += speed * (e.type === 'sign' ? 0.01 : 0.003);
            e.y += speed * 0.08;
            e.x -= speed * (e.type === 'sign' ? 0.08 : 0.15);
            e.el.style.transform = `scale(${e.scale})`;
            e.el.style.top = e.y + '%';
            e.el.style.left = e.x + '%';
            if (e.y > 100 || e.x < 0) { e.el.remove(); elements.splice(i, 1); }
        }
    }

    // Включение зеленого
    setTimeout(() => {
        lRed.classList.remove('red'); lYellow.classList.add('yellow');
        playBeep(500, 0.1);
        setTimeout(() => {
            lYellow.classList.remove('yellow'); lGreen.classList.add('green');
            currentPhase = 'drive';
            statusText.innerText = 'СИСТЕМА: ПУТЬ СВОБОДЕН. ДОПУСТИМАЯ СКОРОСТЬ 80 КМ/Ч';
            statusText.style.color = '#33ff33';
            playBeep(660, 0.2);
        }, 1500);
    }, 2000);

    function changeSpeed(amount) {
        initAudio();
        if (doorsOpen && amount > 0) return;
        if (currentPhase === 'wait_signal') return;

        if (amount > 0) {
            speed = Math.min(maxSpeed, speed + amount);
            pressureTC = Math.max(0, pressureTC - 1.0);
            mfdMode.innerText = 'ТЯГА'; mfdMode.style.color = '#33ff33';
            playBeep(400, 0.05);
        } else {
            speed = Math.max(0, speed + amount);
            pressureTC = Math.min(3.8, pressureTC + 0.8);
            mfdMode.innerText = 'ТОРМОЗ'; mfdMode.style.color = '#ff3333';
            playBeep(300, 0.05);
        }
    }

    document.getElementById('btn-accel').addEventListener('click', () => changeSpeed(6));
    document.getElementById('btn-brake').addEventListener('click', () => changeSpeed(-8));

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') changeSpeed(6);
        if (e.key === 'ArrowDown') changeSpeed(-8);
        if (e.key === ' ') document.getElementById('btn-doors').click();
    });

    // Двери
    document.getElementById('btn-doors').addEventListener('click', () => {
        initAudio();
        if (speed > 0) return;

        doorsOpen = !doorsOpen;
        const btn = document.getElementById('btn-doors');

        if (doorsOpen) {
            btn.classList.add('active-light');
            statusText.innerText = 'ИНФО: ИДЕТ ПОСАДКА ПАССАЖИРОВ...';
            statusText.style.color = '#f1c40f';
            playBeep(580, 0.1);

            if (distanceToStation <= 12 && distanceToStation >= -12) {
                setTimeout(() => {
                    if (doorsOpen) {
                        passengersBoarded += Math.floor(Math.random() * 20) + 15;
                        score += 150;
                        passCount.innerText = passengersBoarded;
                        scoreVal.innerText = score;
                        statusText.innerText = `ИНФО: ПОСАДКА ЗАВЕРШЕНА. ЗАКРОЙТЕ ДВЕРИ.`;
                        statusText.style.color = '#33ff33';
                        setTimeout(() => { playBeep(440, 0.2); }, 200);
                    }
                }, 2000);
            } else {
                statusText.innerText = 'ШТРАФ: ОТКРЫТИЕ ДВЕРЕЙ В ТОННЕЛЕ!';
                score = Math.max(0, score - 200); scoreVal.innerText = score;
            }
        } else {
            playBeep(880, 0.2);
            btn.classList.remove('active-light');
            statusText.innerText = 'СИСТЕМА: ДВЕРИ ЗАКРЫТЫ. ЦЕПЬ СОБРАНА.';
            statusText.style.color = '#33ff33';

            if (distanceToStation <= 12 && distanceToStation >= -12 && passengersBoarded > 0) {
                nextStationSetup();
            }
        }
    });

    function nextStationSetup() {
        currentPhase = 'wait_signal';
        distanceToStation = 800 + Math.floor(Math.random() * 200);
        station.style.left = '200%';
        lGreen.classList.remove('green'); lRed.classList.add('red');
        recSpeed = 80;
        
        currentStationIdx = (currentStationIdx + 1) % stationNames.length;
        stationNameDiv.innerText = 'СТАНЦИЯ: ' + stationNames[currentStationIdx];
        statusText.innerText = 'СИСТЕМА: ОЖИДАНИЕ РАЗРЕШЕНИЯ СИСТЕМЫ АРС...';
        statusText.style.color = '#ff3333';
        generatePassengers();

        setTimeout(() => {
            lRed.classList.remove('red'); lGreen.classList.add('green');
            currentPhase = 'drive';
            statusText.innerText = 'СИСТЕМА: ПЕРЕГОН СВОБОДЕН. РАЗГОН.';
            statusText.style.color = '#33ff33';
            playBeep(660, 0.2);
        }, 3000);
    }

    // ИГРОВОЙ ЦИКЛ С ДИНАМИЧЕСКИМ АРС
    function loop() {
        if (speed > 0) {
            distanceToStation -= (speed / 36); 
            updateTunnel();
            speed = Math.max(0, speed - 0.03); // Выбег
        }

        // --- ЛОГИКА АРС (ИНСТРУКЦИЯ ДЛЯ ТОРМОЖЕНИЯ) ---
        if (currentPhase === 'drive') {
            if (distanceToStation > 350) {
                recSpeed = 80;
                statusText.innerText = 'СИСТЕМА: СЛЕДУЙТЕ УСТАНОВЛЕННЫМ КУРСОМ (80 км/ч)';
                statusText.style.color = '#33ff33';
            } else if (distanceToStation <= 350 && distanceToStation > 200) {
                recSpeed = 60; // Плавное снижение скорости на подходе
                statusText.innerText = 'АРС: ПРИБЛИЖЕНИЕ К СТАНЦИИ. СНИЖАЙТЕ СКОРОСТЬ ДО 60 КМ/Ч';
                statusText.style.color = '#f1c40f';
            } else if (distanceToStation <= 200 && distanceToStation > 80) {
                recSpeed = 40; // Скорость въезда на платформу
                statusText.innerText = 'АРС: ВЪЕЗД НА СТАНЦИЮ. СНИЖАЙТЕ СКОРОСТЬ ДО 40 КМ/Ч!';
                statusText.style.color = '#ff9f43';
            } else if (distanceToStation <= 80) {
                recSpeed = 20; // Финальное торможение до ОПВ
                statusText.innerText = 'АРС: ТОРМОЖЕНИЕ К ОТМЕТКЕ ОПВ (20 км/ч)!';
                statusText.style.color = '#ff3333';
            }

            // Проверка превышения рекомендованной скорости АРС
            if (speed > recSpeed) {
                triggerArsAlarm(true); // Включаем панический писк пульта
                statusText.innerText = `ВНИМАНИЕ: ПРЕВЫШЕНИЕ АРС! ТОРМОЗИТЕ!`;
                statusText.style.color = '#ff3333';
            } else {
                triggerArsAlarm(false); // Все в порядке, выключаем писк
            }
        } else {
            triggerArsAlarm(false);
        }

        // Обновление интерфейса АРС
        arsDisplay.innerText = recSpeed + ' км/ч';
        if (speed > recSpeed) arsDisplay.style.color = '#ff3333';
        else arsDisplay.style.color = '#66fcf1';

        // Звук двигателя
        if (trainSoundGain) {
            trainSoundGain.gain.setValueAtTime(speed * 0.002, audioCtx.currentTime);
            trainSoundOsc.frequency.setValueAtTime(30 + speed * 0.8, audioCtx.currentTime);
        }

        // Пневматика
        if (mfdMode.innerText === 'ТОРМОЗ') pressureTC = Math.min(3.8, pressureTC + 0.1);
        else if (speed > 0) pressureTC = Math.max(0, pressureTC - 0.1);
        gaugeTC.style.width = (pressureTC / 5 * 100) + '%';
        tcVal.innerText = pressureTC.toFixed(1) + ' Атм';
        
        // Появление платформы
        if (distanceToStation < 250) {
            station.style.left = `${distanceToStation * 1.5}%`;
        }

        speedDisplay.innerText = Math.round(speed);
        distDisplay.innerText = Math.max(0, Math.round(distanceToStation)) + ' м';

        // Остановка
        if (distanceToStation <= 0 && currentPhase === 'drive') {
            if (speed > 12) {
                statusText.innerText = 'АВАРИЯ: ПРОЕЗД СТАНЦИИ БЕЗ ОСТАНОВКИ! ШТРАФ!';
                statusText.style.color = '#ff3333';
                score = Math.max(0, score - 300); scoreVal.innerText = score;
                speed = 0; distanceToStation = -30;
                playBeep(100, 0.8, 'sawtooth');
            } else if (speed === 0) {
                currentPhase = 'station_stop';
                statusText.innerText = 'СИСТЕМА: ОСТАНОВКА ВЫПОЛНЕНА. ОТКРОЙТЕ ДВЕРИ.';
                statusText.style.color = '#33ff33';
                playBeep(700, 0.3);
            }
        }

        document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
