<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Симулятор вождения — Только Трасса</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #00E676;
            letter-spacing: 1px;
            text-align: center;
            transition: border-color 0.2s;
        }
        #hud.warning {
            border-color: #FF3D00;
            color: #FF8A80;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
        }
        #instructions h2 {
            margin-top: 0;
            color: #00E676;
        }
        .status {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div><span id="speed">0</span> км/ч</div>
        <div class="status" id="status-text">Система удержания: АКТИВНА</div>
    </div>
    
    <div id="instructions">
        <h2>Управление:</h2>
        * <b>W / ↑</b> — Газ<br>
        * <b>S / ↓</b> — Тормоз / Назад<br>
        * <b>A, D / ←, →</b> — Поворот руля<br>
        <br>
        <i>Защита от съезда активна. Потерять трассу невозможно!</i>
    </div>

    <script>
        // --- Настройки сцены ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        sunLight.position.set(100, 200, 50);
        scene.add(sunLight);

        // --- Физика автомобиля ---
        const car = {
            x: 0,
            z: 0,
            speed: 0,
            maxSpeed: 90, 
            maxReverseSpeed: -25, 
            acceleration: 0.6,
            deceleration: 0.3,
            friction: 0.06,
            angle: 0,
            steeringSpeed: 0.025
        };

        const keys = { w: false, a: false, s: false, d: false };

        // --- Окружение и Безопасная Дорога ---
        const roadWidth = 14; // Ширина асфальта
        const worldWidth = 400;
        const worldLength = 2000;

        // Трава
        const groundGeo = new THREE.PlaneGeometry(worldWidth, worldLength, 40, 100);
        const pos = groundGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let z = pos.getY(i);
            if (Math.abs(x) > 12) { // Холмы начинаются подальше от дороги
                let hill = Math.sin(x * 0.05) * Math.cos(z * 0.02) * 6;
                pos.setZ(i, hill);
            }
        }
        groundGeo.computeVertexNormals();
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2E6F40, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Асфальтированная дорога
        const roadGeo = new THREE.PlaneGeometry(roadWidth, worldLength);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x282828, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        scene.add(road);

        // Обочины (красно-белые поребрики для визуализации границ безопасности)
        const curbGeoLeft = new THREE.PlaneGeometry(0.5, worldLength);
        const curbMat = new THREE.MeshStandardMaterial({ color: 0xBA1212, roughness: 0.5 }); // Красный край
        const curbLeft = new THREE.Mesh(curbGeoLeft, curbMat);
        curbLeft.rotation.x = -Math.PI / 2;
        curbLeft.position.set(-roadWidth/2, 0.015, 0);
        scene.add(curbLeft);

        const curbRight = curbLeft.clone();
        curbRight.position.x = roadWidth/2;
        scene.add(curbRight);

        // Разметка центральная
        const markerCount = 120;
        const markerGeo = new THREE.PlaneGeometry(0.2, 5);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
        const markersGroup = new THREE.Group();

        for(let i = 0; i < markerCount; i++) {
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.rotation.x = -Math.PI / 2;
            marker.position.set(0, 0.02, - (i * 18));
            markersGroup.add(marker);
        }
        scene.add(markersGroup);

        // Деревья
        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.15, 0.3, 2, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5C4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            tree.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(1.2, 2.5, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1E5631, roughness: 0.7 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 2.8;
            tree.add(leaves);

            tree.position.set(x, 0, z);
            scene.add(tree);
        }

        for (let i = 0; i < 180; i++) {
            let side = Math.random() > 0.5 ? 1 : -1;
            let x = (12 + Math.random() * 60) * side;
            let z = -(Math.random() * (worldLength - 100));
            createTree(x, z);
        }

        // --- Интерьер (Первое лицо) ---
        const dashboardGroup = new THREE.Group();

        const hoodGeo = new THREE.BoxGeometry(1.9, 0.45, 1.8);
        const hoodMat = new THREE.MeshStandardMaterial({ color: 0x0077FF, roughness: 0.2, metalness: 0.7 }); // Синий капот
        const hood = new THREE.Mesh(hoodGeo, hoodMat);
        hood.position.set(0, -0.55, -1.1);
        dashboardGroup.add(hood);

        const dashGeo = new THREE.BoxGeometry(2.1, 0.4, 0.5);
        const dashMat = new THREE.MeshStandardMaterial({ color: 0x151515 });
        const dash = new THREE.Mesh(dashGeo, dashMat);
        dash.position.set(0, -0.5, -0.25);
        dashboardGroup.add(dash);

        const wheelGeo = new THREE.TorusGeometry(0.18, 0.025, 8, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x252525 });
        const steeringWheel = new THREE.Mesh(wheelGeo, wheelMat);
        steeringWheel.position.set(-0.38, -0.35, -0.35);
        steeringWheel.rotation.x = 0.3;
        dashboardGroup.add(steeringWheel);

        scene.add(dashboardGroup);

        camera.position.set(-0.38, 1.15, 0); 

        // --- Управление ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        });

        const speedDisplay = document.getElementById('speed');
        const hudElement = document.getElementById('hud');
        const statusText = document.getElementById('status-text');

        // --- Игровой цикл ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Физика скорости
            if (keys.w) {
                if (car.speed < car.maxSpeed) car.speed += car.acceleration;
            } else if (keys.s) {
                if (car.speed > car.maxReverseSpeed) car.speed -= car.acceleration * 1.5;
            } else {
                if (car.speed > 0) car.speed -= car.friction;
                if (car.speed < 0) car.speed += car.friction;
                if (Math.abs(car.speed) < 0.1) car.speed = 0;
            }

            // 2. Логика поворотов и «Умный возврат руля»
            let targetWheelRotation = 0;
            
            if (Math.abs(car.speed) > 0.5) {
                const speedModifier = car.speed > 0 ? 1 : -1;
                
                if (keys.a) {
                    car.angle += car.steeringSpeed * speedModifier;
                    targetWheelRotation = 0.8;
                } else if (keys.d) {
                    car.angle -= car.steeringSpeed * speedModifier;
                    targetWheelRotation = -0.8;
                } else {
                    // АВТОМАТИЧЕСКОЕ ВЫРАВНИВАНИЕ: если игрок бросил руль, машина стабилизирует курс параллельно дороге
                    car.angle *= 0.92; 
                    if (Math.abs(car.angle) < 0.001) car.angle = 0;
                }
            }

            // Плавное вращение руля в кабине
            steeringWheel.rotation.z += (targetWheelRotation - steeringWheel.rotation.z) * 0.15;

            // 3. Движение машины
            car.x += Math.sin(car.angle) * (car.speed * 0.01);
            car.z -= Math.cos(car.angle) * (car.speed * 0.01);

            // 4. СИСТЕМА УДЕРЖАНИЯ НА ТРАССЕ (Невидимые отбойники)
            // Максимальное смещение от центра дороги с учётом ширины машины (~1.2 метра)
            const maxTrackOffset = (roadWidth / 2) - 1.2; 
            
            if (car.x > maxTrackOffset) {
                car.x = maxTrackOffset; // Жесткий барьер справа
                if(car.angle < 0) car.angle = 0; // Гасим вектор поворота наружу
                triggerWarning(true);
            } else if (car.x < -maxTrackOffset) {
                car.x = -maxTrackOffset; // Жесткий барьер слева
                if(car.angle > 0) car.angle = 0; // Гасим вектор поворота наружу
                triggerWarning(true);
            } else {
                triggerWarning(false);
            }

            // Бесконечный цикл дороги по координате Z
            if (car.z < -worldLength + 100) car.z = 0;
            if (car.z > 10) car.z = 10;

            // 5. Синхронизация камеры и кабины
            camera.position.x = car.x - 0.38 * Math.cos(car.angle);
            camera.position.z = car.z + 0.38 * Math.sin(car.angle);
            camera.rotation.y = car.angle;

            dashboardGroup.position.set(car.x, 1.15, car.z);
            dashboardGroup.rotation.y = car.angle;

            // Интерфейс
            speedDisplay.innerText = Math.round(Math.abs(car.speed));

            renderer.render(scene, camera);
        }

        // Эффект предупреждения на приборной панели
        function triggerWarning(isRestricted) {
            if (isRestricted) {
                hudElement.classList.add('warning');
                statusText.innerText = "КОРРЕКЦИЯ ТРАЕКТОРИИ!";
                statusText.style.color = "#FF3D00";
            } else {
                hudElement.classList.remove('warning');
                statusText.innerText = "Система удержания: АКТИВНА";
                statusText.style.color = "#aaa";
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
