<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELL-NET // SYSTEM ELITE</title>
    <style>
        :root {
            --matrix-blue: #007acc;
            --matrix-glow: rgba(0, 122, 204, 0.6);
            --dark-core: #010205;
            --accent-red: #ff3333;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-core);
            color: #fff; font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .main-container {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; padding: 15px; box-sizing: border-box;
        }

        .terminal {
            width: 100%; max-width: 550px;
            background: rgba(2, 5, 10, 0.95);
            border: 1px solid var(--matrix-blue);
            box-shadow: 0 0 50px var(--matrix-glow);
            padding: 20px; border-radius: 8px; backdrop-filter: blur(15px);
            position: relative;
        }

        .terminal-header {
            border-bottom: 1px solid rgba(0, 122, 204, 0.4);
            padding-bottom: 8px; margin-bottom: 15px;
            font-size: 0.7rem; color: var(--matrix-blue);
            display: flex; justify-content: space-between;
        }

        /* Блок с картой */
        #map-module {
            display: none;
            margin-bottom: 15px;
            border: 1px solid var(--matrix-blue);
            height: 200px;
            position: relative;
            overflow: hidden;
            background: url('https://w0.peakpx.com/wallpaper/211/365/HD-wallpaper-google-maps-dark-mode-thumbnail.jpg') center/cover;
        }

        .map-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle, transparent 30%, rgba(1, 2, 5, 0.8) 100%);
            border: 1px solid var(--matrix-blue);
        }

        .scanner-line {
            position: absolute; width: 100%; height: 2px;
            background: var(--matrix-blue); box-shadow: 0 0 15px var(--matrix-blue);
            animation: mapScan 3s linear infinite;
        }
        @keyframes mapScan { 0% { top: 0; } 100% { top: 100%; } }

        .informer-box {
            background: #000; border: 1px solid var(--matrix-blue);
            padding: 5px; margin-bottom: 15px; display: inline-block;
        }
        .informer-box img { display: block; filter: hue-rotate(180deg) brightness(1.2); max-width: 100%; }

        input[type="text"] {
            width: 100%; background: #000; border: 1px solid var(--matrix-blue);
            padding: 12px; color: #fff; font-family: monospace; outline: none;
            box-sizing: border-box; text-align: center;
        }

        .action-btn {
            width: 100%; background: var(--matrix-blue); color: #000; border: none;
            padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            margin-top: 10px; transition: 0.3s;
        }

        .log-display {
            height: 180px; background: #000; border: 1px solid #112233;
            padding: 10px; overflow-y: auto; font-size: 0.8rem; color: #aaddff;
            text-align: left;
        }

        .step-final { display: none; text-align: center; }
        .timer { font-size: 2.2rem; color: var(--accent-red); font-weight: bold; margin: 10px 0; }

        .final-link {
            display: block; background: #00ff66; color: #000;
            text-decoration: none; padding: 18px; font-weight: bold;
            border-radius: 5px; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        #live-notifications { position: fixed; bottom: 10px; left: 10px; z-index: 10; }
        .notify {
            background: rgba(0, 122, 204, 0.2); padding: 8px; margin-top: 5px;
            font-size: 0.65rem; border-left: 3px solid var(--matrix-blue);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div id="live-notifications"></div>

    <div class="main-container">
        <div class="terminal">
            <div class="terminal-header">
                <span>GEO_SYNC // v11.4</span>
                <span id="ip-header">NODE_ACTIVE</span>
            </div>

            <div id="block-input" style="text-align: center;">
                <div class="informer-box">
                    <img src="https://2ip.io/ru/privacy/bar/26098820_297f2a.png" alt="GEO_DATA">
                </div>
                <input type="text" id="target-input" placeholder="ВВЕДИТЕ @USERNAME">
                <button class="action-btn" onclick="startProcess()">ИНИЦИИРОВАТЬ ПОИСК</button>
            </div>

            <div id="block-loading" style="display: none;">
                <div id="map-module">
                    <div class="map-overlay"></div>
                    <div class="scanner-line"></div>
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: 2rem; opacity: 0.6;">⌖</div>
                </div>
                <div class="log-display" id="log-box"></div>
            </div>

            <div id="block-final" class="step-final">
                <div style="color: #00ff66; font-size: 1rem; margin-bottom: 10px;">✓ СИСТЕМА СИНХРОНИЗИРОВАНА</div>
                <div class="timer" id="countdown">05:00</div>
                <a href="https://t.me/mirieli1977" target="_blank" class="final-link">ЗАВЕРШИТЬ В TELEGRAM</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let p = [];

        class BlueFire {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.s = Math.random() * 20 + 5;
                this.a = Math.random() * 0.3 + 0.1;
                this.v = Math.random() * 2 + 1;
            }
            draw() {
                this.y -= this.v; this.a -= 0.002;
                if(this.a <= 0) this.init();
                ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2);
                ctx.fillStyle = `rgba(0, 100, 255, ${this.a})`;
                ctx.fill();
            }
        }
        for(let i=0; i<70; i++) p.push(new BlueFire());
        function anim() {
            ctx.fillStyle = '#010205'; ctx.fillRect(0,0,canvas.width,canvas.height);
            p.forEach(f => f.draw());
            requestAnimationFrame(anim);
        }
        anim();

        function startProcess() {
            const val = document.getElementById('target-input').value;
            if(!val) return;
            document.getElementById('block-input').style.display = 'none';
            document.getElementById('block-loading').style.display = 'block';
            document.getElementById('map-module').style.display = 'block';
            
            const logs = [
                "> Определение координат узла...",
                "> Спутниковая триангуляция...",
                `> Цель ${val} запеленгована.`,
                "> Запрос доступа к ядру...",
                "> Обход шифрования...",
                "[OK] ТОКЕН ГЕНЕРИРУЕТСЯ..."
            ];

            let i = 0;
            const t = setInterval(() => {
                if(i < logs.length) {
                    const d = document.createElement('div');
                    d.innerText = logs[i];
                    document.getElementById('log-box').appendChild(d);
                    i++;
                } else {
                    clearInterval(t);
                    setTimeout(() => {
                        document.getElementById('block-loading').style.display = 'none';
                        document.getElementById('block-final').style.display = 'block';
                        let s = 300;
                        setInterval(() => {
                            let m = Math.floor(s/60), sc = s%60;
                            document.getElementById('countdown').innerText = `0${m}:${sc<10?'0'+sc:sc}`;
                            if(s>0) s--;
                        }, 1000);
                    }, 1000);
                }
            }, 800);
        }

        setInterval(() => {
            const n = document.getElementById('live-notifications');
            const d = document.createElement('div'); d.className = 'notify';
            d.innerText = `User ID_${Math.floor(Math.random()*9000)} получил доступ`;
            n.appendChild(d); setTimeout(() => d.remove(), 4000);
        }, 5000);
    </script>
</body>
</html>
