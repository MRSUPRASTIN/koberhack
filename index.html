<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Штурмовик: Апокалипсис Орешника +500%</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #ff3333; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #010206 0%, #040813 60%, #0d1324 100%); }

        /* HUD Панель */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(8, 12, 24, 0.9);
            border: 2px solid #ff3333;
            border-radius: 6px;
            padding: 12px 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
            font-size: 15px;
            text-shadow: 0 0 5px #ff3333;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .alert-ui { color: #ff3333; animation: blink 0.2s infinite alternate; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.9);
            border: 2px solid #ff0000;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: auto;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 5px #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        /* Ослепительная термобарическая вспышка */
        #nuclear-flash {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #ffffff; pointer-events: none; opacity: 0;
        }

        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>
    <div id="nuclear-flash"></div>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel" style="border-color: #ff0000;">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">550</span> КМ/Ч</div>
                <div>МОЩНОСТЬ УДАРА: <span class="hud-val" style="color:#ff3300; text-shadow: 0 0 10px #ff0000;">+500% АНИГИЛЯЦИЯ</span></div>
                <div style="color: #ff9900;">РАДИУС ВЗРЫВА: <span class="hud-val" style="color:#ff9900;">АНТИКВАРТАЛ СВЕРХМАКСИМУМ</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right; border-color: #ff0000;">
                <div>СПО «БЕРЕЗА»: <span class="alert-ui" id="pvo-warn">ПОИСК ЦЕЛЕЙ</span></div>
                <div>СТЕРТО С ЛИЦА ЗЕМЛИ ТЕХНИКИ: <span id="score-out" class="hud-val" style="color: #ffcc00;">0</span></div>
                <div style="color: #00ffff;">ИСПАРЕНО СЕКТОРОВ ГОРОДА: <span id="b-score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="controls-bar">
            ☢️ <b>ПРИМЕНЕН ГИПЕРЗВУКОВОЙ «ОРЕШНИК» (+500%):</b> Зажми ПРОБЕЛ. Каскад плазменных волн выжигает ВСЁ до самого горизонта!
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('nuclear-flash');

    const jetImage = new Image();
    jetImage.src = 'mig.png';

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let jet = {
        x: 0, y: 0,
        roll: 0, pitch: 0,
        targetX: 0, targetY: 0,
        speed: 550, altitude: 4000
    };

    let bombs = [];
    let explosions = [];
    let buildings = [];
    let enemies = [];     
    let enemyProjectiles = []; 
    let scoreVehicles = 0;
    let scoreBuildings = 0;
    let isSpacePressed = false; 
    let bombTimer = 0;          
    let muzzleFlash = 0; 

    function initWorld() {
        buildings = [];
        enemies = [];
        
        // Генерируем сверхплотный мегаполис
        for (let x = -15; x <= 15; x += 1.8) {
            for (let z = 3; z <= 30; z += 3) {
                let worldX = x * 1400 + (Math.random() * 200 - 100);
                let worldZ = z * 1100;
                
                buildings.push({
                    x: worldX, y: -2500, z: worldZ,
                    w: 420, h: 500 + Math.random() * 1200,
                    alive: true
                });

                if (Math.random() < 0.7) {
                    enemies.push({
                        x: worldX + (Math.random() * 400 - 200),
                        y: -2500,
                        z: worldZ + 50,
                        type: Math.random() > 0.4 ? 'tank' : 'pvo',
                        w: 95, h: 55,
                        alive: true,
                        shootCooldown: Math.floor(Math.random() * 50),
                        moveDir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }
        }
    }
    initWorld();

    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(700, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.9);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);
            osc.start(); osc.stop(audioCtx.currentTime + 0.9);
        } else if (type === 'oreshnik') {
            // Тектонический грохот взрыва
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(35, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1, audioCtx.currentTime + 2.0);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
            osc.start(); osc.stop(audioCtx.currentTime + 2.0);
        } else if (type === 'fire') {
            osc.type = 'square'; osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        jet.roll = nX * 0.9;
        jet.pitch = nY * 0.3;
        jet.targetX = nX * 3400;
        jet.targetY = -nY * 900;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = false;
    });

    function triggerOreshnikFlash() {
        flashEl.style.opacity = '1';
        let fade = setInterval(() => {
            flashEl.style.opacity = parseFloat(flashEl.style.opacity) - 0.03;
            if (flashEl.style.opacity <= 0) { flashEl.style.opacity = '0'; clearInterval(fade); }
        }, 40);
    }

    function spawnOreshnik() {
        bombs.push({
            x: jet.x, y: jet.y - 100, z: 400,               
            vx: jet.roll * 12, vy: -5, vz: jet.speed * 0.22  
        });
        muzzleFlash = 6; 
        playSound('whistle');
    }

    function project3D(worldX, worldY, worldZ) {
        let relX = worldX - jet.x;
        let relY = worldY - jet.y;

        let x1 = relX * Math.cos(jet.roll) - relY * Math.sin(jet.roll);
        let y1 = relX * Math.sin(jet.roll) + relY * Math.cos(jet.roll);
        let y2 = y1 * Math.cos(jet.pitch) - worldZ * Math.sin(jet.pitch);
        let z2 = y1 * Math.sin(jet.pitch) + worldZ * Math.cos(jet.pitch);

        const fov = 1000;
        let scale = fov / (z2 + 1800);
        return {
            x: (window.innerWidth / 2) + (x1 * scale),
            y: (window.innerHeight * 0.45) - (y2 * scale),
            scale: scale,
            visible: (z2 + 1800 > 0) && (z2 < 28000)
        };
    }

    // ИСПРАВЛЕНО: Ударная волна увеличена на 500%! Уничтожает абсолютно всё в колоссальном радиусе
    function detonateMegaOreshnik(targetX, targetZ, screenX, screenY) {
        triggerOreshnikFlash();
        playSound('oreshnik');

        // РАДИУС УВЕЛИЧЕН НА 500% (Огромный масштаб зачистки в координатах мира)
        const giantRadiusX = 15000; 
        const giantRadiusZ = 12000;

        // Аннигиляция всех зданий в огромном секторе
        buildings.forEach(b => {
            if (b.alive && Math.abs(b.x - targetX) < giantRadiusX && Math.abs(b.z - targetZ) < giantRadiusZ) {
                b.alive = false;
                scoreBuildings++;
            }
        });

        // Аннигиляция всей техники врага
        enemies.forEach(e => {
            if (e.alive && Math.abs(e.x - targetX) < giantRadiusX && Math.abs(e.z - targetZ) < giantRadiusZ) {
                e.alive = false;
                scoreVehicles++;
            }
        });

        document.getElementById('b-score-out').innerText = scoreBuildings;
        document.getElementById('score-out').innerText = scoreVehicles;

        // ГИГАНТСКИЙ КАСКАД ВЗРЫВОВ НА ПОЛ-ЭКРАНА (Увеличен на 500%)
        for (let i = 0; i < 35; i++) {
            let offsetX = (Math.random() * 800 - 400) * (i * 0.15);
            let offsetY = (Math.random() * 400 - 200) * (i * 0.15);
            explosions.push({
                x: screenX + offsetX,
                y: screenY + offsetY,
                r: 40 + Math.random() * 50,
                maxR: 550 + Math.random() * 450, // Экран полностью заполняется огненной плазмой
                delay: i * 1.5                   // Сверхбыстрый испепеляющий каскад волн
            });
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        jet.x += (jet.targetX - jet.x) * 0.08;
        jet.y += (jet.targetY - jet.y) * 0.08;

        let speedMult = jet.speed * 0.2;

        if (isSpacePressed) {
            bombTimer++;
            if (bombTimer % 40 === 0) spawnOreshnik();
        }

        let horizonY = (canvas.height * 0.45) - (jet.pitch * 350) + (jet.y * 0.2);
        ctx.fillStyle = '#010205'; ctx.fillRect(0, 0, canvas.width, horizonY);
        ctx.fillStyle = '#01040c'; ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        // 1. Отрисовка зданий и руин
        buildings.forEach(b => {
            b.z -= speedMult; 
            if (b.z <= -600) { b.z = 25000; b.alive = true; }

            let bottomProj = project3D(b.x, b.y, b.z);
            let topProj = project3D(b.x, b.y + b.h, b.z);

            if (topProj.visible && topProj.y > horizonY) {
                let w3d = b.w * topProj.scale;
                let h3d = bottomProj.y - topProj.y;

                if (b.alive) {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.fillRect(topProj.x - w3d/2, topProj.y, w3d, h3d);
                    ctx.strokeRect(topProj.x - w3d/2, topProj.y, w3d, h3d);

                    ctx.fillStyle = '#ff9900';
                    let stepX = Math.max(10, w3d / 5);
                    let stepY = Math.max(12, h3d / 7);
                    for (let oy = topProj.y + 12; oy < bottomProj.y - 12; oy += stepY) {
                        for (let ox = topProj.x - w3d/2 + 6; ox < topProj.x + w3d/2 - 6; ox += stepX) {
                            ctx.fillRect(ox, oy, 2, 3);
                        }
                    }
                } else {
                    // ИСПРАВЛЕНО: Теперь на месте разрушенных зданий остаются явные тлеющие кратеры и пепел
                    ctx.fillStyle = 'rgba(255, 30, 0, 0.15)'; 
                    ctx.beginPath();
                    ctx.ellipse(bottomProj.x, bottomProj.y, w3d * 2, w3d * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#030305';
                    ctx.fillRect(bottomProj.x - w3d * 0.8, bottomProj.y - 3, w3d * 1.6, 5);
                }
            }
        });

        // 2. Враги
        let alertStatus = "ЧИСТО";
        enemies.forEach(e => {
            e.z -= speedMult;
            if (e.z <= -600) { e.z = 25000; e.alive = true; }

            if (e.alive) {
                if (e.type === 'tank') e.x += e.moveDir * 5;

                let proj = project3D(e.x, e.y, e.z);
                if (proj.visible && proj.y > horizonY) {
                    let sz = e.w * proj.scale;

                    if (e.type === 'tank') {
                        ctx.fillStyle = '#2e4a23'; ctx.strokeStyle = '#00ff66';
                        ctx.fillRect(proj.x - sz/2, proj.y - sz*0.3, sz, sz*0.4);
                        if (e.z > 1500 && e.z < 12000) {
                            if (alertStatus !== "CRITICAL LOCK") alertStatus = "ОБСТРЕЛ ИЗ ПУЛЕМЕТОВ";
                            e.shootCooldown++;
                            if (e.shootCooldown % 25 === 0) {
                                enemyProjectiles.push({
                                    x: e.x, y: e.y + 100, z: e.z,
                                    vx: (jet.x - e.x) / 25 + (Math.random() * 80 - 40), 
                                    vy: (jet.y - e.y) / 25, vz: -e.z / 25, type: 'bullet'
                                });
                                playSound('fire');
                            }
                        }
                    } else {
                        ctx.fillStyle = '#4a2323'; ctx.strokeStyle = '#ff3333';
                        ctx.fillRect(proj.x - sz/2, proj.y - sz*0.3, sz, sz*0.4);
                        if (e.z > 2500 && e.z < 18000) {
                            alertStatus = "CRITICAL LOCK (РАКЕТА ПВО)";
                            e.shootCooldown++;
                            if (e.shootCooldown % 60 === 0) {
                                enemyProjectiles.push({
                                    x: e.x, y: e.y + 200, z: e.z,
                                    vx: (jet.x - e.x) / 30, vy: (jet.y - e.y) / 30, vz: -e.z / 30, type: 'missile'
                                });
                                playSound('fire');
                            }
                        }
                    }
                }
            }
        });

        let warnEl = document.getElementById('pvo-warn');
        warnEl.innerText = alertStatus;
        warnEl.className = alertStatus === "ЧИСТО" ? "" : "alert-ui";

        // 3. Снаряды врагов
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let p = enemyProjectiles[i];
            p.x += p.vx; p.y += p.vy; p.z += p.vz;
            let pProj = project3D(p.x, p.y, p.z);

            if (!pProj.visible || p.z <= 0) {
                if (Math.abs(p.x - jet.x) < 500 && Math.abs(p.y - jet.y) < 400) {
                    jet.speed = Math.max(250, jet.speed - (p.type === 'missile' ? 40 : 10));
                }
                enemyProjectiles.splice(i, 1);
                continue;
            }

            ctx.fillStyle = p.type === 'bullet' ? '#00ff66' : '#ff2222';
            ctx.fillRect(pProj.x - 2, pProj.y - 2, Math.max(3, pProj.scale * 10), Math.max(3, pProj.scale * 10));
        }

        // 4. Движение снаряда Орешника до детонации
        for (let i = bombs.length - 1; i >= 0; i--) {
            let bomb = bombs[i];
            bomb.x += bomb.vx; bomb.y += bomb.vy; bomb.z += bomb.vz;
            bomb.vy -= 1.1; // Сверхзвуковое ускорение к земле

            let bProj = project3D(bomb.x, bomb.y, bomb.z);

            if (!bProj.visible || bProj.y > canvas.height || bomb.z > 26000) {
                bombs.splice(i, 1);
                continue;
            }

            let bWidth = Math.max(12, bProj.scale * 35);
            let bHeight = Math.max(24, bProj.scale * 70);

            ctx.save();
            ctx.translate(bProj.x, bProj.y);
            let fallAngle = Math.atan2(-bomb.vy, bomb.vz * 0.3) - Math.PI/2;
            ctx.rotate(fallAngle + jet.roll * 0.5);

            ctx.fillStyle = '#111e2e';
            ctx.beginPath();
            ctx.ellipse(0, 0, bWidth / 2, bHeight / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Пылающий хвост плазмы при входе в слои атмосферы
            ctx.fillStyle = 'rgba(255, 30, 0, 0.8)';
            ctx.fillRect(-bWidth/3, -bHeight, bWidth*0.66, bHeight/2);
            ctx.restore();

            // Точка столкновения с поверхностью земли
            if (bomb.y <= -2500) {
                detonateMegaOreshnik(bomb.x, bomb.z, bProj.x, bProj.y);
                bombs.splice(i, 1);
            }
        }

        // 5. Отрисовка ГИГАНТСКИХ каскадных мега-взрывов (+500% размеров)
        for (let i = explosions.length - 1; i >= 0; i--) {
            let exp = explosions[i];
            if (exp.delay > 0) { exp.delay--; continue; }
            exp.r += 12; // Взрывная волна движется с бешеной скоростью

            // Внешнее термобарическое огненное облако взрыва
            let grad = ctx.createRadialGradient(exp.x, exp.y, exp.r * 0.1, exp.x, exp.y, exp.r);
            grad.addColorStop(0, 'rgba(255, 255, 255, ' + (1 - exp.r / exp.maxR) + ')');
            grad.addColorStop(0.2, 'rgba(255, 140, 0, ' + (1 - exp.r / exp.maxR) + ')');
            grad.addColorStop(0.6, 'rgba(200, 20, 0, ' + (0.8 * (1 - exp.r / exp.maxR)) + ')');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2); ctx.fill();

            if (exp.r >= exp.maxR) explosions.splice(i, 1);
        }

        // 6. Спрайт твоего самолета mig.png
        let screenJetX = (canvas.width / 2) + (jet.x * 0.18);
        let screenJetY = (canvas.height * 0.55) - (jet.y * 0.25);
        
        ctx.save();
        ctx.translate(screenJetX, screenJetY);
        ctx.rotate(jet.roll);
        
        if (muzzleFlash > 0) {
            muzzleFlash--;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-25, 5, 15, 0, Math.PI*2); ctx.arc(25, 5, 15, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = 'rgba(255, 90, 0, 0.85)';
        ctx.fillRect(-12, 38, 5, 14); ctx.fillRect(7, 38, 5, 14);

        const imgSize = 160;
        ctx.drawImage(jetImage, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
        ctx.restore();

        document.getElementById('speed-out').innerText = Math.floor(jet.speed);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
