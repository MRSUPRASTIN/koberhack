<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Штурмовик: Мобильная Версия</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #010409; color: #ff3333; font-family: 'Consolas', monospace; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }

        #game-container { position: relative; width: 100vw; height: 100vh; display: none; touch-action: none; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #010206 0%, #030611 60%, #070b19 100%); }

        /* ЭКРАН ВСТУПЛЕНИЯ */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #0c0404 0%, #020000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; padding: 20px; text-align: center;
            border: 4px solid #330000; box-shadow: inset 0 0 100px rgba(255,0,0,0.3);
            transition: opacity 0.6s ease-out;
        }

        .matrix-text { color: #551111; font-size: 11px; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; animation: blink 1.5s infinite alternate; }
        
        .main-slogan {
            font-size: 32px; font-weight: 900; color: #ffffff;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            letter-spacing: 3px; margin-bottom: 10px;
            animation: shake 0.3s infinite alternate;
        }

        .sub-slogan { font-size: 14px; color: #ff3333; letter-spacing: 2px; margin-bottom: 40px; }

        .start-btn {
            background: transparent; border: 2px solid #ff3333; color: #ffffff;
            padding: 15px 35px; font-family: 'Consolas', monospace; font-size: 16px; font-weight: bold;
            cursor: pointer; border-radius: 4px; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        /* ИГРОВОЙ ИНТЕРФЕЙС */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 10px;
        }

        .glass-panel {
            background: rgba(5, 9, 20, 0.9); border: 1px solid #ff1111; border-radius: 6px;
            padding: 8px 12px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            font-size: 11px; text-shadow: 0 0 3px #ff3333; max-width: 48%;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .alert-ui { color: #ff1111; animation: blink 0.2s infinite alternate; font-weight: bold; }

        #radio-intercept {
            position: absolute; bottom: 120px; left: 10px;
            background: rgba(0, 5, 15, 0.85); border: 1px dashed #00ff66; color: #00ff66;
            padding: 6px 10px; font-size: 11px; border-radius: 4px; max-width: 280px;
            text-shadow: 0 0 4px #00ff66; opacity: 0; transition: opacity 0.3s;
        }

        /* МОБИЛЬНАЯ КНОПКА ОГНЯ */
        #fire-button {
            position: absolute; bottom: 25px; right: 25px;
            width: 85px; height: 85px; background: rgba(150, 0, 0, 0.3);
            border: 3px solid #ff0000; border-radius: 50%;
            color: #ffffff; font-weight: bold; font-family: 'Consolas', monospace;
            font-size: 16px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            pointer-events: auto; touch-action: none;
            text-shadow: 0 0 5px #fff;
        }
        #fire-button:active { background: rgba(255, 0, 0, 0.7); scale: 0.95; box-shadow: 0 0 35px #ff0000; }

        #nuclear-flash { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; pointer-events: none; opacity: 0; z-index: 50; }

        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 100% { transform: translate(-1px, -1px); } }
    </style>
</head>
<body>

<!-- ВСТУПЛЕНИЕ -->
<div id="intro-screen">
    <div class="matrix-text">СИСТЕМА БУК-М3 // МОБИЛЬНЫЙ ДЕСАНТ // КОРРЕКЦИЯ ТРАЕКТОРИИ... ПОДТВЕРЖДЕНО.</div>
    <div class="main-slogan">РАБОТАЙТЕ, БРАТЬЯ!</div>
    <div class="sub-slogan">ТАКТИЛЬНЫЙ ГИПЕРЗВУКОВОЙ СИМУЛЯТОР</div>
    <button class="start-btn" onclick="launchGameWithTransition()">ЗАПУСК СИСТЕМ</button>
</div>

<!-- ГЕЙМПЛЕЙ -->
<div id="game-container">
    <canvas id="stage"></canvas>
    <div id="nuclear-flash"></div>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">550</span> КМ/Ч</div>
                <div>ОРУЖИЕ: <span class="hud-val" style="color:#ff3300;">"ОРЕШНИК"</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right;">
                <div>СПО: <span class="alert-ui" id="pvo-warn">ПОИСК ЦЕЛЕЙ</span></div>
                <div>СНЕСЕНО ДОМОВ: <span id="b-score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="radio-intercept">📻 [РАДИОПЕРЕХВАТ]: ...</div>

        <!-- Сенсорная гашетка -->
        <div id="fire-button">ОГОНЬ</div>
    </div>
</div>

<script>
    const introScreen = document.getElementById('intro-screen');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('nuclear-flash');
    const radioEl = document.getElementById('radio-intercept');
    const fireBtn = document.getElementById('fire-button');

    const jetImage = new Image();
    jetImage.src = 'mig.png';

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let jet = { x: 0, y: 0, roll: 0, pitch: 0, targetX: 0, targetY: 0, speed: 550 };
    let bombs = []; let explosions = []; let buildings = []; let enemies = [];     
    let scoreVehicles = 0; let scoreBuildings = 0;
    let isFirePressed = false; let bombTimer = 0; let muzzleFlash = 0; 
    let isGameRunning = false;

    const radioPhrases = [
        "Внимание! Зафиксирован разделяющийся блок!",
        "Первый сектор полностью уничтожен! Связи нет!",
        "ПВО не видит цель! Скорость запредельная!",
        "У нас минус квартал! Всем отходить!",
        "Ударная волна колоссальная! Город горит!",
        "Потеряна связь с базой! Нас выжигают!"
    ];

    function launchGameWithTransition() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(280, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);

        introScreen.style.opacity = '0';
        setTimeout(() => {
            introScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            resize();
            
            flashEl.style.opacity = '1';
            let initialFade = setInterval(() => {
                flashEl.style.opacity = parseFloat(flashEl.style.opacity) - 0.05;
                if (flashEl.style.opacity <= 0) { flashEl.style.opacity = '0'; clearInterval(initialFade); }
            }, 30);

            isGameRunning = true;
            setTimeout(speakRadio, 600);
        }, 600);
    }

    function initWorld() {
        buildings = []; enemies = [];
        for (let x = -8; x <= 8; x += 2) {
            for (let z = 4; z <= 24; z += 3) {
                let worldX = x * 1600 + (Math.random() * 100 - 50);
                let worldZ = z * 1300;
                buildings.push({ x: worldX, y: -2500, h: 600 + Math.random() * 1100, w: 450, alive: true });
            }
        }
    }
    initWorld();

    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'oreshnik') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(40, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1, audioCtx.currentTime + 1.8);
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
            osc.start(); osc.stop(audioCtx.currentTime + 1.8);
        }
    }

    function speakRadio() {
        if ('speechSynthesis' in window && isGameRunning) {
            window.speechSynthesis.cancel(); 
            let phrase = radioPhrases[Math.floor(Math.random() * radioPhrases.length)];
            radioEl.innerText = `📻 [ПЕРЕХВАТ]: "${phrase.toUpperCase()}"`;
            radioEl.style.opacity = '1';
            
            let utterance = new SpeechSynthesisUtterance(phrase);
            utterance.lang = 'ru-RU'; utterance.pitch = 0.6; utterance.rate = 1.2; 
            utterance.onend = () => { setTimeout(() => { radioEl.style.opacity = '0'; }, 1200); };
            window.speechSynthesis.speak(utterance);
        }
    }

    // ТАЧ-УПРАВЛЕНИЕ ДЛЯ СМАРТФОНОВ (ДВИЖЕНИЕ ПАЛЬЦЕМ В ЛЮБОЙ ТОЧКЕ ЭКРАНА)
    window.addEventListener('touchmove', (e) => {
        if (!isGameRunning) return;
        let touch = e.touches[0];
        
        // Расчет смещения относительно центра экрана
        let nX = (touch.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (touch.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        
        // Ограничиваем диапазоны
        nX = Math.max(-1, Math.min(1, nX));
        nY = Math.max(-1, Math.min(1, nY));

        jet.roll = nX * 0.8; jet.pitch = nY * 0.25;
        jet.targetX = nX * 3200; jet.targetY = -nY * 800;
    }, { passive: true });

    // КНОПКА СБРОСА БОМБ (ОТДЕЛЬНЫЙ ТАЧ-ТРИГГЕР)
    fireBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); isFirePressed = true; });
    fireBtn.addEventListener('touchend', (e) => { e.stopPropagation(); isFirePressed = false; });

    function triggerOreshnikFlash() {
        flashEl.style.opacity = '0.7';
        let fade = setInterval(() => {
            flashEl.style.opacity = parseFloat(flashEl.style.opacity) - 0.06;
            if (flashEl.style.opacity <= 0) { flashEl.style.opacity = '0'; clearInterval(fade); }
        }, 40);
    }

    function spawnOreshnik() {
        bombs.push({
            x: jet.x + (Math.random() * 100 - 50), y: jet.y - 120, z: 500,               
            vx: jet.roll * 12, vy: -18, vz: jet.speed * 0.22  
        });
        muzzleFlash = 4; playSound('whistle');
    }

    function project3D(worldX, worldY, worldZ) {
        let relX = worldX - jet.x; let relY = worldY - jet.y;
        let x1 = relX * Math.cos(jet.roll) - relY * Math.sin(jet.roll);
        let y1 = relX * Math.sin(jet.roll) + relY * Math.cos(jet.roll);
        let y2 = y1 * Math.cos(jet.pitch) - worldZ * Math.sin(jet.pitch);
        let z2 = y1 * Math.sin(jet.pitch) + worldZ * Math.cos(jet.pitch);
        const fov = 900; let scale = fov / (z2 + 1600);
        return { x: (window.innerWidth / 2) + (x1 * scale), y: (window.innerHeight * 0.45) - (y2 * scale), scale: scale, visible: (z2 + 1600 > 0) && (z2 < 26000) };
    }

    function detonateMegaOreshnik(targetX, targetZ, screenX, screenY) {
        triggerOreshnikFlash(); playSound('oreshnik'); speakRadio();
        const blastRadiusX = 3500; const blastRadiusZ = 3000;

        buildings.forEach(b => {
            if (b.alive && Math.abs(b.x - targetX) < blastRadiusX && Math.abs(b.z - targetZ) < blastRadiusZ) {
                b.alive = false; scoreBuildings++;
            }
        });
        document.getElementById('b-score-out').innerText = scoreBuildings;

        // Термоядерный гриб взрыва под мобильные экраны
        explosions.push({ x: screenX, y: screenY, r: 15, maxR: 280 + Math.random() * 120, speed: 8, alpha: 1.0 });
        for(let i=0; i<4; i++) {
            explosions.push({ x: screenX + (Math.random() * 160 - 80), y: screenY + (Math.random() * 60 - 30), r: 8, maxR: 110 + Math.random() * 90, speed: 5, alpha: 0.9 });
        }
    }

    function loop() {
        requestAnimationFrame(loop);
        if (!isGameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        jet.x += (jet.targetX - jet.x) * 0.08; jet.y += (jet.targetY - jet.y) * 0.08;
        let speedMult = jet.speed * 0.2;

        if (isFirePressed) {
            bombTimer++;
            if (bombTimer % 25 === 0) spawnOreshnik();
        }

        let horizonY = (canvas.height * 0.45) - (jet.pitch * 350) + (jet.y * 0.2);
        ctx.fillStyle = '#010206'; ctx.fillRect(0, 0, canvas.width, horizonY);
        ctx.fillStyle = '#020511'; ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        buildings.forEach(b => {
            b.z -= speedMult; if (b.z <= -600) { b.z = 25000; b.alive = true; }
            let bottomProj = project3D(b.x, b.y, b.z); let topProj = project3D(b.x, b.y + b.h, b.z);

            if (topProj.visible && topProj.y > horizonY) {
                let w3d = b.w * topProj.scale; let h3d = bottomProj.y - topProj.y;
                if (b.alive) {
                    ctx.fillStyle = 'rgba(18, 28, 54, 0.95)'; ctx.strokeStyle = '#ff2222'; ctx.lineWidth = 1;
                    ctx.fillRect(topProj.x - w3d/2, topProj.y, w3d, h3d); ctx.strokeRect(topProj.x - w3d/2, topProj.y, w3d, h3d);
                } else {
                    ctx.fillStyle = '#08080f'; ctx.strokeStyle = 'rgba(255, 60, 0, 0.15)';
                    ctx.fillRect(bottomProj.x - w3d/2, bottomProj.y - h3d * 0.2, w3d, h3d * 0.2);
                    ctx.strokeRect(bottomProj.x - w3d/2, bottomProj.y - h3d * 0.2, w3d, h3d * 0.2);
                }
            }
        });

        for (let i = bombs.length - 1; i >= 0; i--) {
            let bomb = bombs[i]; bomb.x += bomb.vx; bomb.y += bomb.vy; bomb.z += bomb.vz; bomb.vy -= 1.4; 
            let bProj = project3D(bomb.x, bomb.y, bomb.z);
            if (!bProj.visible || bProj.y > canvas.height || bomb.z > 26000) { bombs.splice(i, 1); continue; }

            let bWidth = Math.max(8, bProj.scale * 25); let bHeight = Math.max(16, bProj.scale * 50);
            ctx.save(); ctx.translate(bProj.x, bProj.y);
            let fallAngle = Math.atan2(-bomb.vy, bomb.vz * 0.3) - Math.PI/2; ctx.rotate(fallAngle + jet.roll * 0.5);
            ctx.fillStyle = '#1a252f'; ctx.beginPath(); ctx.ellipse(0, 0, bWidth / 2, bHeight / 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255, 60, 0, 0.8)'; ctx.fillRect(-bWidth/3, -bHeight, bWidth*0.66, bHeight/2); ctx.restore();

            let hitTriggered = false;
            buildings.forEach(b => {
                if (b.alive && Math.abs(bomb.x - b.x) < b.w * 1.1 && Math.abs(bomb.z - b.z) < 500) {
                    if (bomb.y <= b.y + b.h) hitTriggered = true;
                }
            });

            if (hitTriggered || bomb.y <= -2500) { detonateMegaOreshnik(bomb.x, bomb.z, bProj.x, bProj.y); bombs.splice(i, 1); }
        }

        for (let i = explosions.length - 1; i >= 0; i--) {
            let exp = explosions[i]; exp.r += exp.speed; exp.y -= exp.speed * 0.2; exp.alpha -= 0.015; 
            if (exp.alpha <= 0 || exp.r >= exp.maxR) { explosions.splice(i, 1); continue; }

            let grad = ctx.createRadialGradient(exp.x, exp.y, exp.r * 0.05, exp.x, exp.y, exp.r);
            grad.addColorStop(0, 'rgba(255, 255, 255, ' + exp.alpha + ')');
            grad.addColorStop(0.3, 'rgba(255, 150, 0, ' + exp.alpha + ')');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2); ctx.fill();
        }

        let screenJetX = (canvas.width / 2) + (jet.x * 0.18); let screenJetY = (canvas.height * 0.55) - (jet.y * 0.25);
        ctx.save(); ctx.translate(screenJetX, screenJetY); ctx.rotate(jet.roll);
        
        ctx.fillStyle = 'rgba(255, 90, 0, 0.85)'; ctx.fillRect(-8, 25, 4, 10); ctx.fillRect(4, 25, 4, 10);
        const imgSize = 110; ctx.drawImage(jetImage, -imgSize / 2, -imgSize / 2, imgSize, imgSize); ctx.restore();

        document.getElementById('speed-out').innerText = Math.floor(jet.speed);
    }
    loop();
</script>
</body>
</html>
