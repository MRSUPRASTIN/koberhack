<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELL-NET // EXPLOIT INTERFACE</title>
    <style>
        :root {
            --matrix-blue: #007acc;
            --matrix-glow: rgba(0, 122, 204, 0.6);
            --dark-core: #03060a;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-core);
            color: #fff; font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .main-container {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; box-sizing: border-box;
        }

        .terminal {
            width: 100%; max-width: 650px;
            background: rgba(4, 8, 15, 0.9);
            border: 1px solid var(--matrix-blue);
            box-shadow: 0 0 50px var(--matrix-glow);
            padding: 30px; border-radius: 4px; backdrop-filter: blur(15px);
            position: relative;
        }

        /* Информер от 2IP */
        .ip-informer {
            margin-bottom: 15px;
            border: 1px solid rgba(0, 122, 204, 0.3);
            display: inline-block;
            padding: 5px;
            background: #000;
        }

        .terminal-header {
            border-bottom: 1px solid var(--matrix-blue);
            padding-bottom: 12px; margin-bottom: 20px;
            font-size: 0.85rem; color: var(--matrix-blue);
            display: flex; justify-content: space-between;
            font-weight: bold;
        }

        #slots-info {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 30, 30, 0.15);
            border: 1px solid #ff3333; padding: 12px;
            font-size: 0.8rem; color: #ff3333; z-index: 10;
        }

        .step-input h2 { margin: 0 0 10px; font-size: 1.3rem; color: var(--matrix-blue); }
        
        input[type="text"] {
            width: 100%; background: #000; border: 1px solid var(--matrix-blue);
            padding: 15px; color: #fff; font-family: monospace; outline: none;
            box-sizing: border-box; font-size: 1.1rem; margin-bottom: 10px;
        }

        .action-btn {
            width: 100%; background: var(--matrix-blue); color: #000; border: none;
            padding: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            transition: 0.3s;
        }
        .action-btn:hover { background: #fff; box-shadow: 0 0 20px #fff; }

        .step-loading { display: none; flex-direction: column; height: 320px; }
        .log-display {
            flex-grow: 1; background: #000; border: 1px solid #112233;
            padding: 15px; overflow-y: auto; font-size: 0.9rem; color: #aaddff;
            display: flex; flex-direction: column; gap: 8px;
        }
        .log-success { color: #00ff66; font-weight: bold; }

        .step-final { display: none; text-align: center; flex-direction: column; gap: 15px; }
        .timer-box { font-size: 2rem; color: #ff3333; font-weight: bold; text-shadow: 0 0 10px red; }
        
        .final-link {
            display: inline-block; background: var(--matrix-blue); color: #000;
            text-decoration: none; padding: 20px 40px; font-weight: bold;
            font-size: 1.2rem; box-shadow: 0 0 30px var(--matrix-glow);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        #live-notifications { position: fixed; bottom: 20px; left: 20px; z-index: 10; }
        .notify-toast {
            background: rgba(0, 122, 204, 0.1); border-left: 4px solid var(--matrix-blue);
            padding: 12px; margin-top: 10px; font-size: 0.8rem; animation: slide 0.5s ease;
        }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div id="slots-info">СЛОТОВ: <span id="slot-count">3</span>/100</div>
    <div id="live-notifications"></div>

    <div class="main-container">
        <div class="terminal">
            <div class="terminal-header">
                <span>CORE_BYPASS // v8.0</span>
                <span>SYSTEM_CHECK: OK</span>
            </div>

            <div id="block-input" class="step-input">
                <div class="ip-informer">
                    <a href="https://2ip.io/ru/privacy/" target="_blank">
                        <img src="https://2ip.io/ru/privacy/bar/26098820_297f2a.png" alt="2ip информер" style="max-width: 100%; display: block;">
                    </a>
                </div>
                <h2>Авторизация узла</h2>
                <input type="text" id="target-input" placeholder="Введите @username" autocomplete="off">
                <button class="action-btn" onclick="startExploit()">Запустить сканирование</button>
            </div>

            <div id="block-loading" class="step-loading">
                <div class="log-display" id="log-box"></div>
            </div>

            <div id="block-final" class="step-final">
                <div style="color:#00ff66; font-size: 1.2rem; font-weight: bold;">✓ ДОСТУП ДЛЯ ВАШЕГО IP ОТКРЫТ</div>
                <div class="ip-informer" style="margin: 0 auto;">
                    <img src="https://2ip.io/ru/privacy/bar/26098820_297f2a.png" alt="2ip информер">
                </div>
                <div class="timer-box" id="countdown">05:00</div>
                <a href="https://t.me/mirieli1977" target="_blank" class="final-link">ПОЛУЧИТЬ В TELEGRAM</a>
                <p style="font-size: 0.7rem; color: #666;">Подтвердите сессию, пока таймер не истек.</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        // Анимация синего огня (плазма)
        let particles = [];
        class Flame {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.speed = Math.random() * 2 + 1;
                this.radius = Math.random() * 25 + 5;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            draw() {
                this.y -= this.speed;
                this.opacity -= 0.002;
                if (this.opacity <= 0) this.reset();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 150, 255, ${this.opacity})`;
                ctx.fill();
            }
        }
        for(let i=0; i<70; i++) particles.push(new Flame());
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => p.draw());
            requestAnimationFrame(anim);
        }
        anim();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function beep() {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.frequency.setValueAtTime(700, audioCtx.currentTime);
            g.gain.setValueAtTime(0.01, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.05);
        }

        function startExploit() {
            const input = document.getElementById('target-input').value.trim();
            if(!input) return;
            document.getElementById('block-input').style.display = 'none';
            document.getElementById('block-loading').style.display = 'flex';
            
            const logBox = document.getElementById('log-box');
            const logs = [
                "> Анализ данных информера...",
                "> Проверка соответствия IP...",
                `> Цель: ${input} определена.`,
                "> Взлом базы данных...",
                "> Подмена токена сессии...",
                "> Обход защиты Cloudflare...",
                "[OK] ВЗЛОМ УСПЕШНО ЗАВЕРШЕН."
            ];

            let i = 0;
            const t = setInterval(() => {
                if(i < logs.length) {
                    beep();
                    const p = document.createElement('p');
                    if(logs[i].includes('[OK]')) p.className = 'log-success';
                    p.innerText = logs[i];
                    logBox.appendChild(p);
                    logBox.scrollTop = logBox.scrollHeight;
                    i++;
                } else {
                    clearInterval(t);
                    setTimeout(() => {
                        document.getElementById('block-loading').style.display = 'none';
                        document.getElementById('block-final').style.display = 'flex';
                        startTimer();
                    }, 1000);
                }
            }, 800);
        }

        function startTimer() {
            let s = 300;
            const cd = document.getElementById('countdown');
            setInterval(() => {
                let m = Math.floor(s/60); let sc = s%60;
                cd.innerText = `0${m}:${sc<10?'0'+sc:sc}`;
                if(s>0) s--;
            }, 1000);
        }

        // Уведомления
        const nicks = ['@x_hacker', '@crypto_pro', '@anon_user', '@admin_bot', '@daria_v'];
        setInterval(() => {
            const c = document.getElementById('live-notifications');
            const d = document.createElement('div'); d.className = 'notify-toast';
            d.innerText = `Пользователь ${nicks[Math.floor(Math.random()*nicks.length)]} зашел через Telegram`;
            c.appendChild(d); setTimeout(() => d.remove(), 4000);
        }, 6000);
    </script>
</body>
</html>
