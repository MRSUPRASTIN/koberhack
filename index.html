<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Штурмовик: Тяжёлые Авиабомбы</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #ff3333; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #010206 0%, #040813 60%, #0d1324 100%); }

        /* HUD Панель */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(8, 12, 24, 0.9);
            border: 2px solid #ff3333;
            border-radius: 6px;
            padding: 12px 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
            font-size: 15px;
            text-shadow: 0 0 5px #ff3333;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .alert-ui { color: #ff3333; animation: blink 0.2s infinite alternate; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.9);
            border: 1px solid #ff3333;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: auto;
            margin-bottom: 10px;
            color: #fff;
        }

        #damage-flash {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(255, 0, 0, 0.35); pointer-events: none; opacity: 0;
            transition: opacity 0.05s ease;
        }

        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>
    <div id="damage-flash"></div>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">550</span> КМ/Ч</div>
                <div>КАЛИБР: <span class="hud-val" style="color:#ffcc00;">ФАБ-500 (Фугасные)</span></div>
                <div style="color: #00ff66;">СТАТУС ПОДВЕСОК: <span class="hud-val" style="color:#00ff66;">ОК</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right;">
                <div>УГРОЗА: <span class="alert-ui" id="pvo-warn">ПОИСК ЦЕЛЕЙ</span></div>
                <div>УНИЧТОЖЕНО ТЕХНИКИ: <span id="score-out" class="hud-val" style="color: #ffcc00;">0</span></div>
                <div style="color: #00ffff;">РАЗРУШЕНО ЗДАНИЙ: <span id="b-score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="controls-bar">
            💣 <b>ЗАЖМИ ПРОБЕЛ:</b> Штурмовик сбрасывает увесистые бомбы ФАБ-500 с интервалом. Рассчитывай упреждение траектории!
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('damage-flash');

    const jetImage = new Image();
    jetImage.src = 'mig.png';

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let jet = {
        x: 0, y: 0,
        roll: 0, pitch: 0,
        targetX: 0, targetY: 0,
        speed: 550, altitude: 4000
    };

    let bombs = [];
    let explosions = [];
    let buildings = [];
    let enemies = [];     
    let enemyProjectiles = []; 
    let scoreVehicles = 0;
    let scoreBuildings = 0;
    let isSpacePressed = false; 
    let bombTimer = 0;          
    let muzzleFlash = 0; 

    function initWorld() {
        buildings = [];
        enemies = [];
        
        for (let x = -10; x <= 10; x += 2.5) {
            for (let z = 4; z <= 28; z += 4) {
                let worldX = x * 1400 + (Math.random() * 200 - 100);
                let worldZ = z * 1100;
                
                buildings.push({
                    x: worldX, y: -2500, z: worldZ,
                    w: 380, h: 400 + Math.random() * 800,
                    alive: true
                });

                if (Math.random() < 0.5) {
                    enemies.push({
                        x: worldX + (Math.random() * 400 - 200),
                        y: -2500,
                        z: worldZ + 150,
                        type: Math.random() > 0.4 ? 'tank' : 'pvo',
                        w: 90, h: 50,
                        alive: true,
                        shootCooldown: Math.floor(Math.random() * 50),
                        moveDir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }
        }
    }
    initWorld();

    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.7);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
            osc.start(); osc.stop(audioCtx.currentTime + 0.7);
        } else if (type === 'boom') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(55, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(5, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'fire') {
            osc.type = 'square'; osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        jet.roll = nX * 0.9;
        jet.pitch = nY * 0.3;
        jet.targetX = nX * 3400;
        jet.targetY = -nY * 900;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = false;
    });

    function triggerFlash() {
        flashEl.style.opacity = '1';
        setTimeout(() => { flashEl.style.opacity = '0'; }, 60);
    }

    function spawnBomb() {
        // Создаем массив бомбы
        bombs.push({
            x: jet.x + (Math.random() * 60 - 30), // Небольшое смещение влево/вправо (имитация сброса с пилонов крыльев)
            y: jet.y - 120,       
            z: 300,               
            vx: jet.roll * 18,    
            vy: -3,               // Тяжёлый начальный сход
            vz: jet.speed * 0.15  
        });
        muzzleFlash = 4; 
        playSound('whistle');
    }

    function project3D(worldX, worldY, worldZ) {
        let relX = worldX - jet.x;
        let relY = worldY - jet.y;

        let x1 = relX * Math.cos(jet.roll) - relY * Math.sin(jet.roll);
        let y1 = relX * Math.sin(jet.roll) + relY * Math.cos(jet.roll);
        let y2 = y1 * Math.cos(jet.pitch) - worldZ * Math.sin(jet.pitch);
        let z2 = y1 * Math.sin(jet.pitch) + worldZ * Math.cos(jet.pitch);

        const fov = 1000;
        let scale = fov / (z2 + 1800);
        return {
            x: (window.innerWidth / 2) + (x1 * scale),
            y: (window.innerHeight * 0.45) - (y2 * scale),
            scale: scale,
            visible: (z2 + 1800 > 0) && (z2 < 28000)
        };
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        jet.x += (jet.targetX - jet.x) * 0.08;
        jet.y += (jet.targetY - jet.y) * 0.08;

        let speedMult = jet.speed * 0.2;

        // Фикс "пулемёта": изменён шаг (сброс раз в 18 кадров вместо 5), чтобы летели как отдельные бомбы
        if (isSpacePressed) {
            bombTimer++;
            if (bombTimer % 18 === 0) spawnBomb();
        }

        let horizonY = (canvas.height * 0.45) - (jet.pitch * 350) + (jet.y * 0.2);
        ctx.fillStyle = '#010205'; ctx.fillRect(0, 0, canvas.width, horizonY);
        ctx.fillStyle = '#02050e'; ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        // 1. Здания
        buildings.forEach(b => {
            b.z -= speedMult; 
            if (b.z <= -600) { b.z = 25000; b.alive = true; }

            let bottomProj = project3D(b.x, b.y, b.z);
            let topProj = project3D(b.x, b.y + b.h, b.z);

            if (topProj.visible && topProj.y > horizonY) {
                let w3d = b.w * topProj.scale;
                let h3d = bottomProj.y - topProj.y;

                if (b.alive) {
                    ctx.fillStyle = 'rgba(10, 15, 30, 0.95)';
                    ctx.strokeStyle = 'rgba(255, 60, 60, 0.35)';
                    ctx.lineWidth = 1;
                    ctx.fillRect(topProj.x - w3d/2, topProj.y, w3d, h3d);
                    ctx.strokeRect(topProj.x - w3d/2, topProj.y, w3d, h3d);

                    ctx.fillStyle = '#ffa500';
                    let stepX = Math.max(8, w3d / 5);
                    let stepY = Math.max(10, h3d / 8);
                    for (let oy = topProj.y + 12; oy < bottomProj.y - 12; oy += stepY) {
                        for (let ox = topProj.x - w3d/2 + 6; ox < topProj.x + w3d/2 - 6; ox += stepX) {
                            ctx.fillRect(ox, oy, 2, 3);
                        }
                    }
                } else {
                    ctx.fillStyle = '#070709';
                    ctx.fillRect(bottomProj.x - w3d/2, bottomProj.y - 6, w3d, 8);
                }
            }
        });

        // 2. Враги
        let alertStatus = "ЧИСТО";
        enemies.forEach(e => {
            e.z -= speedMult;
            if (e.z <= -600) { e.z = 25000; e.alive = true; }

            if (e.alive) {
                if (e.type === 'tank') e.x += e.moveDir * 5;

                let proj = project3D(e.x, e.y, e.z);
                if (proj.visible && proj.y > horizonY) {
                    let sz = e.w * proj.scale;

                    if (e.type === 'tank') {
                        ctx.fillStyle = '#2e4a23'; ctx.strokeStyle = '#00ff66';
                        ctx.fillRect(proj.x - sz/2, proj.y - sz*0.3, sz, sz*0.4);
                        ctx.fillStyle = '#1c3015'; 
                        ctx.fillRect(proj.x - sz*0.2, proj.y - sz*0.5, sz*0.4, sz*0.25);

                        if (e.z > 1500 && e.z < 12000) {
                            if (alertStatus !== "CRITICAL LOCK") alertStatus = "ОБСТРЕЛ ИЗ ПУЛЕМЕТОВ";
                            e.shootCooldown++;
                            if (e.shootCooldown % 20 === 0) {
                                enemyProjectiles.push({
                                    x: e.x, y: e.y + 100, z: e.z,
                                    vx: (jet.x - e.x) / 25 + (Math.random() * 80 - 40), 
                                    vy: (jet.y - e.y) / 25,
                                    vz: -e.z / 25,
                                    type: 'bullet'
                                });
                                playSound('fire');
                            }
                        }
                    } else {
                        ctx.fillStyle = '#4a2323'; ctx.strokeStyle = '#ff3333';
                        ctx.fillRect(proj.x - sz/2, proj.y - sz*0.3, sz, sz*0.4);
                        ctx.fillStyle = '#ffcc00'; 
                        ctx.fillRect(proj.x - sz*0.1, proj.y - sz*0.6, sz*0.2, sz*0.3);

                        if (e.z > 2500 && e.z < 18000) {
                            alertStatus = "CRITICAL LOCK (РАКЕТА ПВО)";
                            e.shootCooldown++;
                            if (e.shootCooldown % 60 === 0) {
                                enemyProjectiles.push({
                                    x: e.x, y: e.y + 200, z: e.z,
                                    vx: (jet.x - e.x) / 30,
                                    vy: (jet.y - e.y) / 30,
                                    vz: -e.z / 30,
                                    type: 'missile'
                                });
                                playSound('fire');
                            }
                        }
                    }
                }
            }
        });

        let warnEl = document.getElementById('pvo-warn');
        warnEl.innerText = alertStatus;
        if (alertStatus === "ЧИСТО") warnEl.className = "";
        else warnEl.className = "alert-ui";

        // 3. Снаряды врагов
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let p = enemyProjectiles[i];
            p.x += p.vx; p.y += p.vy; p.z += p.vz;
            let pProj = project3D(p.x, p.y, p.z);

            if (!pProj.visible || p.z <= 0) {
                if (Math.abs(p.x - jet.x) < 500 && Math.abs(p.y - jet.y) < 400) {
                    triggerFlash();
                    let damage = p.type === 'missile' ? 60 : 15;
                    jet.speed = Math.max(250, jet.speed - damage);
                }
                enemyProjectiles.splice(i, 1);
                continue;
            }

            if (p.type === 'bullet') {
                ctx.fillStyle = '#00ff66'; 
                ctx.fillRect(pProj.x - 2, pProj.y - 2, Math.max(2, pProj.scale * 8), Math.max(2, pProj.scale * 8));
            } else {
                ctx.fillStyle = '#ff2222'; 
                ctx.beginPath(); ctx.arc(pProj.x, pProj.y, Math.max(4, pProj.scale * 18), 0, Math.PI * 2); ctx.fill();
            }
        }

        // 4. Логика И ВНЕШНИЙ ВИД БОМБЫ
        for (let i = bombs.length - 1; i >= 0; i--) {
            let bomb = bombs[i];
            bomb.x += bomb.vx; bomb.y += bomb.vy; bomb.z += bomb.vz;
            bomb.vy -= 0.65; // Мощная гравитация тяжелой бомбы

            let bProj = project3D(bomb.x, bomb.y, bomb.z);

            if (!bProj.visible || bProj.y > canvas.height || bomb.z > 26000) {
                bombs.splice(i, 1);
                continue;
            }

            // Рисуем РЕАЛИСТИЧНУЮ БОМБУ вместо точки
            let bWidth = Math.max(7, bProj.scale * 24);
            let bHeight = Math.max(14, bProj.scale * 45);

            ctx.save();
            ctx.translate(bProj.x, bProj.y);
            // Наклоняем бомбу по ходу её падения вниз
            let fallAngle = Math.atan2(-bomb.vy, bomb.vz * 0.3) - Math.PI/2;
            ctx.rotate(fallAngle + jet.roll * 0.5);

            // Корпус бомбы (Тёмно-серый фугас)
            ctx.fillStyle = '#5a6268';
            ctx.strokeStyle = '#2b2e31';
            ctx.lineWidth = 1.5;
            
            // Тело ФАБ-500 (Овальная форма носовой части)
            ctx.beginPath();
            ctx.ellipse(0, 0, bWidth / 2, bHeight / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Стабилизаторы (Оперение хвоста бомбы вверху)
            ctx.fillStyle = '#3a3f44';
            ctx.fillRect(-bWidth * 0.6, -bHeight / 2, bWidth * 0.3, bHeight * 0.25);
            ctx.fillRect(bWidth * 0.3, -bHeight / 2, bWidth * 0.3, bHeight * 0.25);
            
            ctx.restore();

            // Коллизии
            buildings.forEach(b => {
                if (b.alive && Math.abs(bomb.x - b.x) < b.w && Math.abs(bomb.z - b.z) < 400) {
                    if (bomb.y <= b.y + b.h && bomb.y >= b.y) {
                        b.alive = false; scoreBuildings++;
                        document.getElementById('b-score-out').innerText = scoreBuildings;
                        playSound('boom');
                        explosions.push({ x: bProj.x, y: bProj.y, r: 10, maxR: 70 }); // Больше взрыв
                        bombs.splice(i, 1);
                    }
                }
            });

            enemies.forEach(e => {
                if (e.alive && Math.abs(bomb.x - e.x) < e.w * 1.5 && Math.abs(bomb.z - e.z) < 500) {
                    if (Math.abs(bomb.y - e.y) < 300) {
                        e.alive = false; scoreVehicles++;
                        document.getElementById('score-out').innerText = scoreVehicles;
                        playSound('boom');
                        explosions.push({ x: bProj.x, y: bProj.y, r: 15, maxR: 85 }); // Больше взрыв техники
                        bombs.splice(i, 1);
                    }
                }
            });

            if (bomb.y <= -2500) {
                explosions.push({ x: bProj.x, y: bProj.y, r: 6, maxR: 45 });
                playSound('boom');
                bombs.splice(i, 1);
            }
        }

        // 5. Взрывы
        for (let i = explosions.length - 1; i >= 0; i--) {
            let exp = explosions[i]; exp.r += 4.5;
            ctx.fillStyle = 'rgba(255, 50, 0, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255, 190, 0, ' + (1 - exp.r / exp.maxR) + ')';
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.r * 0.55, 0, Math.PI * 2); ctx.fill();
            if (exp.r >= exp.maxR) explosions.splice(i, 1);
        }

        // 6. Спрайт самолета mig.png
        let screenJetX = (canvas.width / 2) + (jet.x * 0.18);
        let screenJetY = (canvas.height * 0.55) - (jet.y * 0.25);
        
        ctx.save();
        ctx.translate(screenJetX, screenJetY);
        ctx.rotate(jet.roll);
        
        if (muzzleFlash > 0) {
            muzzleFlash--;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath(); ctx.arc(-25, 5, 12, 0, Math.PI*2); ctx.arc(25, 5, 12, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = 'rgba(255, 90, 0, 0.85)';
        ctx.fillRect(-12, 38, 5, 14); ctx.fillRect(7, 38, 5, 14);

        const imgSize = 160;
        ctx.drawImage(jetImage, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
        ctx.restore();

        document.getElementById('speed-out').innerText = Math.floor(jet.speed);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
