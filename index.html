<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Машиниста Метро</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #111; color: #fff; font-family: 'Courier New', Courier, monospace; overflow: hidden; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Вид из лобового стекла */
        #windshield {
            flex: 2;
            background: black;
            position: relative;
            overflow: hidden;
            border-bottom: 5px solid #333;
        }

        /* Тоннель (рельсы и стены уходят в перспективу) */
        .rail {
            position: absolute;
            bottom: 0;
            width: 4px;
            background: #555;
            height: 50%;
            transform-origin: top center;
        }
        #rail-left { left: 45%; transform: skewX(-30deg); }
        #rail-right { right: 45%; transform: skewX(30deg); }

        /* Огни тоннеля / Станция */
        #tunnel-environment {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .wall-light {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 200, 100, 0.5);
            border-radius: 50%;
            top: 40%;
        }

        /* Станция */
        #station {
            position: absolute;
            width: 200%;
            height: 100%;
            background: linear-gradient(to bottom, #777, #444);
            top: 0;
            left: 150%; /* Начинается за экраном справа */
            transform: skewX(-20deg);
            transition: left 0.1s linear;
            display: flex;
            align-items: flex-end;
            padding-bottom: 20px;
        }
        #station-name {
            position: absolute;
            top: 20%;
            left: 10%;
            background: #fff;
            color: #000;
            padding: 5px 20px;
            font-weight: bold;
            font-size: 24px;
        }
        .passenger {
            width: 15px;
            height: 40px;
            background: #fff;
            margin-right: 15px;
            border-radius: 5px 5px 0 0;
            display: inline-block;
        }

        /* Семафор */
        #semaphore {
            position: absolute;
            left: 10%;
            top: 30%;
            width: 20px;
            height: 50px;
            background: #222;
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 4px;
        }
        .light { width: 12px; height: 12px; border-radius: 50%; background: #333; }
        .light.red { background: #ff3333; box-shadow: 0 0 10px #ff3333; }
        .light.green { background: #33ff33; box-shadow: 0 0 10px #33ff33; }

        /* Кабина / Панель управления */
        #dashboard {
            flex: 1;
            background: #2c3e50;
            border-top: 4px solid #34495e;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .screen {
            background: #000;
            border: 3px solid #7f8c8d;
            padding: 10px;
            border-radius: 5px;
            min-width: 200px;
            color: #00ff00;
            font-family: monospace;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.5);
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 5px #c0392b;
            active-transform: translateY(4px);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #c0392b;
        }
        .btn.go { background: #2ecc71; box-shadow: 0 5px #27ae60; }
        .btn.go:active { box-shadow: 0 1px #27ae60; }
        .btn.door { background: #f1c40f; color: black; box-shadow: 0 5px #f39c12; }
        .btn.door:active { box-shadow: 0 1px #f39c12; }

        /* Информационное окно */
        #hud {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Вид из окна -->
    <div id="windshield">
        <div id="tunnel-environment"></div>
        <div class="rail" id="rail-left"></div>
        <div class="rail" id="rail-right"></div>
        
        <!-- Станция -->
        <div id="station">
            <div id="station-name">СТАНЦИЯ: ПОРТАЛОВО</div>
            <div style="margin-left: 300px;" id="passengers-group">
                <!-- Пассажиры создадутся кодом -->
            </div>
        </div>

        <!-- Семафор -->
        <div id="semaphore">
            <div id="light-red" class="light red"></div>
            <div id="light-green" class="light"></div>
        </div>

        <div id="hud">
            <div>Очки: <span id="score-val">0</span></div>
            <div>Пассажиры: <span id="pass-count">0</span></div>
        </div>
    </div>

    <!-- Панель приборов -->
    <div id="dashboard">
        <!-- Бортовой компьютер -->
        <div class="screen">
            <div>БОРТОВОЙ КОМПЬЮТЕР</div>
            <div>-------------------</div>
            <div>Скорость: <span id="speed-display">0</span> км/ч</div>
            <div>До станции: <span id="dist-display">500</span> м</div>
            <div>Двери: <span id="doors-display" style="color: red;">ЗАКРЫТЫ</span></div>
            <div id="status-text" style="color: yellow; margin-top: 5px;">Ждите зеленый сигнал...</div>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn go" id="btn-accel">ТЯГА (+)</button>
            <button class="btn" id="btn-brake">ТОРМОЗ (-)</button>
            <button class="btn door" id="btn-doors">ДВЕРИ О/З</button>
        </div>
    </div>
</div>

<script>
    // Игровые переменные
    let speed = 0;
    let maxSpeed = 80;
    let distanceToStation = 600; 
    let doorsOpen = false;
    let score = 0;
    let passengersBoarded = 0;
    let currentPhase = 'wait_signal'; // wait_signal, drive, braking, station_stop
    
    // Элементы DOM
    const speedDisplay = document.getElementById('speed-display');
    const distDisplay = document.getElementById('dist-display');
    const doorsDisplay = document.getElementById('doors-display');
    const statusText = document.getElementById('status-text');
    const scoreVal = document.getElementById('score-val');
    const passCount = document.getElementById('pass-count');
    const station = document.getElementById('station');
    const lightRed = document.getElementById('light-red');
    const lightGreen = document.getElementById('light-green');
    const tunnelEnv = document.getElementById('tunnel-environment');
    const passGroup = document.getElementById('passengers-group');

    // Генерация пассажиров на платформе
    function generatePassengers() {
        passGroup.innerHTML = '';
        let num = Math.floor(Math.random() * 5) + 3;
        for(let i=0; i<num; i++) {
            let p = document.createElement('div');
            p.className = 'passenger';
            p.style.background = `hsl(${Math.random()*360}, 70%, 60%)`;
            passGroup.appendChild(p);
        }
    }
    generatePassengers();

    // Симуляция окружения (огни в тоннеле)
    let lights = [];
    function createTunnelLight() {
        if (speed > 0 && Math.random() < 0.1) {
            let l = document.createElement('div');
            l.className = 'wall-light';
            l.style.left = '50%';
            l.style.top = '45%';
            l.style.transform = 'scale(0.1)';
            tunnelEnv.appendChild(l);
            lights.push({ element: l, x: 50, y: 45, scale: 0.1 });
        }
    }

    function updateTunnelLights() {
        for (let i = lights.length - 1; i >= 0; i--) {
            let l = lights[i];
            l.scale += speed * 0.005;
            l.y += speed * 0.1;
            l.x -= speed * 0.2; // уходят влево (эффект перспективы)
            
            l.element.style.transform = `scale(${l.scale})`;
            l.element.style.top = l.y + '%';
            l.element.style.left = l.x + '%';

            if (l.y > 100 || l.x < 0) {
                l.element.remove();
                lights.splice(i, 1);
            }
        }
    }

    // Разрешение на отправление (через 3 секунды после старта)
    setTimeout(() => {
        if (currentPhase === 'wait_signal') {
            lightRed.classList.remove('red');
            lightGreen.classList.add('green');
            currentPhase = 'drive';
            statusText.innerText = 'Путь свободен. Разгоняйтесь!';
            statusText.style.color = '#33ff33';
        }
    }, 3000);

    // Обработчики кнопок управления
    document.getElementById('btn-accel').addEventListener('mousedown', () => {
        if (doorsOpen) {
            statusText.innerText = 'Ошибка: Двери открыты!';
            return;
        }
        if (currentPhase === 'wait_signal') return;
        speed = Math.min(maxSpeed, speed + 5);
    });

    document.getElementById('btn-brake').addEventListener('mousedown', () => {
        speed = Math.max(0, speed - 8);
    });

    // Управление кнопками с клавиатуры (Стрелка вверх - разгон, Стрелка вниз - тормоз, Пробел - двери)
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') document.getElementById('btn-accel').click();
        if (e.key === 'ArrowDown') document.getElementById('btn-brake').click();
        if (e.key === ' ') document.getElementById('btn-doors').click();
    });

    document.getElementById('btn-doors').addEventListener('click', () => {
        if (speed > 0) {
            statusText.innerText = 'Нельзя открывать двери на ходу!';
            statusText.style.color = 'red';
            return;
        }

        doorsOpen = !doorsOpen;
        if (doorsOpen) {
            doorsDisplay.innerText = 'ОТКРЫТЫ';
            doorsDisplay.style.color = '#33ff33';
            statusText.innerText = 'Посадка пассажиров...';
            statusText.style.color = 'yellow';

            // Если остановились правильно на станции
            if (distanceToStation <= 15 && distanceToStation >= -15) {
                setTimeout(() => {
                    if (doorsOpen) {
                        passengersBoarded += 5;
                        score += 100;
                        passCount.innerText = passengersBoarded;
                        scoreVal.innerText = score;
                        statusText.innerText = 'Посадка завершена. Закройте двери.';
                        statusText.style.color = '#33ff33';
                    }
                }, 2000);
            } else {
                statusText.innerText = 'Вы открыли двери вне станции! Штраф.';
                score = Math.max(0, score - 50);
                scoreVal.innerText = score;
            }
        } else {
            doorsDisplay.innerText = 'ЗАКРЫТЫ';
            doorsDisplay.style.color = 'red';
            statusText.innerText = 'Двери закрыты. Можно ехать.';
            
            // Если пассажиры сели, готовим следующую станцию
            if (distanceToStation <= 15 && distanceToStation >= -15 && passengersBoarded > 0) {
                resetToNextStation();
            }
        }
    });

    function resetToNextStation() {
        currentPhase = 'wait_signal';
        distanceToStation = 700 + Math.floor(Math.random() * 300);
        station.style.left = '150%';
        lightGreen.classList.remove('green');
        lightRed.classList.add('red');
        statusText.innerText = 'Следуем к следующей станции. Ждите сигнал...';
        statusText.style.color = 'yellow';
        generatePassengers();
        
        setTimeout(() => {
            lightRed.classList.remove('red');
            lightGreen.classList.add('green');
            currentPhase = 'drive';
            statusText.innerText = 'Перегон свободен. Разгон!';
            statusText.style.color = '#33ff33';
        }, 4000);
    }

    // Главный игровой цикл
    function gameLoop() {
        // Движение поезда
        if (speed > 0) {
            // Расстояние уменьшается пропорционально скорости
            distanceToStation -= (speed / 36); 
            createTunnelLight();
        }
        updateTunnelLights();

        // Естественное замедление (трение)
        if (speed > 0) speed = Math.max(0, speed - 0.1);

        // Приближение станции визуально
        if (distanceToStation < 200) {
            // Рассчитываем позицию станции на экране (0 - прямо перед кабиной)
            let stationPos = (distanceToStation * 2);
            station.style.left = `${stationPos}%`;
        }

        // Обновление экранов
        speedDisplay.innerText = Math.round(speed);
        distDisplay.innerText = Math.max(0, Math.round(distanceToStation));

        // Логика прибытия
        if (distanceToStation <= 0 && currentPhase !== 'station_stop') {
            if (speed > 15) {
                statusText.innerText = 'Вы пролетели станцию или разбились! Штраф.';
                statusText.style.color = 'red';
                score = Math.max(0, score - 100);
                scoreVal.innerText = score;
                distanceToStation = -50; // Уехал за станцию
                speed = 0;
            } else if (speed === 0) {
                currentPhase = 'station_stop';
                statusText.innerText = 'Точная остановка! Откройте двери.';
                statusText.style.color = '#33ff33';
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // Запуск игры
    gameLoop();
</script>

</body>
</html>
