<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Симулятор вождения — Трафик и Безопасность</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #00E676;
            letter-spacing: 1px;
            text-align: center;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
        }
        #instructions h2 {
            margin-top: 0;
            color: #00E676;
        }
        .status {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div><span id="speed">0</span> км/ч</div>
        <div class="status" id="status-text">Система трафика: СТАБИЛЬНО</div>
    </div>
    
    <div id="instructions">
        <h2>Управление:</h2>
        * <b>W / ↑</b> — Газ<br>
        * <b>S / ↓</b> — Тормоз / Назад<br>
        * <b>A, D / ←, →</b> — Руль<br>
        <br>
        <i>Попутный и встречный трафик запущен. Свободная езда!</i>
    </div>

    <script>
        // --- Сцена ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.6);
        sunLight.position.set(100, 200, 50);
        scene.add(sunLight);

        // --- Состояние игрока ---
        const car = {
            x: 2, // Начинаем на правой (своей) полосе
            z: 0,
            speed: 0,
            maxSpeed: 90, 
            maxReverseSpeed: -25, 
            acceleration: 0.6,
            deceleration: 0.3,
            friction: 0.06,
            angle: 0,
            steeringSpeed: 0.025
        };

        const keys = { w: false, a: false, s: false, d: false };

        // --- Трасса ---
        const roadWidth = 16; 
        const worldWidth = 400;
        const worldLength = 2500;

        // Трава с холмами
        const groundGeo = new THREE.PlaneGeometry(worldWidth, worldLength, 40, 100);
        const pos = groundGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let z = pos.getY(i);
            if (Math.abs(x) > 14) {
                pos.setZ(i, Math.sin(x * 0.04) * Math.cos(z * 0.02) * 7);
            }
        }
        groundGeo.computeVertexNormals();
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2E6F40, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Асфальт
        const roadGeo = new THREE.PlaneGeometry(roadWidth, worldLength);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x242424, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        scene.add(road);

        // Красно-белые обочины
        const curbGeo = new THREE.PlaneGeometry(0.6, worldLength);
        const curbMat = new THREE.MeshStandardMaterial({ color: 0xBA1212 }); 
        const curbL = new THREE.Mesh(curbGeo, curbMat);
        curbL.rotation.x = -Math.PI / 2;
        curbL.position.set(-roadWidth/2, 0.015, 0);
        scene.add(curbL);
        const curbR = curbL.clone();
        curbR.position.x = roadWidth/2;
        scene.add(curbR);

        // Разметка
        const markerGeo = new THREE.PlaneGeometry(0.2, 6);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
        const markersGroup = new THREE.Group();
        for(let i = 0; i < 150; i++) {
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.rotation.x = -Math.PI / 2;
            marker.position.set(0, 0.02, -(i * 20));
            markersGroup.add(marker);
        }
        scene.add(markersGroup);

        // Окружение (Деревья)
        for (let i = 0; i < 200; i++) {
            let side = Math.random() > 0.5 ? 1 : -1;
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 2), new THREE.MeshStandardMaterial({ color: 0x5C4033 }));
            trunk.position.y = 1; tree.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.4), new THREE.MeshStandardMaterial({ color: 0x1E5631 }));
            leaves.position.y = 2.6; tree.add(leaves);
            tree.position.set((13 + Math.random() * 50) * side, 0, -(Math.random() * (worldLength - 100)));
            scene.add(tree);
        }

        // --- Интерьер игрока (1-е лицо) ---
        const dashboardGroup = new THREE.Group();
        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.45, 1.8), new THREE.MeshStandardMaterial({ color: 0xCC0000, roughness: 0.2, metalness: 0.6 }));
        hood.position.set(0, -0.55, -1.1); dashboardGroup.add(hood);
        const dash = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.4, 0.5), new THREE.MeshStandardMaterial({ color: 0x151515 }));
        dash.position.set(0, -0.5, -0.25); dashboardGroup.add(dash);
        const steeringWheel = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.025, 8, 24), new THREE.MeshStandardMaterial({ color: 0x252525 }));
        steeringWheel.position.set(-0.38, -0.35, -0.35); steeringWheel.rotation.x = 0.3; dashboardGroup.add(steeringWheel);
        scene.add(dashboardGroup);

        camera.position.set(-0.38, 1.15, 0);

        // --- Система Трафика (Другие машины) ---
        const trafficCount = 12;
        const trafficCars = [];
        
        // Шаблон геометрии кузова автомобиля трафика
        const npcBodyGeo = new THREE.BoxGeometry(1.7, 1.2, 3.5);
        const npcMatPassing = new THREE.MeshStandardMaterial({ color: 0x1A73E8, roughness: 0.3 }); // Попутные — синие
        const npcMatOncoming = new THREE.MeshStandardMaterial({ color: 0xE65100, roughness: 0.3 }); // Встречные — оранжевые

        for (let i = 0; i < trafficCount; i++) {
            // Чередуем: половина попутные (справа), половина встречные (слева)
            const isOncoming = i % 2 === 0;
            const mat = isOncoming ? npcMatOncoming : npcMatPassing;
            
            const npcCar = new THREE.Mesh(npcBodyGeo, mat);
            
            // Стекла
            const windows = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            windows.position.set(0, 0.6, -0.2);
            npcCar.add(windows);

            // Фары
            const headlightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
            const headlightMat = new THREE.MeshBasicMaterial({ color: 0xFFFDE7 });
            const fl = new THREE.Mesh(headlightGeo, headlightMat); fl.position.set(0.6, -0.2, -1.76); npcCar.add(fl);
            const fr = fl.clone(); fr.position.x = -0.6; npcCar.add(fr);

            npcCar.position.y = 0.6; // Ставим на колеса/дорогу
            
            // Настройка физики для каждого NPC
            trafficCars.push({
                mesh: npcCar,
                isOncoming: isOncoming,
                laneX: isOncoming ? -3.5 : 3.5, // левая или правая полоса
                zOffset: -(300 + i * 150), // распределяем по длине дороги вперед
                speed: isOncoming ? -45 : 30 // скорость встречных (в обратную сторону) и попутных
            });

            scene.add(npcCar);
        }

        // --- Управление ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        });

        const speedDisplay = document.getElementById('speed');
        const statusText = document.getElementById('status-text');

        // --- Главный цикл обновлений ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Физика скорости игрока
            if (keys.w) {
                if (car.speed < car.maxSpeed) car.speed += car.acceleration;
            } else if (keys.s) {
                if (car.speed > car.maxReverseSpeed) car.speed -= car.acceleration * 1.5;
            } else {
                if (car.speed > 0) car.speed -= car.friction;
                if (car.speed < 0) car.speed += car.friction;
                if (Math.abs(car.speed) < 0.1) car.speed = 0;
            }

            // 2. Логика поворотов игрока
            let targetWheelRotation = 0;
            if (Math.abs(car.speed) > 0.5) {
                const speedModifier = car.speed > 0 ? 1 : -1;
                if (keys.a) {
                    car.angle += car.steeringSpeed * speedModifier;
                    targetWheelRotation = 0.8;
                } else if (keys.d) {
                    car.angle -= car.steeringSpeed * speedModifier;
                    targetWheelRotation = -0.8;
                } else {
                    car.angle *= 0.92; // выравнивание курса
                }
            }
            steeringWheel.rotation.z += (targetWheelRotation - steeringWheel.rotation.z) * 0.15;

            // Движение игрока
            car.x += Math.sin(car.angle) * (car.speed * 0.01);
            car.z -= Math.cos(car.angle) * (car.speed * 0.01);

            // Ограничение движения (Удержание на асфальте)
            const maxTrackOffset = (roadWidth / 2) - 1.2; 
            if (car.x > maxTrackOffset) { car.x = maxTrackOffset; if(car.angle < 0) car.angle = 0; }
            if (car.x < -maxTrackOffset) { car.x = -maxTrackOffset; if(car.angle > 0) car.angle = 0; }

            // Бесконечный цикл дороги по Z
            if (car.z < -worldLength + 200) {
                car.z = 0;
                // При сбросе мира переносим машины трафика тоже поближе
                trafficCars.forEach(c => c.zOffset = car.z - (300 + Math.random() * 800));
            }

            // 3. Обновление и симуляция Трафика
            trafficCars.forEach(npc => {
                // Движение NPC машин независимо от игрока
                npc.zOffset -= npc.speed * 0.01;

                // Если машина уехала слишком далеко назад или сильно улетела вперед, телепортируем её обратно вперед за горизонт
                const distToPlayer = npc.zOffset - car.z;
                if (distToPlayer > 100 || distToPlayer < -600) {
                    npc.zOffset = car.z - (400 + Math.random() * 400); // Респавн впереди
                    // Слегка смещаем по оси X внутри полосы для разнообразия
                    npc.mesh.position.x = npc.laneX + (Math.random() - 0.5) * 1.5;
                } else {
                    npc.mesh.position.z = npc.zOffset;
                }

                // 4. Проверка легких столкновений (Коллизии)
                let xDist = Math.abs(car.x - npc.mesh.position.x);
                let zDist = Math.abs(car.z - npc.mesh.position.z);

                // Если габариты пересекаются (ширина авто ~1.8, длина ~3.5)
                if (xDist < 1.6 && zDist < 3.2) {
                    statusText.innerText = "ОБЪЕЗД / КОНТАКТ!";
                    statusText.style.color = "#FF9100";
                    
                    // Эффект расталкивания: плавно смещаем машину трафика в сторону
                    if (car.x > npc.mesh.position.x) {
                        npc.mesh.position.x -= 0.1;
                    } else {
                        npc.mesh.position.x += 0.1;
                    }
                    
                    // Небольшая потеря скорости игрока от трения машин
                    car.speed *= 0.98;
                }
            });

            // Сброс надписи HUD, если столкновения нет
            if (scene.frameId % 30 === 0 && statusText.innerText === "ОБЪЕЗД / КОНТАКТ!") {
                statusText.innerText = "Система трафика: СТАБИЛЬНО";
                statusText.style.color = "#aaa";
            }

            // 5. Позиционирование камеры и кабины игрока
            camera.position.x = car.x - 0.38 * Math.cos(car.angle);
            camera.position.z = car.z + 0.38 * Math.sin(car.angle);
            camera.rotation.y = car.angle;

            dashboardGroup.position.set(car.x, 1.15, car.z);
            dashboardGroup.rotation.y = car.angle;

            speedDisplay.innerText = Math.round(Math.abs(car.speed));
            renderer.render(scene, camera);
            scene.frameId = (scene.frameId || 0) + 1;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
