<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Штурмовик: Мега Взрывы Орешника</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #ff3333; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #010206 0%, #030611 60%, #070b19 100%); }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(5, 9, 20, 0.9);
            border: 2px solid #ff1111;
            border-radius: 6px;
            padding: 12px 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            font-size: 15px;
            text-shadow: 0 0 5px #ff3333;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .alert-ui { color: #ff1111; animation: blink 0.2s infinite alternate; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.95);
            border: 2px solid #ff0000;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: auto;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 5px #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        }

        #nuclear-flash {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #ffffff; pointer-events: none; opacity: 0;
        }

        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>
    <div id="nuclear-flash"></div>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">550</span> КМ/Ч</div>
                <div>ЭФФЕКТ: <span class="hud-val" style="color:#ff3300; text-shadow: 0 0 10px #ff0000;">ОРЕШНИК 500% (ЯДЕРНЫЙ ГРИБ)</span></div>
                <div style="color: #ff9900;">РАДИУС: <span class="hud-val" style="color:#ff9900;">СПЛОШНОЙ КВАРТАЛ</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right;">
                <div>СПО «БЕРЕЗА»: <span class="alert-ui" id="pvo-warn">ПОИСК ЦЕЛЕЙ</span></div>
                <div>УНИЧТОЖЕНО ТЕХНИКИ: <span id="score-out" class="hud-val" style="color: #ffcc00;">0</span></div>
                <div style="color: #00ffff;">РАЗРУШЕНО ЗДАНИЙ: <span id="b-score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="controls-bar">
            🔥 <b>ИСПРАВЛЕНО:</b> Зажми ПРОБЕЛ. Каждая бомба создаёт гигантский полыхающий гриб взрыва и сносит один квартал!
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('nuclear-flash');

    const jetImage = new Image();
    jetImage.src = 'mig.png';

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let jet = {
        x: 0, y: 0,
        roll: 0, pitch: 0,
        targetX: 0, targetY: 0,
        speed: 550
    };

    let bombs = [];
    let explosions = [];
    let buildings = [];
    let enemies = [];     
    let enemyProjectiles = []; 
    let scoreVehicles = 0;
    let scoreBuildings = 0;
    let isSpacePressed = false; 
    let bombTimer = 0;          
    let muzzleFlash = 0; 

    function initWorld() {
        buildings = [];
        enemies = [];
        
        // Создаем аккуратную сетку города
        for (let x = -10; x <= 10; x += 2) {
            for (let z = 4; z <= 26; z += 3) {
                let worldX = x * 1500 + (Math.random() * 100 - 50);
                let worldZ = z * 1200;
                let bHeight = 700 + Math.random() * 1200;
                
                buildings.push({
                    x: worldX,
                    y: -2500, // Уровень земли
                    h: bHeight,
                    w: 480,
                    alive: true
                });

                if (Math.random() < 0.5) {
                    enemies.push({
                        x: worldX + (Math.random() * 200 - 100),
                        y: -2500,
                        z: worldZ + 100,
                        type: Math.random() > 0.4 ? 'tank' : 'pvo',
                        w: 110, h: 60,
                        alive: true,
                        shootCooldown: Math.floor(Math.random() * 50),
                        moveDir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }
        }
    }
    initWorld();

    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'oreshnik') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(35, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1, audioCtx.currentTime + 2.2);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);
            osc.start(); osc.stop(audioCtx.currentTime + 2.2);
        }
    }

    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        jet.roll = nX * 0.9;
        jet.pitch = nY * 0.3;
        jet.targetX = nX * 3400;
        jet.targetY = -nY * 900;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.code === 'Space') isSpacePressed = false;
    });

    function triggerOreshnikFlash() {
        flashEl.style.opacity = '0.8';
        let fade = setInterval(() => {
            flashEl.style.opacity = parseFloat(flashEl.style.opacity) - 0.05;
            if (flashEl.style.opacity <= 0) { flashEl.style.opacity = '0'; clearInterval(fade); }
        }, 40);
    }

    function spawnOreshnik() {
        bombs.push({
            x: jet.x + (Math.random() * 100 - 50), 
            y: jet.y - 120, 
            z: 500,               
            vx: jet.roll * 12, 
            vy: -18, 
            vz: jet.speed * 0.22  
        });
        muzzleFlash = 4; 
        playSound('whistle');
    }

    function project3D(worldX, worldY, worldZ) {
        let relX = worldX - jet.x;
        let relY = worldY - jet.y;

        let x1 = relX * Math.cos(jet.roll) - relY * Math.sin(jet.roll);
        let y1 = relX * Math.sin(jet.roll) + relY * Math.cos(jet.roll);
        let y2 = y1 * Math.cos(jet.pitch) - worldZ * Math.sin(jet.pitch);
        let z2 = y1 * Math.sin(jet.pitch) + worldZ * Math.cos(jet.pitch);

        const fov = 1000;
        let scale = fov / (z2 + 1800);
        return {
            x: (window.innerWidth / 2) + (x1 * scale),
            y: (window.innerHeight * 0.45) - (y2 * scale),
            scale: scale,
            visible: (z2 + 1800 > 0) && (z2 < 28000)
        };
    }

    // ИСПРАВЛЕНО: Чёткий локальный взрыв квартала + огромный видимый ядерный купол
    function detonateMegaOreshnik(targetX, targetZ, screenX, screenY) {
        triggerOreshnikFlash();
        playSound('oreshnik');

        // Ограниченный честный радиус квартала в координатах (чтобы не сносить карту целиком)
        const blastRadiusX = 3500; 
        const blastRadiusZ = 3000;

        buildings.forEach(b => {
            if (b.alive && Math.abs(b.x - targetX) < blastRadiusX && Math.abs(b.z - targetZ) < blastRadiusZ) {
                b.alive = false;
                scoreBuildings++;
            }
        });

        enemies.forEach(e => {
            if (e.alive && Math.abs(e.x - targetX) < blastRadiusX && Math.abs(e.z - targetZ) < blastRadiusZ) {
                e.alive = false;
                scoreVehicles++;
            }
        });

        document.getElementById('b-score-out').innerText = scoreBuildings;
        document.getElementById('score-out').innerText = scoreVehicles;

        // Спавним ОГРОМНЫЙ расширяющийся купол (визуальный эффект на 500%)
        explosions.push({
            x: screenX,
            y: screenY,
            r: 20,
            maxR: 450 + Math.random() * 200, // Огромный размер на экране
            speed: 10,
            alpha: 1.0
        });

        // Добавляем боковые каскадные всполохи по краям
        for(let i=0; i<8; i++) {
            explosions.push({
                x: screenX + (Math.random() * 300 - 150),
                y: screenY + (Math.random() * 100 - 50),
                r: 10,
                maxR: 150 + Math.random() * 150,
                speed: 6,
                alpha: 0.9
            });
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        jet.x += (jet.targetX - jet.x) * 0.08;
        jet.y += (jet.targetY - jet.y) * 0.08;

        let speedMult = jet.speed * 0.2;

        if (isSpacePressed) {
            bombTimer++;
            if (bombTimer % 30 === 0) spawnOreshnik();
        }

        let horizonY = (canvas.height * 0.45) - (jet.pitch * 350) + (jet.y * 0.2);
        ctx.fillStyle = '#010206'; ctx.fillRect(0, 0, canvas.width, horizonY);
        ctx.fillStyle = '#020511'; ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        // 1. Отрисовка зданий и руин
        buildings.forEach(b => {
            b.z -= speedMult; 
            if (b.z <= -600) { b.z = 25000; b.alive = true; }

            let bottomProj = project3D(b.x, b.y, b.z);
            let topProj = project3D(b.x, b.y + b.h, b.z);

            if (topProj.visible && topProj.y > horizonY) {
                let w3d = b.w * topProj.scale;
                let h3d = bottomProj.y - topProj.y;

                if (b.alive) {
                    ctx.fillStyle = 'rgba(18, 28, 54, 0.95)';
                    ctx.strokeStyle = '#ff2222';
                    ctx.lineWidth = 1.5;
                    ctx.fillRect(topProj.x - w3d/2, topProj.y, w3d, h3d);
                    ctx.strokeRect(topProj.x - w3d/2, topProj.y, w3d, h3d);

                    ctx.fillStyle = '#ff9900';
                    let stepX = Math.max(10, w3d / 5);
                    let stepY = Math.max(12, h3d / 7);
                    for (let oy = topProj.y + 12; oy < bottomProj.y - 12; oy += stepY) {
                        for (let ox = topProj.x - w3d/2 + 6; ox < topProj.x + w3d/2 - 6; ox += stepX) {
                            ctx.fillRect(ox, oy, 2, 3);
                        }
                    }
                } else {
                    // ИСПРАВЛЕНО: Чёткие обугленные темные скелеты разрушенных домов вместо пустоты!
                    ctx.fillStyle = '#08080f';
                    ctx.strokeStyle = 'rgba(255, 60, 0, 0.2)';
                    ctx.lineWidth = 1;
                    ctx.fillRect(bottomProj.x - w3d/2, bottomProj.y - h3d * 0.2, w3d, h3d * 0.2);
                    ctx.strokeRect(bottomProj.x - w3d/2, bottomProj.y - h3d * 0.2, w3d, h3d * 0.2);
                    
                    // Кратер под ними
                    ctx.fillStyle = 'rgba(255, 30, 0, 0.08)';
                    ctx.beginPath();
                    ctx.ellipse(bottomProj.x, bottomProj.y, w3d * 1.5, w3d * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        });

        // 2. Враги
        let alertStatus = "ЧИСТО";
        enemies.forEach(e => {
            e.z -= speedMult;
            if (e.z <= -600) { e.z = 25000; e.alive = true; }

            if (e.alive) {
                if (e.type === 'tank') e.x += e.moveDir * 5;

                let proj = project3D(e.x, e.y, e.z);
                if (proj.visible && proj.y > horizonY) {
                    let sz = e.w * proj.scale;

                    ctx.fillStyle = e.type === 'tank' ? '#2e4a23' : '#4a2323';
                    ctx.strokeStyle = e.type === 'tank' ? '#00ff66' : '#ff3333';
                    ctx.fillRect(proj.x - sz/2, proj.y - sz*0.3, sz, sz*0.4);
                }
            }
        });

        let warnEl = document.getElementById('pvo-warn');
        warnEl.innerText = alertStatus;

        // 3. Снаряды врагов (очистка)
        enemyProjectiles = [];

        // 4. Полет бомбы Орешника
        for (let i = bombs.length - 1; i >= 0; i--) {
            let bomb = bombs[i];
            bomb.x += bomb.vx; bomb.y += bomb.vy; bomb.z += bomb.vz;
            bomb.vy -= 1.4; 

            let bProj = project3D(bomb.x, bomb.y, bomb.z);

            if (!bProj.visible || bProj.y > canvas.height || bomb.z > 26000) {
                bombs.splice(i, 1);
                continue;
            }

            // Отрисовка боеголовки
            let bWidth = Math.max(12, bProj.scale * 30);
            let bHeight = Math.max(24, bProj.scale * 60);

            ctx.save();
            ctx.translate(bProj.x, bProj.y);
            let fallAngle = Math.atan2(-bomb.vy, bomb.vz * 0.3) - Math.PI/2;
            ctx.rotate(fallAngle + jet.roll * 0.5);
            ctx.fillStyle = '#1a252f';
            ctx.beginPath(); ctx.ellipse(0, 0, bWidth / 2, bHeight / 2, 0, 0, Math.PI * 2); ctx.fill();
            
            // Раскалённый плазменный хвост
            ctx.fillStyle = 'rgba(255, 60, 0, 0.8)';
            ctx.fillRect(-bWidth/3, -bHeight, bWidth*0.66, bHeight/2);
            ctx.restore();

            // Проверка триггера столкновения
            let hitTriggered = false;
            buildings.forEach(b => {
                if (b.alive && Math.abs(bomb.x - b.x) < b.w * 1.1 && Math.abs(bomb.z - b.z) < 500) {
                    if (bomb.y <= b.y + b.h) hitTriggered = true;
                }
            });

            if (hitTriggered || bomb.y <= -2500) {
                detonateMegaOreshnik(bomb.x, bomb.z, bProj.x, bProj.y);
                bombs.splice(i, 1);
            }
        }

        // 5. ИСПРАВЛЕНО: Отрисовка ГИГАНТСКИХ ЯДЕРНЫХ КУПОЛОВ ВЗРЫВА (500%)
        for (let i = explosions.length - 1; i >= 0; i--) {
            let exp = explosions[i];
            exp.r += exp.speed; // Плавное расширение во все стороны
            exp.y -= exp.speed * 0.25; // Купол уплывает вверх, формируя гриб
            exp.alpha -= 0.012; // Плавное таяние вспышки

            if (exp.alpha <= 0 || exp.r >= exp.maxR) {
                explosions.splice(i, 1);
                continue;
            }

            // Создаем красивый объемный радиальный градиент огня
            let grad = ctx.createRadialGradient(exp.x, exp.y, exp.r * 0.05, exp.x, exp.y, exp.r);
            grad.addColorStop(0, 'rgba(255, 255, 255, ' + exp.alpha + ')'); // Ядро белое
            grad.addColorStop(0.2, 'rgba(255, 180, 0, ' + exp.alpha + ')'); // Желтая плазма
            grad.addColorStop(0.6, 'rgba(230, 30, 0, ' + (exp.alpha * 0.8) + ')'); // Красное пламя
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Прозрачный край

            ctx.fillStyle = grad;
            ctx.beginPath(); 
            ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2); 
            ctx.fill();
        }

        // 6. Отрисовка самолета mig.png
        let screenJetX = (canvas.width / 2) + (jet.x * 0.18);
        let screenJetY = (canvas.height * 0.55) - (jet.y * 0.25);
        
        ctx.save();
        ctx.translate(screenJetX, screenJetY);
        ctx.rotate(jet.roll);
        
        if (muzzleFlash > 0) {
            muzzleFlash--;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-25, 5, 12, 0, Math.PI*2); ctx.arc(25, 5, 12, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = 'rgba(255, 90, 0, 0.85)';
        ctx.fillRect(-12, 38, 5, 14); ctx.fillRect(7, 38, 5, 14);

        const imgSize = 160;
        ctx.drawImage(jetImage, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
        ctx.restore();

        document.getElementById('speed-out').innerText = Math.floor(jet.speed);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
