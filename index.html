<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Истребитель: Вид от 3-го лица</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #00ff66; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100%; height: 100%;
            display: block;
            background: linear-gradient(to bottom, #071330 0%, #0c2852 40%, #1a4575 70%, #0d203d 100%);
        }

        /* Интерфейс пилота */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
        }

        .glass-panel {
            background: rgba(4, 18, 36, 0.75);
            border: 2px solid #00ff66;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            font-size: 16px;
            text-shadow: 0 0 5px #00ff66;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.8);
            border: 1px solid #00ff66;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: auto;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">550</span> КМ/Ч</div>
                <div>ВЫСОТА: <span class="hud-val" id="alt-out">1800</span> М</div>
                <div>ТЯГА ДВИГАТЕЛЯ: <span class="hud-val" id="throttle-out">70%</span></div>
            </div>
            <div class="glass-panel" style="text-align: right;">
                <div>РЕЖИМ КАМЕРЫ: <span class="hud-val" style="color:#00ffff;">3RD PERSON</span></div>
                <div>УГОЛ АТАКИ: <span class="hud-val" id="pitch-out">0°</span></div>
                <div>ФОРСАЖ: <span class="hud-val" id="burn-out" style="color:#ff5500;">ВЫКЛ</span></div>
            </div>
        </div>

        <div id="controls-bar">
            🛩️ <b>Управление:</b> Двигай мышь для маневров (крен/тангаж) | <b>W / S</b> — Изменение тяги | <b>Зажми Пробел</b> — Форсаж
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Состояние полета
    let jet = {
        x: 0, y: 50,          // Положение на экране
        pitch: 0, roll: 0,     // Углы самолета
        targetRoll: 0, targetPitch: 0,
        speed: 550, altitude: 1800,
        throttle: 70, afterburner: false
    };

    // 3D точки рельефа земли (холмы)
    let terrainGrid = [];
    for (let x = -20; x <= 20; x += 2) {
        for (let z = 2; z <= 40; z += 2) {
            terrainGrid.push({
                x: x * 800,
                y: -1200 + (Math.sin(x) * Math.cos(z) * 300), // Неровности
                z: z * 800
            });
        }
    }

    // Звуковой движок
    let audioCtx = null, noiseNode = null, noiseGain = null;
    function startAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bufferSize = audioCtx.sampleRate * 2, buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
        noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = buffer; noiseNode.loop = true;
        let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(160, audioCtx.currentTime);
        noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        noiseNode.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
        noiseNode.start();
    }

    // Мышь управляет направлением полета
    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        
        jet.targetRoll = nX * 1.2;     // Наклон до 70 градусов
        jet.targetPitch = nY * 0.6;   // Тангаж вверх/вниз
    });

    window.addEventListener('keydown', (e) => {
        startAudio();
        if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') jet.throttle = Math.min(100, jet.throttle + 5);
        if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') jet.throttle = Math.max(20, jet.throttle - 5);
        if (e.key === ' ') jet.afterburner = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === ' ') jet.afterburner = false;
    });

    // 3D Проекция для земли
    function project3D(x, y, z, pitch, roll) {
        // Симуляция движения камеры за самолетом с учетом наклонов
        let x1 = x * Math.cos(roll) - y * Math.sin(roll);
        let y1 = x * Math.sin(roll) + y * Math.cos(roll);
        let y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch);
        let z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);

        const fov = 700;
        return {
            x: (window.innerWidth / 2) + (x1 * fov / (z2 + 2000)),
            y: (window.innerHeight * 0.6) + (y2 * fov / (z2 + 2000)),
            visible: z2 + 2000 > 0
        };
    }

    // Отрисовка 3D модели истребителя СУ-57 (набор вершин)
    function drawFighterJet(cx, cy, roll, pitch, afterburner) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(roll);
        ctx.scale(1 - pitch * 0.2, 1 - pitch * 0.2); // Эффект отдаления/приближения носа

        // Цвета обшивки (Военный камуфляж)
        let mainColor = '#2c3e50';
        let wingColor = '#34495e';
        let strokeColor = '#00ff66';

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2;

        // 1. Огненный выхлоп форсажа (если активен)
        if (afterburner) {
            let grad = ctx.createLinearGradient(0, 15, 0, 70);
            grad.addColorStop(0, '#fff');
            grad.addColorStop(0.3, '#ff6600');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-15, 15); ctx.lineTo(0, 85); ctx.lineTo(15, 15);
            ctx.closePath(); ctx.fill();
        } else {
            // Обычный реактивный след
            ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.fillRect(-10, 15, 6, 15); ctx.fillRect(4, 15, 6, 15);
        }

        // 2. Крылья (Левое и правое)
        ctx.fillStyle = wingColor;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(-95, 10);  // Левое крыло наружу
        ctx.lineTo(-75, 25);  // Закрылок
        ctx.lineTo(0, 10);
        ctx.lineTo(75, 25);   // Правое крыло наружу
        ctx.lineTo(95, 10);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // 3. Фюзеляж (Тело самолета)
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.moveTo(0, -55);       // Носовой обтекатель
        ctx.lineTo(-15, -15);
        ctx.lineTo(-15, 25);      // Левый борт
        ctx.lineTo(15, 25);       // Правый борт
        ctx.lineTo(15, -15);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // 4. Хвостовое оперение (стабилизаторы)
        ctx.fillStyle = wingColor;
        ctx.beginPath();
        ctx.moveTo(-10, 25);
        ctx.lineTo(-40, 45);
        ctx.lineTo(-30, 50);
        ctx.lineTo(0, 30);
        ctx.lineTo(30, 50);
        ctx.lineTo(40, 45);
        ctx.lineTo(10, 25);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // 5. Остекление кабины пилота (вид сверху-сзади)
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.ellipse(0, -15, 6, 18, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.restore();
    }

    // Игровой цикл
    function gameLoop() {
        // Плавное следование за штурвалом (инерция самолета)
        jet.roll += (jet.targetRoll - jet.roll) * 0.1;
        jet.pitch += (jet.targetPitch - jet.pitch) * 0.1;

        // Физика скорости
        let baseSpeed = jet.throttle * 9;
        if (jet.afterburner) {
            jet.speed += (1500 - jet.speed) * 0.08;
            jet.altitude += Math.sin(-jet.pitch) * 22;
            if (noiseGain) noiseGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        } else {
            jet.speed += (baseSpeed - jet.speed) * 0.05;
            jet.altitude += Math.sin(-jet.pitch) * (jet.speed * 0.02);
            if (noiseGain) noiseGain.gain.setValueAtTime(0.05 + (jet.throttle * 0.002), audioCtx.currentTime);
        }

        if (jet.altitude < 0) jet.altitude = 0;

        // Скорость движения земли под нами
        let moveStep = jet.speed * 0.12;

        // ОЧИСТКА И ОТРИСОВКА НЕБА/ЗЕМЛИ
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Линия горизонта в зависимости от тангажа и крена
        let horizonY = (canvas.height * 0.55) + (jet.pitch * 300);

        // Земля (фон)
        ctx.fillStyle = '#0a1d08';
        ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        // Отрисовка 3D сетки ландшафта под самолетом
        ctx.strokeStyle = 'rgba(0, 255, 102, 0.12)';
        ctx.lineWidth = 1;
        terrainGrid.forEach(p => {
            p.z -= moveStep; // Земля летит назад
            if (p.z <= 0) p.z = 32000; // Возврат точек вдаль

            let proj = project3D(p.x, p.y - jet.altitude, p.z, jet.pitch, jet.roll);
            if (proj.visible) {
                ctx.fillStyle = 'rgba(0, 255, 102, 0.25)';
                ctx.fillRect(proj.x, proj.y, 2, 2);
            }
        });

        // Эффект облаков на скорости (белые стремительные линии)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            let lineY = (horizonY - 200) + (i * 40);
            ctx.beginPath();
            ctx.moveTo(0, lineY);
            ctx.lineTo(canvas.width, lineY);
            ctx.stroke();
        }

        // ОТРИСОВКА САМОЛЕТА (Центр экрана с легким смещением от маневров)
        let planeX = (canvas.width / 2) + (jet.roll * 60);
        let planeY = (canvas.height * 0.65) + (jet.pitch * 50);

        drawFighterJet(planeX, planeY, jet.roll, jet.pitch, jet.afterburner);

        // ОБНОВЛЕНИЕ ТЕКСТОВ HUD
        document.getElementById('speed-out').innerText = Math.floor(jet.speed);
        document.getElementById('alt-out').innerText = Math.floor(jet.altitude);
        document.getElementById('throttle-out').innerText = jet.throttle + "%";
        document.getElementById('pitch-out').innerText = Math.floor(-jet.pitch * 50) + "°";
        document.getElementById('burn-out').innerText = jet.afterburner ? "АКТИВЕН" : "ВЫКЛ";
        document.getElementById('burn-out').style.color = jet.afterburner ? "#ff5500" : "#00ff66";

        // Проверка падения
        if (jet.altitude <= 5) {
            ctx.fillStyle = 'rgba(20, 0, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff3333';
            ctx.font = 'bold 30px Consolas';
            ctx.fillText("CRASH: САМОЛЕТ СТОЛКНУЛСЯ С ЗЕМЛЕЙ", canvas.width / 2 - 270, canvas.height / 2);
            return;
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
