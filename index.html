<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Авиасимулятор: Умное Самонаведение</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #010409; color: #00ff66; font-family: 'Consolas', monospace; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #030a1e 0%, #081735 50%, #112d52 100%); }

        /* HUD Панель */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(3, 13, 28, 0.85);
            border: 2px solid #00ff66;
            border-radius: 6px;
            padding: 12px 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            font-size: 15px;
            text-shadow: 0 0 5px #00ff66;
        }

        .flex-space { display: flex; justify-content: space-between; width: 100%; }
        .hud-val { color: #fff; font-weight: bold; }
        .target-lock { color: #ff3333; animation: blink 0.3s infinite alternate; font-weight: bold; }

        #controls-bar {
            align-self: center;
            background: rgba(0,0,0,0.9);
            border: 1px solid #00ff66;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: auto;
            margin-bottom: 10px;
            color: #fff;
        }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="stage"></canvas>

    <div id="ui-layer">
        <div class="flex-space">
            <div class="glass-panel">
                <div>СКОРОСТЬ: <span class="hud-val" id="speed-out">600</span> КМ/Ч</div>
                <div>ВЫСОТА: <span class="hud-val" id="alt-out">2000</span> М</div>
                <div>РАКЕТЫ: <span class="hud-val" style="color:#00ffff;">Р-73 (АКТИВНЫ)</span></div>
            </div>
            
            <div class="glass-panel" style="text-align: right;">
                <div>ОРУЖИЕ: <span class="target-lock" id="target-status">АВТОНАВЕДЕНИЕ ОК</span></div>
                <div>ДИСТАНЦИЯ: <span class="hud-val" id="target-dist">1500</span> М</div>
                <div style="color: #00ffff;">СБИТО ВРАГОВ: <span id="score-out" class="hud-val">0</span></div>
            </div>
        </div>

        <div id="controls-bar">
            🎯 <b>ПРОКАЧАННЫЕ РАКЕТЫ:</b> Держи цель в поле зрения и жми <b>ПРОБЕЛ</b> — ракета скорректирует траекторию!
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // Наш истребитель
    let jet = {
        x: 0, y: 0,
        roll: 0, pitch: 0,
        targetRoll: 0, targetPitch: 0,
        speed: 600, altitude: 2000, throttle: 70
    };

    // Вражеская цель
    let enemy = { x: 0, y: 300, z: 3500, alive: true, size: 40, t: 0 };

    // Массив выпущенных самонаводящихся ракет
    let missiles = [];
    let score = 0;

    // Сетка земли
    let terrainGrid = [];
    for (let x = -20; x <= 20; x += 4) {
        for (let z = 1; z <= 40; z += 4) {
            terrainGrid.push({ x: x * 1500, y: -1500, z: z * 1500 });
        }
    }

    // Аудиоэффекты
    let audioCtx = null;
    function playCombatSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'missile') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'boom') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(130, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.7);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
            osc.start(); osc.stop(audioCtx.currentTime + 0.7);
        }
    }

    // Управление мышью
    window.addEventListener('mousemove', (e) => {
        let nX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        let nY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        jet.targetRoll = nX * 1.3;
        jet.targetPitch = nY * 0.6;
    });

    // Огонь
    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
            // Пуск ракеты прямо по вектору движения
            missiles.push({ 
                x: jet.roll * 50, 
                y: -50, 
                z: 100, 
                speed: 120 // Увеличенная скорость ракеты (гиперзвук)
            });
            playCombatSound('missile');
        }
    });

    // Матрица 3D проекции
    function project3D(x, y, z, pitch, roll) {
        let x1 = x * Math.cos(roll) - y * Math.sin(roll);
        let y1 = x * Math.sin(roll) + y * Math.cos(roll);
        let y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch);
        let z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);

        const fov = 900;
        let scale = fov / (z2 + 1500);
        return {
            x: (window.innerWidth / 2) + (x1 * scale),
            y: (window.innerHeight * 0.5) + (y2 * scale),
            scale: scale,
            visible: z2 + 1500 > 0
        };
    }

    function drawOurJet(x, y, roll) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(roll);
        ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2; ctx.fillStyle = '#0b192e';
        ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(-100, 15); ctx.lineTo(-70, 30); ctx.lineTo(0, 12); ctx.lineTo(70, 30); ctx.lineTo(100, 15); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -45); ctx.lineTo(-12, -5); ctx.lineTo(-12, 30); ctx.lineTo(12, 30); ctx.lineTo(12, -5); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 100, 0, 0.6)'; ctx.fillRect(-7, 30, 3, 10); ctx.fillRect(4, 30, 3, 10);
        ctx.restore();
    }

    function drawEnemyJet(projX, projY, scale) {
        ctx.save(); ctx.translate(projX, projY); ctx.scale(scale * 15, scale * 15);
        ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 1.5; ctx.fillStyle = '#3a0d0d';
        ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-42, 6); ctx.lineTo(-25, 12); ctx.lineTo(0, 4); ctx.lineTo(25, 12); ctx.lineTo(42, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillRect(-6, -2, 12, 9);
        ctx.restore();
    }

    // Главный цикл
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        jet.roll += (jet.targetRoll - jet.roll) * 0.1;
        jet.pitch += (jet.targetPitch - jet.pitch) * 0.1;
        let speedMult = jet.speed * 0.15;

        // Линия горизонта и земля
        let horizonY = (canvas.height * 0.5) + (jet.pitch * 400);
        ctx.fillStyle = '#030c03'; ctx.fillRect(0, horizonY, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(0, 255, 102, 0.07)';
        terrainGrid.forEach(p => {
            p.z -= speedMult; if (p.z <= 0) p.z = 25000;
            let proj = project3D(p.x, p.y - jet.altitude, p.z, jet.pitch, jet.roll);
            if (proj.visible) { ctx.fillStyle = 'rgba(0,255,102,0.12)'; ctx.fillRect(proj.x, proj.y, 2, 2); }
        });

        // ИИ Врага (Динамичные маневры)
        if (enemy.alive) {
            enemy.t += 0.025;
            enemy.x = Math.sin(enemy.t) * 700;
            enemy.y = 300 + Math.cos(enemy.t * 1.3) * 250;
            enemy.z -= (speedMult - 45); // Скорость сближения

            if (enemy.z < -200) { enemy.z = 4000; enemy.alive = true; }

            let eProj = project3D(enemy.x, enemy.y - jet.altitude, enemy.z, jet.pitch, jet.roll);
            
            if (eProj.visible) {
                drawEnemyJet(eProj.x, eProj.y, eProj.scale);

                // HUD рамка
                let boxSize = Math.max(35, eProj.scale * 450);
                ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 2;
                ctx.strokeRect(eProj.x - boxSize/2, eProj.y - boxSize/2, boxSize, boxSize);
                
                // Перекрестие захвата
                ctx.beginPath(); ctx.arc(eProj.x, eProj.y, 6, 0, Math.PI*2); ctx.fillStyle = '#ff3333'; ctx.fill();

                ctx.fillStyle = '#ff3333'; ctx.font = '12px Consolas';
                ctx.fillText(`LOCK ON [SU-27]: ${Math.round(enemy.z)}m`, eProj.x + boxSize/2 + 5, eProj.y);
                
                document.getElementById('target-status').innerText = "ЦЕЛЬ ЗАХВАЧЕНА";
                document.getElementById('target-status').style.color = '#ff3333';
                document.getElementById('target-dist').innerText = Math.round(enemy.z) + " М";
            }
        } else {
            document.getElementById('target-status').innerText = "ПОИСК ЦЕЛИ...";
            document.getElementById('target-status').style.color = '#ffcc00';
            document.getElementById('target-dist').innerText = "---";
            if (Math.random() < 0.015) { enemy.z = 4500; enemy.alive = true; }
        }

        // Логика УМНЫХ ракет
        for (let i = missiles.length - 1; i >= 0; i--) {
            let m = missiles[i];
            m.z += m.speed;

            if (enemy.alive) {
                // Мощное угловое наведение: ракета корректирует траекторию точно на врага
                // Добавлено плавное донаведение (догон)
                m.x += (enemy.x - m.x) * 0.22; 
                m.y += ((enemy.y - jet.altitude) - m.y) * 0.22;
            }

            let mProj = project3D(m.x, m.y, m.z, jet.pitch, jet.roll);

            if (mProj.visible && m.z < 6000) {
                // Инверсионный след ракеты
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mProj.x, mProj.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'rgba(255, 150, 0, 0.6)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(mProj.x, mProj.y); ctx.lineTo(mProj.x, mProj.y + 15); ctx.stroke();

                // Расчет расстояния (3D радиус)
                let dist = Math.sqrt(Math.pow(m.x - enemy.x, 2) + Math.pow(m.y - (enemy.y - jet.altitude), 2) + Math.pow(m.z - enemy.z, 2));
                
                // Бесконтактный радиус взрыва увеличен до 300 единиц (теперь ракета точно зацепит цель!)
                if (dist < 300 && enemy.alive) {
                    enemy.alive = false;
                    missiles.splice(i, 1);
                    playCombatSound('boom');
                    score++;
                    document.getElementById('score-out').innerText = score;

                    // Отрисовка взрыва на ИЛС
                    ctx.fillStyle = '#ff3300'; ctx.beginPath(); ctx.arc(mProj.x, mProj.y, 90, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(mProj.x, mProj.y, 50, 0, Math.PI*2); ctx.fill();
                    continue;
                }
            } else {
                missiles.splice(i, 1);
            }
        }

        // Отрисовка нашего истребителя
        let myX = (canvas.width / 2) + (jet.roll * 60);
        let myY = (canvas.height * 0.65) + (jet.pitch * 40);
        drawOurJet(myX, myY, jet.roll);

        document.getElementById('alt-out').innerText = Math.floor(jet.altitude);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
