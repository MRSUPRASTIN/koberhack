<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELL-NET // EXPLOIT INTERFACE</title>
    <style>
        :root {
            --matrix-blue: #007acc;
            --matrix-glow: rgba(0, 122, 204, 0.6);
            --dark-core: #03060a;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-core);
            color: #fff; font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .main-container {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; box-sizing: border-box;
        }

        .terminal {
            width: 100%; max-width: 650px;
            background: rgba(4, 8, 15, 0.9);
            border: 1px solid var(--matrix-blue);
            box-shadow: 0 0 50px var(--matrix-glow);
            padding: 30px; border-radius: 4px; backdrop-filter: blur(15px);
            position: relative;
        }

        /* Линия сканирования */
        .terminal::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 122, 204, 0.2);
            animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .terminal-header {
            border-bottom: 1px solid var(--matrix-blue);
            padding-bottom: 12px; margin-bottom: 25px;
            font-size: 0.85rem; color: var(--matrix-blue);
            display: flex; justify-content: space-between;
            font-weight: bold; letter-spacing: 1px;
        }

        #slots-info {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 30, 30, 0.15);
            border: 1px solid #ff3333; padding: 12px;
            font-size: 0.8rem; color: #ff3333; z-index: 10;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .step-input h2 { margin: 0 0 15px; font-size: 1.4rem; color: var(--matrix-blue); text-transform: uppercase; }
        
        input[type="text"] {
            width: 100%; background: #000; border: 1px solid var(--matrix-blue);
            padding: 15px; color: #fff; font-family: monospace; outline: none;
            box-sizing: border-box; font-size: 1.1rem;
        }

        .action-btn {
            width: 100%; background: var(--matrix-blue); color: #000; border: none;
            padding: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            margin-top: 15px; transition: 0.3s;
        }
        .action-btn:hover { background: #fff; box-shadow: 0 0 20px #fff; }

        .step-loading { display: none; flex-direction: column; height: 320px; }
        .log-display {
            flex-grow: 1; background: #000; border: 1px solid #112233;
            padding: 15px; overflow-y: auto; font-size: 0.9rem; color: #aaddff;
            display: flex; flex-direction: column; gap: 8px;
        }
        .log-success { color: #00ff66; font-weight: bold; }

        .step-final { display: none; text-align: center; flex-direction: column; gap: 20px; }
        .timer-box { font-size: 2rem; color: #ff3333; font-weight: bold; text-shadow: 0 0 10px red; }
        
        .final-link {
            display: inline-block; background: var(--matrix-blue); color: #000;
            text-decoration: none; padding: 20px 40px; font-weight: bold;
            font-size: 1.2rem; box-shadow: 0 0 30px var(--matrix-glow);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        #live-notifications { position: fixed; bottom: 20px; left: 20px; z-index: 10; }
        .notify-toast {
            background: rgba(0, 122, 204, 0.1); border-left: 4px solid var(--matrix-blue);
            padding: 12px; margin-top: 10px; font-size: 0.8rem;
            animation: slide 0.5s ease; backdrop-filter: blur(5px);
        }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div id="slots-info">СЛОТОВ: <span id="slot-count">3</span>/100</div>
    <div id="live-notifications"></div>

    <div class="main-container">
        <div class="terminal">
            <div class="terminal-header">
                <span>CORE_BYPASS // v7.0</span>
                <span id="user-ip-header">SECURE_CONNECT</span>
            </div>

            <div id="block-input" class="step-input">
                <h2>Инициализация...</h2>
                <input type="text" id="target-input" placeholder="@username или ID" autocomplete="off">
                <button class="action-btn" onclick="startExploit()">Начать генерацию</button>
            </div>

            <div id="block-loading" class="step-loading">
                <div class="log-display" id="log-box"></div>
            </div>

            <div id="block-final" class="step-final">
                <div style="color:#00ff66; font-size: 1.3rem;">✓ ДОСТУП АКТИВИРОВАН</div>
                <div class="timer-box" id="countdown">05:00</div>
                <a href="https://t.me/mirieli1977" target="_blank" class="final-link">ПОЛУЧИТЬ В TELEGRAM</a>
            </div>
        </div>
    </div>

    <script>
        let userCity = "Moscow";
        let userIP = "127.0.0.1";

        // Попытка получить реальный IP
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(d => {
                userIP = d.ip;
                document.getElementById('user-ip-header').innerText = "IP: " + d.ip;
            });

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let particles = [];
        class Flame {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.speed = Math.random() * 3 + 1;
                this.radius = Math.random() * 30 + 10;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            draw() {
                this.y -= this.speed;
                this.opacity -= 0.003;
                if (this.opacity <= 0) this.reset();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 122, 255, ${this.opacity})`;
                ctx.shadowBlur = 20; ctx.shadowColor = "#007acc";
                ctx.fill();
            }
        }
        for(let i=0; i<60; i++) particles.push(new Flame());
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => p.draw());
            requestAnimationFrame(anim);
        }
        anim();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function beep() {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type='sine'; o.frequency.setValueAtTime(600, audioCtx.currentTime);
            g.gain.setValueAtTime(0.02, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.05);
        }

        function startExploit() {
            const input = document.getElementById('target-input').value.trim();
            if(!input) return;
            document.getElementById('block-input').style.display = 'none';
            document.getElementById('block-loading').style.display = 'flex';
            
            const logBox = document.getElementById('log-box');
            const logs = [
                "> Подключение к прокси...",
                `> ВХОДНОЙ УЗЕЛ: ${userIP}`,
                `> ПРОВЕРКА АККАУНТА: ${input}`,
                "> Сбор метаданных сессии...",
                "> Взлом протокола авторизации...",
                "> ГЕНЕРАЦИЯ ПРИВАТНОГО КЛЮЧА...",
                "[OK] ТОКЕН УСПЕШНО СОЗДАН."
            ];

            let i = 0;
            const t = setInterval(() => {
                if(i < logs.length) {
                    beep();
                    const p = document.createElement('p');
                    p.className = logs[i].includes('[OK]') ? 'log-success' : '';
                    p.innerText = logs[i];
                    logBox.appendChild(p);
                    logBox.scrollTop = logBox.scrollHeight;
                    i++;
                } else {
                    clearInterval(t);
                    setTimeout(() => {
                        document.getElementById('block-loading').style.display = 'none';
                        document.getElementById('block-final').style.display = 'flex';
                        let s = 300;
                        setInterval(() => {
                            let m = Math.floor(s/60); let sc = s%60;
                            document.getElementById('countdown').innerText = `0${m}:${sc<10?'0'+sc:sc}`;
                            if(s>0) s--;
                        }, 1000);
                    }, 1000);
                }
            }, 800);
        }

        const nicks = ['@dark_hacker', '@user_ton', '@crypto_vlad', '@bot_gen', '@admin_01'];
        setInterval(() => {
            const c = document.getElementById('live-notifications');
            const d = document.createElement('div'); d.className = 'notify-toast';
            d.innerText = `Пользователь ${nicks[Math.floor(Math.random()*nicks.length)]} получил доступ`;
            c.appendChild(d); setTimeout(() => d.remove(), 4000);
        }, 5000);
    </script>
</body>
</html>
