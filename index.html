<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NET-RUNNER // DECENTRALIZED TERMINAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        :root {
            --accent-blue: #007acc;
            --deep-glow: rgba(0, 122, 204, 0.4);
            --bg-dark: #060b13;
            --text-cyan: #aaddff;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Задний фон — динамическая сетка */
        #grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(0, 122, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 122, 204, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Большое пространство для скроллителлинга (прогрева) */
        .scroll-wrapper {
            position: relative;
            height: 250vh; 
        }

        /* Фиксированная секция анимации */
        .sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Экран-терминал, где меняются кадры при скролле */
        .visual-display {
            width: 90%;
            max-width: 750px;
            height: 380px;
            border: 1px solid var(--accent-blue);
            background: rgba(2, 4, 8, 0.95);
            box-shadow: 0 0 25px var(--deep-glow);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frame-content {
            width: 100%;
            height: 100%;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .system-title {
            font-size: 1.1rem;
            color: var(--accent-blue);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .scroll-status {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #555;
            text-transform: uppercase;
        }

        /* Нижняя конверсионная секция */
        .action-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #02050a;
            border-top: 1px solid var(--accent-blue);
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .conversion-box {
            width: 100%;
            max-width: 550px;
            background: var(--bg-dark);
            border: 1px solid var(--accent-blue);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 122, 204, 0.15);
        }

        .input-style {
            width: 100%;
            background: #000;
            border: 1px solid var(--accent-blue);
            padding: 14px;
            color: #fff;
            font-family: monospace;
            font-size: 1rem;
            box-sizing: border-box;
            margin-top: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        .input-style:focus {
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .tg-redirect-btn {
            display: block;
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            text-align: center;
            text-decoration: none;
            padding: 16px;
            font-weight: bold;
            font-size: 1.1rem;
            box-sizing: border-box;
            text-transform: uppercase;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .tg-redirect-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* Стили логов */
        .log-line { margin: 4px 0; font-size: 0.9rem; color: var(--text-cyan); }
        .log-success { color: #00ff66; }
        .log-accent { color: #ffcc00; }
    </style>
</head>
<body>

    <div id="grid-bg"></div>

    <!-- БЛОК 1: СКРОЛЛИТЕЛЛИНГ (Плавный прогрев пользователя при прокрутке) -->
    <div class="scroll-wrapper" id="scrollArea">
        <div class="sticky-container">
            <div class="system-title" id="top-status">CORE::CONNECTING_TO_NODES</div>
            
            <div class="visual-display">
                <div class="frame-content" id="terminal-screen">
                    <!-- Кадры генерируются через JS на основе скролла -->
                </div>
            </div>

            <div class="scroll-status">Листайте вниз для синхронизации потоков данных ↓</div>
        </div>
    </div>

    <!-- БЛОК 2: АКТИВАЦИЯ И СЛИВ ТРАФИКА -->
    <section class="action-section" id="target-section">
        <div class="conversion-box">
            <h2 style="margin-top: 0; color: var(--accent-blue); font-size: 1.4rem;">СИНХРОНИЗАЦИЯ ЗАВЕРШЕНА</h2>
            <p style="color: #888; font-size: 0.9rem; line-height: 1.4;">Для верификации сессии, генерации инвайт-токена и привязки вашего аккаунта введите ваш логин/идентификатор:</p>
            
            <input type="text" class="input-style" id="user-login" placeholder="@username или ID" autocomplete="off">
            
            <button class="tg-redirect-btn" onclick="redirectToChannel()">Активировать в Telegram</button>
        </div>
    </section>

    <script>
        // Кадры скроллителлинга (эмуляция генерации сетевых пакетов)
        const frames = [
            `<div class="log-line">[ NETWORK ] Инициализация защищенного шлюза...</div>
             <div class="log-line">[ STATUS ] Ожидание входящих запросов от прокси.</div>`,
            
            `<div class="log-line">[ NETWORK ] Подключение к распределенной сети TON...</div>
             <div class="log-line">[ OK ] Связь установлена через локальные ноды.</div>
             <div class="log-line">[ DATA ] Проверка целостности хэш-таблиц...</div>`,
            
            `<div class="log-line">[ STREAMS ] Перехват пакетов данных запущен...</div>
             <div class="log-line log-accent">[ PROGRESS ] Парсинг сегментов: 38%</div>
             <div class="log-line">> Извлечение временных конфигурационных файлов...</div>`,
            
            `<div class="log-line">[ STREAMS ] Анализ алгоритмов шифрования...</div>
             <div class="log-line log-success">[ SUCCESS ] Уязвимость в генерации seed-структуры найдена.</div>
             <div class="log-line log-accent">[ PROGRESS ] Компиляция эксплоита: 74%</div>`,
            
            `<div class="log-line log-success">[ SUCCESS ] Токен доступа успешно сгенерирован в памяти.</div>
             <div class="log-line">[ SYSTEM ] Выделение приватного виртуального канала...</div>
             <div class="log-line log-accent">> Готовность к перенаправлению на шлюз аутентификации.</div>`
        ];

        const screen = document.getElementById('terminal-screen');
        const topStatus = document.getElementById('top-status');
        const scrollArea = document.getElementById('scrollArea');

        // Рендерим стартовый кадр
        screen.innerHTML = frames[0];

        // Логика пошагового скролла (чистый JS без тяжелых библиотек для мгновенной загрузки)
        window.addEventListener('scroll', () => {
            const rect = scrollArea.getBoundingClientRect();
            const totalScroll = rect.height - window.innerHeight;
            const currentProgress = Math.abs(rect.top) / totalScroll;

            // Ограничиваем прогресс от 0 до 1
            const safeProgress = Math.max(0, Math.min(1, currentProgress));
            
            // Находим индекс текущего кадра
            const frameIndex = Math.floor(safeProgress * (frames.length - 1));
            screen.innerHTML = frames[frameIndex];

            // Динамически меняем верхний заголовок
            if (frameIndex === frames.length - 1) {
                topStatus.innerText = "CORE::READY_FOR_VERIFICATION";
                topStatus.style.color = "#00ff66";
            } else {
                topStatus.innerText = `CORE::PROCESSING_PACKETS_[${frameIndex + 1}/${frames.length}]`;
                topStatus.style.color = "var(--accent-blue)";
            }
        });

        // Функция редиректа на твой канал с проверкой ввода
        function redirectToChannel() {
            const loginInput = document.getElementById('user-login').value.trim();
            if (!loginInput) {
                alert('Пожалуйста, введите ваш ID или Юзернейм для завершения сессии!');
                return;
            }
            
            // Сливаем трафик на указанный тобой канал
            window.location.href = "https://t.me/mirieli1977";
        }
    </script>
</body>
</html>
