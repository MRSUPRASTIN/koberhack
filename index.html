<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Scroll Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        :root {
            --primary-color: #00ff41;
            --bg-color: #0d0208;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* Эффект Матрицы на фоне */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        /* Главная секция со скроллителлингом */
        .scroll-container {
            position: relative;
            height: 300vh; /* Высота для долгого скролла */
        }

        .sticky-element {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .image-wrapper {
            position: relative;
            width: 80%;
            max-width: 800px;
            height: 450px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 20px var(--primary-color);
            overflow: hidden;
        }

        .img-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* Замените URL на свои картинки */
        .img-before {
            background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=1000'); /* Чистый сервер */
            z-index: 2;
        }

        .img-after {
            background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&q=80&w=1000'); /* Взломанный сервер */
            z-index: 1;
        }

        .overlay-text {
            margin-top: 20px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        .content-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
        }

        .terminal-box {
            border: 1px solid var(--primary-color);
            padding: 20px;
            max-width: 600px;
            background: #000;
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div class="scroll-container">
        <div class="sticky-element">
            <h1 class="overlay-text" id="status-text">System Secure</h1>
            <div class="image-wrapper">
                <div class="img-layer img-before" id="before"></div>
                <div class="img-layer img-after"></div>
            </div>
            <p>Прокрутите вниз для инициализации взлома...</p>
        </div>
    </div>

    <section class="content-section">
        <div class="terminal-box">
            <h3>[ ОТЧЕТ О ВЗЛОМЕ ]</h3>
            <p>> База данных скомпрометирована...</p>
            <p>> Доступ получен: 100%</p>
            <p>> Все файлы зашифрованы.</p>
        </div>
    </section>

    <script>
        // 1. Анимация Матрицы
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(13, 2, 8, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // 2. Скроллителлинг (GSAP + ScrollTrigger)
        gsap.registerPlugin(ScrollTrigger);

        gsap.to("#before", {
            opacity: 0, // Плавное исчезновение верхней картинки
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "top top",
                end: "bottom bottom",
                scrub: true, // Привязка анимации к движению колесика
            }
        });

        gsap.to("#status-text", {
            innerText: "SYSTEM COMPROMISED",
            color: "#ff0000",
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "50% center",
                scrub: false,
                toggleActions: "play none none reverse"
            }
        });
    </script>
</body>
</html>
